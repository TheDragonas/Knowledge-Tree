    o.guid(GUID_X).u32(0x80000000).u32(0x7FFFFFFF).u32(2).bytes(f32(1000));
    o.guid(GUID_Y).u32(0x80000000).u32(0x7FFFFFFF).u32(2).bytes(f32(1000));
    if (withPressure) o.guid(GUID_P).u32(0).u32(32767).u32(0).bytes(f32(0));
    return o.done();
  }

  /* Seite (Zwischenformat) -> Objektraum
   * page = { title, created, modified, level, items: [
   *   { kind:'outline', x, y, w, paras:[{ depth, style, align, runs:[{text,b,i,u,s,sup,sub,color,hl,font,size,href,math}], image? }] },
   *   { kind:'image', x, y, w, h, fileGuid, ext, name },
   *   { kind:'ink', strokes:[{ pts:[{x,y,p}], w, color, marker }] } ] }   (Koordinaten in px, Seitenursprung) */
  function buildPage(page, files) {
    const sp = new Space();
    const now = page.modified || Date.now();
    const T32 = time32(now), created = page.created || now;
    const author = sp.add(J.Author, [[P.AuthorInitials, utf16z(INITIALS)], [P.AuthorName, utf16z(AUTHOR)], [P.X1C001E30, new Uint8Array(2)]]);
    const manifest = sp.add(J.PageManifestNode);
    const meta = sp.add(J.PageMetaData, [
      [P.CachedTitleString, utf16z(page.title || '')], [P.NotebookManagementEntityGuid, guidBytes(newGuid())], [P.PageLevel, u32b((page.level || 0) + 1)],
      [P.SchemaRevisionInOrderToRead, u32b(40)], [P.X1400348B, u32b(40)], [P.TopologyCreationTimeStamp, fileTime(created)],
    ]);
    const revMeta = sp.add(J.RevisionMetaData, [[P.AuthorMostRecent, author], [P.LastModifiedTimeStamp, fileTime(now)]]);
    const styles = new Map(), runFmts = new Map();
    const paraStyle = (id, fmt = {}) => {
      const d = { ...(PARA_STYLES[id] || PARA_STYLES.p), ...fmt };
      const key = id + JSON.stringify(d);
      if (styles.has(key)) return styles.get(key);
      const o = sp.add(J.ParagraphStyleObject, [
        [P.ParagraphStyleId, utf16z(id)], [P.Bold, !!d.b], [P.Italic, !!d.i], [P.Underline, false], [P.FontColor, colorRef(d.color)],
        [P.ParagraphSpaceBefore, f32(d.before || 0)], [P.ParagraphSpaceAfter, f32(d.after || 0)], [P.ParagraphLineSpacingExact, f32(d.lineExact || 0)],
        [P.Strikethrough, false], [P.Highlight, colorRef(null)], [P.Subscript, false], [P.Superscript, false],
        [P.Font, utf16z(d.font || 'Calibri')], [P.FontSize, Math.round((d.size || 11) * 2)],
      ]);
      styles.set(key, o);
      return o;
    };
    const runFmt = (r) => {
      const props = [[P.Hidden, false], [P.X080034AA, false], [P.Hyperlink, !!r.href], [P.HyperlinkProtected, false], [P.LanguageID, u32b(LANG)], [P.Charset, 0], [P.X0C003452, 0], [P.MathFormatting, false], [P.X08003405, false], [P.X08003406, false]];
      if (r.b != null) props.push([P.Bold, !!r.b]);
      if (r.i != null) props.push([P.Italic, !!r.i]);
      if (r.u) props.push([P.Underline, true]);
      if (r.s) props.push([P.Strikethrough, true]);
      if (r.sup) props.push([P.Superscript, true]);
      if (r.sub) props.push([P.Subscript, true]);
      if (r.color) props.push([P.FontColor, colorRef(r.color)]);
      if (r.hl) props.push([P.Highlight, colorRef(r.hl)]);
      if (r.font) props.push([P.Font, utf16z(r.font)]);
      if (r.size) props.push([P.FontSize, Math.round(r.size * 2)]);
      const key = JSON.stringify(props.map(([k, v]) => [k, v instanceof Uint8Array ? [...v] : v]));
      if (runFmts.has(key)) return runFmts.get(key);
      const o = sp.add(J.ParagraphStyleObject, props);
      runFmts.set(key, o);
      return o;
    };
    const richText = (para, extra = []) => {
      // Hyperlinks als Feld: U+FDDF HYPERLINK "adresse" + angezeigter Text
      const runs = [];
      for (const r of para.runs) {
        if (!r.text) continue;
        if (r.href) runs.push({ ...r, text: `﷟HYPERLINK "${r.href}"` });
        runs.push(r);
      }
      const text = runs.map(r => r.text).join('');
      const props = [[P.LastModifiedTime, T32], [P.ParagraphStyle, paraStyle(para.style || 'p', para.styleFmt)], ...extra];
      if (para.align === 'center') props.push([P.ParagraphAlignment, 1]);
      else if (para.align === 'right') props.push([P.ParagraphAlignment, 2]);
      props.push([P.RichEditTextLangID, LANG]);
      if (runs.length > 1) {
        const idx = new Out(runs.length * 4);
        let pos = 0;
        for (let i = 0; i < runs.length - 1; i++) { pos += runs[i].text.length; idx.u32(pos); }
        props.push([P.TextRunIndex, idx.done()]);
      }
      props.push([P.TextRunFormatting, (runs.length ? runs : [{}]).map(runFmt)]);
      const cp = toCp1252(text);
      if (cp && !/[﷟]/.test(text)) props.push([P.TextExtendedAscii, cp]);
      else props.push([P.RichEditTextUnicode, utf16(text)]);
      props.push([P.X080034DD, true]);
      return sp.add(J.RichTextOENode, props);
    };
    const imageNode = (im, pos) => {
      const props = [[P.LastModifiedTime, T32]];
      if (pos) props.push([P.OffsetFromParentHoriz, f32(im.x / HI)], [P.OffsetFromParentVert, f32(im.y / HI)]);
      if (im.fileGuid) {
        const pc = sp.add(J.PictureContainer14);
        pc.file = { ref: `<ifndf>${im.fileGuid}`, ext: im.ext || '.png' };
        props.push([P.PictureContainer, pc]);
      }
      props.push([P.LayoutMaxWidth, f32(im.w / HI)], [P.LayoutMaxHeight, f32(im.h / HI)], [P.PictureWidth, f32(im.w / HI)], [P.PictureHeight, f32(im.h / HI)]);
      if (im.name) props.push([P.ImageFilename, utf16z(im.name)]);
      if (im.alt) props.push([P.ImageAltText, utf16z(im.alt)]);
      return sp.add(J.ImageNode, props);
    };
    const oe = (content, kids, extra = []) => {
      const props = [[P.LastModifiedTime, T32], [P.AuthorMostRecent, author], [P.AuthorOriginal, author], [P.CreationTimeStamp, time32(created)], [P.OutlineElementChildLevel, 1]];
      if (content) props.push([P.ContentChildNodes, [content]]);
      if (kids && kids.length) props.push([P.ElementChildNodes, kids]);
      props.push(...extra, [P.OutlineElementRTL, false]);
      return sp.add(J.OutlineElementNode, props);
    };
    const indents = new Uint8Array([4, 3, 0, 0, ...f32(0.5), ...f32(0), ...f32(0.75), ...f32(0.75)]);
    // Titel
    const titleOE = oe(richText({ style: 'PageTitle', runs: [{ text: page.title || '' }] }, [[P.IsTitleText, true]]), null, [[P.CannotBeSelected, true], [P.IsTitleText, true]]);
    const titleOutline = sp.add(J.OutlineNode, [
      [P.LastModifiedTime, T32], [P.ElementChildNodes, [titleOE]], [P.RgOutlineIndentDistance, indents], [P.OutlineElementChildLevel, 1],
      [P.LayoutMaxHeight, f32(0.6)], [P.DescendantsCannotBeMoved, true], [P.CannotBeSelected, true], [P.IsTitleText, true], [P.EnforceOutlineStructure, true],
      [P.LayoutMinimumOutlineWidth, f32(4.5)], [P.LayoutTightAlignment, true], [P.LayoutAlignmentInParent, u32b(0)], [P.LayoutAlignmentSelf, u32b(12)], [P.LayoutMaxWidth, f32(8.3125)],
    ]);
    const d = new Date(created);
    const dateTxt = d.toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const timeTxt = d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
    const boiler = (flag) => [[P.IsReadOnly, true], [P.LayoutAlignmentInParent, u32b(1)], [P.LayoutAlignmentSelf, u32b(12)], [P.LayoutTightLayout, true], [P.IsBoilerText, true], [P.Deletable, true], [flag, true]];
    const dateOE = oe(richText({ style: 'PageDateTime', runs: [{ text: dateTxt }] }, boiler(P.IsTitleDate)), null, [[P.CannotBeSelected, true], [P.Deletable, true]]);
    const timeOE = oe(richText({ style: 'PageDateTime', runs: [{ text: timeTxt }] }, boiler(P.IsTitleTime)), null, [[P.CannotBeSelected, true], [P.Deletable, true]]);
    const dateOutline = sp.add(J.OutlineNode, [
      [P.LastModifiedTime, T32], [P.ElementChildNodes, [dateOE, timeOE]], [P.RgOutlineIndentDistance, indents], [P.OutlineElementChildLevel, 1], [P.LayoutMaxHeight, f32(0.6)],
      [P.IsTitleDate, true], [P.LayoutTightLayout, true], [P.CannotBeSelected, true], [P.IsReadOnly, true], [P.Deletable, true],
      [P.LayoutAlignmentInParent, u32b(0)], [P.LayoutAlignmentSelf, u32b(12)], [P.LayoutMaxWidth, f32(8.3125)],
    ]);
    const title = sp.add(J.TitleNode, [
      [P.LastModifiedTime, T32], [P.OffsetFromParentHoriz, f32(0)], [P.OffsetFromParentVert, f32(0)], [P.LayoutAlignmentInParent, u32b(0x0009000C)],
      [P.LayoutAlignmentSelf, u32b(0)], [P.LayoutCollisionPriority, u32b(0)], [P.ElementChildNodes, [titleOutline, dateOutline]],
    ]);
    // Inhalte
    const elems = [];
    for (const it of page.items) {
      if (it.kind === 'outline') {
        // flache Absätze mit Tiefe -> verschachtelte Elemente
        const build = (list, i, depth) => {
          const out = [];
          while (i < list.length && list[i].depth >= depth) {
            const p = list[i];
            if (p.depth > depth) { const r = build(list, i, p.depth); if (out.length) { const last = out[out.length - 1]; last.kids.push(...r.out); } else out.push(...r.out); i = r.i; continue; }
            out.push({ p, kids: [] });
            i++;
          }
          return { out, i };
        };
        const tree = build(it.paras.map(p => ({ ...p, depth: Math.max(0, p.depth | 0) })), 0, 0).out;
        const mk = (nodes) => nodes.map(n => oe(n.p.image ? imageNode(n.p.image, false) : richText(n.p), mk(n.kids)));
        const kids = mk(tree);
        if (!kids.length) continue;
        elems.push(sp.add(J.OutlineNode, [
          [P.LastModifiedTime, T32], [P.ElementChildNodes, kids], [P.RgOutlineIndentDistance, indents], [P.OutlineElementChildLevel, 1],
          [P.OffsetFromParentHoriz, f32(it.x / HI)], [P.OffsetFromParentVert, f32(it.y / HI)],
          [P.LayoutMaxWidth, f32(Math.max(40, it.w) / HI)], [P.IsLayoutSizeSetByUser, true],
          [P.LayoutAlignmentInParent, u32b(0)], [P.LayoutAlignmentSelf, u32b(0)],
        ]));
      } else if (it.kind === 'image') {
        elems.push(imageNode(it, true));
      } else if (it.kind === 'ink' && it.strokes.length) {
        const strokes = [];
        for (const s of it.strokes) {
          if (!s.pts || s.pts.length < 1) continue;
          const pts = s.pts.length === 1 ? [s.pts[0], { ...s.pts[0], x: s.pts[0].x + 0.1 }] : s.pts;
          const withP = !s.marker && pts.some(q => q.p != null);
          const xs = pts.map(q => Math.round(q.x * HIMETRIC)), ys = pts.map(q => Math.round(q.y * HIMETRIC));
          const chans = [xs, ys];
          if (withP) chans.push(pts.map(q => Math.round(Math.max(0.05, Math.min(1, (q.p ?? 0.5) * 1.5)) * 32767)));
          const w = Math.max(1, (s.w || 2) * HIMETRIC);
          const pprops = [[P.InkMetric, metric(withP)], [P.InkColor, colorRef(s.color || '#000000')], [P.InkWidth, f32(w)], [P.InkHeight, f32(w)]];
          if (s.marker) pprops.push([P.InkHighlighter, true], [P.InkTip, 1], [P.InkRasterOp, 9]);
          const pp = sp.add(J.InkStrokeProperties, pprops);
          strokes.push(sp.add(J.InkStroke, [[P.InkPath, isfPath(chans)], [P.InkLang, LANG], [P.InkX0C00341C, 0], [P.InkX0C003610, 0], [P.InkGuid, guidBytes(newGuid())], [P.InkTime, fileTime(s.t0 || now)], [P.InkProps, pp]]));
        }
        if (!strokes.length) continue;
        const data = sp.add(J.InkData, [[P.InkStrokes, strokes]]);
        elems.push(sp.add(J.InkContainer, [[P.LastModifiedTime, T32], [P.OffsetFromParentHoriz, f32(0)], [P.OffsetFromParentVert, f32(0)], [P.InkData, data], [P.InkKind, u32b(1)]]));
      }
    }
    const pageNode = sp.add(J.PageNode, [
      [P.LastModifiedTime, T32],
      ...(elems.length ? [[P.ElementChildNodes, elems]] : []),
      [P.StructureElementChildNodes, [title]], [P.LayoutResolveChildCollisions, true], [P.PortraitPage, true],
      [P.PageMarginTop, f32(1)], [P.PageMarginBottom, f32(1)], [P.PageMarginLeft, f32(2)], [P.PageMarginRight, f32(2)],
      [P.PageWidth, f32(20.944)], [P.PageHeight, f32(21.75)], [P.X14001C9E, f32(0.5)], [P.X14001C9F, f32(0.5)], [P.X14001CA0, f32(0.25)], [P.X14001CA1, f32(0.25)],
      [P.AuthorName, utf16z(AUTHOR)], [P.AuthorInitials, utf16z(INITIALS)], [P.AuthorOriginal, author], [P.AuthorMostRecent, author],
      [P.EditRootRTL, false], [P.PageMarginOriginX, f32(1)], [P.PageMarginOriginY, f32(0.4)], [P.X14001D5C, u32b(26)], [P.X14003653, u32b(16)],
      [P.X1C001D5D, new Uint8Array([0])], [P.NotebookManagementEntityGuid, guidBytes(newGuid())],
    ]);
    manifest.props.push([P.ContentChildNodes, [pageNode]]);
    sp.root(1, manifest); sp.root(2, meta); sp.root(4, revMeta);
    void files;
    return sp;
  }

  /* Abschnitt: pages -> .one */
  function buildSection(pages) {
    const files = [];
    const pageSpaces = [];
    for (const pg of pages) {
      for (const it of pg.items) {
        const imgs = it.kind === 'image' ? [it] : it.kind === 'outline' ? it.paras.filter(p => p.image).map(p => p.image) : [];
        for (const im of imgs) if (im.data && !im.fileGuid) { im.fileGuid = newGuid(); files.push({ guid: im.fileGuid, data: im.data }); }
      }
      pageSpaces.push(buildPage(pg, files));
    }
    const sec = new Space();
    const now = Date.now();
    const series = sec.add(J.PageSeriesNode, [[P.ChildGraphSpaceElementNodes, pageSpaces.map(s => s.gosid)], [P.NotebookManagementEntityGuid, guidBytes(newGuid())], [P.TopologyCreationTimeStamp, fileTime(now)]]);
    const node = sec.add(J.SectionNode, [[P.NotebookManagementEntityGuid, guidBytes(newGuid())], [P.TopologyCreationTimeStamp, fileTime(now)], [P.ElementChildNodes, [series]]]);
    const meta = sec.add(J.SectionMetaData, [[P.SchemaRevisionInOrderToRead, u32b(40)], [P.X1400348B, u32b(40)]]);
    sec.root(1, node); sec.root(2, meta);
    const fb = new FileBuilder(false);
    return fb.finish(sec, [sec, ...pageSpaces], files, '{7B5C52E4-D88C-4DA7-AEB1-5378D02996D3}');
  }

  /* Inhaltsverzeichnis: entries = [{ file, color }] in Reihenfolge */
  function buildToc(entries, color) {
    const sp = new Space();
    const kids = entries.map((e, i) => {
      const props = [[P.TocGuid, guidBytes(newGuid())], [P.TocOrder, u32b(i + 1)], [P.TocFileName, utf16z(e.file)]];
      if (e.color) props.push([P.TocColor, colorRef(e.color)]);
      return sp.add(J.TocEntry, props);
    });
    const rootProps = [[P.TocChildren, kids]];
    if (color) rootProps.push([P.TocColor, colorRef(color)]);
    const root = sp.add(J.TocEntry, rootProps);
    sp.root(1, root);
    const fb = new FileBuilder(true);
    return fb.finish(sp, [sp], [], '{43FF2FA1-EFD9-4C76-9EE2-10EA5722765F}');
  }

  /* CAB ohne Kompression: files = [{ name ('Ordner\\Datei'), data }] */
  function buildCab(files) {
    const enc = new TextEncoder();
    const names = files.map(f => enc.encode(f.name.replace(/\//g, '\\')));
    const total = files.reduce((a, f) => a + f.data.length, 0);
    const all = new Uint8Array(total);
    let off = 0;
    const offs = files.map(f => { const o = off; all.set(f.data, off); off += f.data.length; return o; });
    const BLK = 32768;
    const nData = Math.max(1, Math.ceil(total / BLK));
    const hdrLen = 36, folderLen = 8;
    const filesLen = files.reduce((a, f, i) => a + 16 + names[i].length + 1, 0);
    const dataStart = hdrLen + folderLen + filesLen;
    const cabLen = dataStart + nData * 8 + total;
    const o = new Out(cabLen + 16);
    o.bytes(new Uint8Array([0x4D, 0x53, 0x43, 0x46])).u32(0).u32(cabLen).u32(0).u32(hdrLen + folderLen).u32(0).u8(3).u8(1).u16(1).u16(files.length).u16(0).u16(0x1234).u16(0);
    o.u32(dataStart).u16(nData).u16(0);
    const d = new Date();
    const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
    files.forEach((f, i) => {
      const utf8 = /[^\x00-\x7F]/.test(f.name);
      o.u32(f.data.length).u32(offs[i]).u16(0).u16(dosDate).u16(dosTime).u16(0x20 | (utf8 ? 0x80 : 0)).bytes(names[i]).u8(0);
    });
    for (let i = 0; i < nData; i++) {
      const part = all.subarray(i * BLK, Math.min(total, (i + 1) * BLK));
      o.u32(0).u16(part.length).u16(part.length).bytes(part);
    }
    return o.done();
  }

  /* ================================================================ Teil 2: KnowledgeTree -> OneNote (im Browser) */
  const ON_TITLE = 56; // Platz für Titel und Datum oben auf der OneNote-Seite (wie beim Import)
  const hex2 = (n) => Math.round(n).toString(16).padStart(2, '0');
  const cssHex = (c) => {
    const m = /rgba?\(\s*([\d.]+)[ ,]+([\d.]+)[ ,]+([\d.]+)(?:[ ,/]+([\d.]+%?))?/.exec(c || '');
    if (!m) return /^#[0-9a-f]{6}$/i.test(c || '') ? c.toLowerCase() : null;
    if (m[4] !== undefined && parseFloat(m[4]) === 0) return null;
    return '#' + hex2(+m[1]) + hex2(+m[2]) + hex2(+m[3]);
  };
  const firstFont = (ff) => {
    const f = (ff || '').split(',')[0].trim().replace(/^["']|["']$/g, '');
    if (!f || /^(sans-serif|serif|system-ui|-apple-system|ui-sans-serif|monospace)$/i.test(f)) return 'Calibri';
    return /^carlito$/i.test(f) ? 'Calibri' : f;
  };
  const ptOf = (px) => Math.round(parseFloat(px) * 0.75 * 2) / 2;

  /* Bilddaten holen; Formate, die OneNote nicht kennt, als PNG */
  async function imageBytes(name) {
    let blob;
    try { const r = await fetch(await Backend.imgURL(name)); if (!r.ok) return null; blob = await r.blob(); } catch (e) { return null; }
    let type = blob.type || '';
    if (!/^image\/(png|jpeg|gif|bmp)$/.test(type)) {
      try {
        const bmp = await createImageBitmap(blob);
        const c = document.createElement('canvas');
        c.width = bmp.width; c.height = bmp.height;
        c.getContext('2d').drawImage(bmp, 0, 0);
        blob = await new Promise(res => c.toBlob(res, 'image/png'));
        type = 'image/png';
      } catch (e) { return null; }
    }
    const ext = { 'image/png': '.png', 'image/jpeg': '.jpg', 'image/gif': '.gif', 'image/bmp': '.bmp' }[type] || '.png';
    return { data: new Uint8Array(await blob.arrayBuffer()), ext };
  }

  /* Text eines Feldes (gerendert) -> Absätze mit Läufen */
  async function htmlParas(root) {
    const paras = [];
    const rootCs = getComputedStyle(root);
    const inkColor = cssHex(rootCs.color);
    let cur = null;
    const blockFmt = (el) => {
      const cs = getComputedStyle(el);
      const color = cssHex(cs.color);
      const f = { font: firstFont(cs.fontFamily), size: ptOf(cs.fontSize), color: color && color !== inkColor ? color : null, b: parseInt(cs.fontWeight, 10) >= 600, i: cs.fontStyle === 'italic' };
      // Zeilenhöhe wie in KnowledgeTree (OneNote: genauer Zeilenabstand in pt), Abstände vor/nach dem Absatz
      const lh = parseFloat(cs.lineHeight);
      if (lh > 0 && cs.lineHeight !== 'normal') f.lineExact = Math.round(lh * 0.75 * 100) / 100;
      const mt = parseFloat(cs.marginTop) || 0, mb = parseFloat(cs.marginBottom) || 0;
      if (mt > 0.5 && el !== root) f.before = Math.round(mt * 0.75 * 100) / 100;
      if (mb > 0.5 && el !== root) f.after = Math.round(mb * 0.75 * 100) / 100;
      return f;
    };
    const styleOf = (el) => { const t = el.tagName; return /^H[1-6]$/.test(t) ? t.toLowerCase() : t === 'PRE' ? 'code' : t === 'BLOCKQUOTE' ? 'quote' : 'p'; };
    const open = (el, depth, prefix) => {
      flush();
      const cs = getComputedStyle(el);
      const ml = parseFloat(cs.marginLeft) || 0;
      cur = { depth: depth + (el.tagName === 'DIV' && ml > 18 ? Math.round(ml / 36) || 1 : 0), style: styleOf(el), styleFmt: blockFmt(el), align: cs.textAlign === 'center' ? 'center' : cs.textAlign === 'right' || cs.textAlign === 'end' ? 'right' : null, runs: [], block: el };
      if (prefix) cur.runs.push({ text: prefix, prefix: true });
    };
    const flush = () => { if (cur) { paras.push(cur); cur = null; } };
    const ensure = (el, depth) => { if (!cur) open(el.closest('div, p, h1, h2, h3, h4, h5, h6, li, pre, blockquote, td') || root, depth); };
    const runOf = (textEl, text) => {
      const cs = getComputedStyle(textEl);
      const r = { text };
      const base = cur.styleFmt;
      const font = firstFont(cs.fontFamily), size = ptOf(cs.fontSize), color = cssHex(cs.color);
      const b = parseInt(cs.fontWeight, 10) >= 600, i = cs.fontStyle === 'italic';
      if (font !== base.font) r.font = font;
      if (size !== base.size) r.size = size;
      if (color && color !== inkColor && color !== base.color) r.color = color;
      if (b !== base.b) r.b = b;
      if (i !== base.i) r.i = i;
      for (let e = textEl; e && e !== root && e !== cur.block; e = e.parentElement) {
        const ecs = getComputedStyle(e);
        const dl = ecs.textDecorationLine || '';
        if (/underline/.test(dl) && e.tagName !== 'A') r.u = true;
        if (/line-through/.test(dl)) r.s = true;
        if (e.tagName === 'SUP' || ecs.verticalAlign === 'super') r.sup = true;
        if (e.tagName === 'SUB' || ecs.verticalAlign === 'sub') r.sub = true;
        if (!r.hl) { const bg = cssHex(ecs.backgroundColor); if (bg) r.hl = bg; }
      }
      const a = textEl.closest('a[href]');
      if (a && root.contains(a) && !a.classList.contains('kt-file') && /^(https?:|mailto:)/i.test(a.getAttribute('href'))) r.href = a.getAttribute('href');
      return r;
    };
    const walk = async (node, depth) => {
      for (const n of [...node.childNodes]) {
        if (n.nodeType === 3) {
          const t = n.nodeValue.replace(/​/g, '').replace(/[\r\n]+/g, ' ');
          if (!t) continue;
          ensure(n.parentElement, depth);
          cur.runs.push(runOf(n.parentElement, t));
          continue;
        }
        if (n.nodeType !== 1) continue;
        const tag = n.tagName;
        if (n.classList.contains('kt-math')) { ensure(node, depth); cur.runs.push({ text: n.dataset.tex || n.textContent, font: 'Cambria Math' }); continue; }
        if (n.classList.contains('kt-file')) { ensure(node, depth); cur.runs.push({ text: '📎 ' + (n.dataset.name || n.textContent.replace(/^📎\s*/, '')) }); continue; }
        if (tag === 'BR') {
          if (cur && n.nextSibling && !(n.nextSibling.nodeType === 1 && /^(DIV|P|UL|OL|TABLE|H\d)$/.test(n.nextSibling.tagName))) cur.runs.push({ text: '\u000b' });
          continue;
        }
        if (tag === 'IMG') {
          const name = n.dataset.ktSrc;
          const im = name ? await imageBytes(name) : null;
          if (im) {
            const d0 = cur ? cur.depth : depth;
            if (cur && !cur.runs.length) cur = null; else flush();
            const r = n.getBoundingClientRect(), z = Canvas.view.z || 1;
            paras.push({ depth: d0, image: { ...im, w: Math.max(4, r.width / z), h: Math.max(4, r.height / z), alt: n.alt || '' } });
          }
          continue;
        }
        if (tag === 'HR') { flush(); open(n, depth); cur.runs.push({ text: '────────────────', color: '#a19f9d' }); flush(); continue; }
        if (tag === 'UL' || tag === 'OL') { flush(); await walk(n, depth); flush(); continue; }
        if (tag === 'LI') {
          const list = n.parentElement;
          let lv = -1;
          for (let e = n.parentElement; e && e !== root; e = e.parentElement) if (e.tagName === 'UL' || e.tagName === 'OL') lv++;
          lv = Math.max(0, lv);
          let prefix = '• ';
          if (list.classList.contains('checklist')) prefix = n.classList.contains('done') ? '☑ ' : '☐ ';
          else if (list.tagName === 'OL') prefix = ([...list.children].filter(c => c.tagName === 'LI').indexOf(n) + 1) + '. ';
          else if (lv % 2 === 1) prefix = '◦ ';
          open(n, depth + lv, prefix);
          await walk(n, depth + lv);
          flush();
          continue;
        }
        if (tag === 'TABLE') {
          flush();
          for (const tr of n.querySelectorAll('tr')) {
            open(tr.cells[0] || tr, depth);
            const block = cur;
            // Zelleninhalt als Text (Absätze in der Zelle durch Leerzeichen getrennt)
            const parts = [...tr.cells].map(td => td.innerText.replace(/\s*\n\s*/g, ' ').trim());
            block.runs = parts.flatMap((t, k) => k ? [{ text: '\t' }, { text: t }] : [{ text: t }]).filter(r => r.text);
            flush();
          }
          continue;
        }
        if (/^(DIV|P|H[1-6]|PRE|BLOCKQUOTE)$/.test(tag)) {
          // Block direkt nach dem Aufzählungszeichen gehört zum selben Absatz
          if (cur && cur.runs.length && cur.runs.every(r => r.prefix)) { await walk(n, cur.depth); continue; }
          open(n, depth); await walk(n, depth); flush(); continue;
        }
        await walk(n, depth);
      }
    };
    await walk(root, 0);
    flush();
    // leere Absätze am Ende weglassen, Leerzeichen-Läufe zusammenfassen
    for (const p of paras) if (p.runs) { p.runs = p.runs.filter(r => r.text !== '').map(r => { delete r.prefix; return r; }); delete p.block; }
    while (paras.length && !paras[paras.length - 1].image && !paras[paras.length - 1].runs.some(r => r.text.trim())) paras.pop();
    return paras;
  }

  /* SVG-Pfad (Verbindung) abtasten */
  const samplePath = (path, step = 6) => {
    try {
      const L = path.getTotalLength();
      const n = Math.max(2, Math.min(400, Math.ceil(L / step) + 1));
      const out = [];
      for (let i = 0; i < n; i++) { const p = path.getPointAtLength(L * i / (n - 1)); out.push({ x: p.x, y: p.y }); }
      return out;
    } catch (e) { return []; }
  };
  const roundRect = (x, y, w, h, r) => {
    const pts = [];
    const arc = (cx, cy, a0) => { for (let k = 0; k <= 4; k++) { const a = a0 + k * Math.PI / 8; pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }); } };
    arc(x + w - r, y + r, -Math.PI / 2); arc(x + w - r, y + h - r, 0); arc(x + r, y + h - r, Math.PI / 2); arc(x + r, y + r, Math.PI);
    pts.push({ ...pts[0] });
    return pts;
  };
  const arrowHead = (a, b, w) => {
    const L = Math.hypot(b.x - a.x, b.y - a.y) || 1, ux = (b.x - a.x) / L, uy = (b.y - a.y) / L;
    const s = Math.max(8, w * 3.5);
    return [{ x: b.x - ux * s - uy * s * 0.5, y: b.y - uy * s + ux * s * 0.5 }, b, { x: b.x - ux * s + uy * s * 0.5, y: b.y - uy * s - ux * s * 0.5 }];
  };

  /* gerenderte Seite (Canvas zeigt sie gerade) -> Zwischenformat */
  async function pageModel(page) {
    const z = Canvas.view.z || 1;
    const wr = $('#world').getBoundingClientRect();
    const W = (r) => ({ x: (r.left - wr.left) / z, y: (r.top - wr.top) / z, w: r.width / z, h: r.height / z });
    const items = [];
    const frames = [];
    const dense = (pts, step = 4) => {
      const out = [];
      pts.forEach((q, i) => {
        if (i) { const a = pts[i - 1], L = Math.hypot(q.x - a.x, q.y - a.y), n = Math.floor(L / step); for (let k = 1; k < n; k++) out.push({ x: a.x + (q.x - a.x) * k / n, y: a.y + (q.y - a.y) * k / n, p: q.p }); }
        out.push(q);
      });
      return out;
    };
    const ink = (pts, color, w, opts = {}) => { if (pts.length) frames.push({ pts: (opts.raw ? pts : dense(pts)).map(p => ({ x: p.x, y: p.y, p: p.p })), color: color || '#000000', w, marker: !!opts.marker, t0: opts.t0 }); };
    // Pakete (Rahmen + Titel)
    for (const k of page.pkgs) {
      const r = Canvas.rects.get(k.id);
      if (!r) continue;
      ink(roundRect(r.x, r.y, r.w, r.h, 8), k.color || '#6b4fbb', 2);
      items.push({ kind: 'outline', x: r.x + 10, y: r.y + 3, w: Math.max(60, r.w - 20), paras: [{ depth: 0, style: 'p', styleFmt: { font: 'Calibri', size: 10, b: true, color: k.color || null }, runs: [{ text: k.title || 'Paket' }] }] });
    }
    // Verbindungen
    for (const path of document.querySelectorAll('#links-g path.link')) {
      const cs = getComputedStyle(path);
      const col = cssHex(cs.stroke) || '#8e8aa0';
      ink(samplePath(path), col, parseFloat(path.getAttribute('stroke-width')) || 2);
    }
    for (const path of document.querySelectorAll('#links-g path.link-arrow')) {
      const pts = samplePath(path, 3);
      ink(pts, cssHex(getComputedStyle(path).fill) || '#8e8aa0', 2);
    }
    for (const t of document.querySelectorAll('#links-g text.link-label')) {
      const r = W(t.getBoundingClientRect());
      items.push({ kind: 'outline', x: r.x, y: r.y, w: Math.max(30, r.w + 8), paras: [{ depth: 0, style: 'p', styleFmt: { size: 10 }, runs: [{ text: t.textContent }] }] });
    }
    // Textfelder
    for (const b of [...page.boxes].sort((a, c) => a.z - c.z)) {
      const e = Canvas.els.get(b.id);
      if (!e) continue;
      const st = b.style || {};
      const r = Canvas.rects.get(b.id) || { x: b.x, y: b.y, w: b.w, h: e.offsetHeight };
      if (st.bg !== 'transparent') ink(roundRect(r.x, r.y, r.w, r.h, 7), st.border || (st.bg && st.bg !== 'transparent' ? st.bg : '#c8c6c4'), 1);
      const paras = await htmlParas(e.querySelector('.box-text'));
      if (paras.length) items.push({ kind: 'outline', x: b.x + 11, y: b.y + 13, w: b.w - 22, paras });
      for (const f of e.querySelectorAll('.fimg')) {
        const im = b.images.find(q => q.id === f.dataset.img);
        const data = im && await imageBytes(im.src);
        if (!data) continue;
        const fr = W(f.getBoundingClientRect());
        items.push({ kind: 'image', x: fr.x, y: fr.y, w: fr.w, h: fr.h, ...data });
      }
    }
    // Zeichnungen
    for (const d of page.drawings) {
      const color = /^#[0-9a-f]{6}$/i.test(d.color || '') ? d.color : d.kind === 'rainbow' ? '#bf5af2' : d.kind === 'glitter' ? '#c9a227' : '#1f1f1f';
      if (d.type === 'ink') { ink(DG.inkPts(d), color, d.w, { marker: d.kind === 'marker', t0: d.t0, raw: true }); continue; }
      const { lines } = DG.lines(d);
      for (const l of lines) ink(l, color, d.w, { t0: d.t0 });
      const heads = [];
      if (d.shape === 'arrow' || d.shape === 'darrow') heads.push(arrowHead({ x: d.x1, y: d.y1 }, { x: d.x2, y: d.y2 }, d.w));
      if (d.shape === 'darrow') heads.push(arrowHead({ x: d.x2, y: d.y2 }, { x: d.x1, y: d.y1 }, d.w));
      if (d.shape === 'axes') { const l = lines; heads.push(arrowHead(l[0][0], l[0][1], d.w), arrowHead(l[1][0], l[1][1], d.w)); }
      for (const h of heads) ink(h, color, d.w, { t0: d.t0 });
    }
    if (frames.length) items.unshift({ kind: 'ink', strokes: frames });
    // Lage: Titelbereich oben frei lassen, nichts links/oben aus der Seite
    let minX = Infinity, minY = Infinity;
    for (const it of items) {
      if (it.kind === 'ink') for (const s of it.strokes) for (const p of s.pts) { minX = Math.min(minX, p.x - s.w); minY = Math.min(minY, p.y - s.w); }
      else { minX = Math.min(minX, it.x); minY = Math.min(minY, it.y); }
    }
    const dx = minX < 0 ? -minX : 0, dy = ON_TITLE + (minY < 0 ? -minY : 0);
    for (const it of items) {
      if (it.kind === 'ink') for (const s of it.strokes) for (const p of s.pts) { p.x += dx; p.y += dy; }
      else { it.x += dx; it.y += dy; }
    }
    return { title: page.title || 'Unbenannte Seite', created: page.created, modified: page.modified, level: page.level || 0, items };
  }

  /* Auswahl (beschnittener Baum) -> Dateien */
  async function exportTree(tree, name, progress) {
    const safe = (s) => String(s || 'Unbenannt').replace(/[<>:"/\\|?*\u0000-\u001f]+/g, '_').replace(/[. ]+$/, '').trim().slice(0, 80) || 'Unbenannt';
    const allPages = [];
    const walk = (list) => { for (const g of list) { allPages.push(...g.pages); walk(g.groups); } };
    walk(tree);
    const models = new Map();
    await Export.renderEach(allPages.map(pid => ({ pid })), { set: (t, f) => progress('OneNote: ' + t, f * 0.9) }, async (page, pid) => {
      models.set(pid, await pageModel(page));
    });
    progress('OneNote-Dateien werden geschrieben …', 0.95);
    const section = (g) => buildSection(g.pages.map(pid => models.get(pid)).filter(Boolean));
    const sections = [];
    const findSecs = (list) => { for (const g of list) { if (g.pages.length) sections.push(g); findSecs(g.groups); } };
    findSecs(tree);
    // ein einzelner Abschnitt -> .one
    if (sections.length === 1) return [{ name: safe(sections[0].name) + '.one', data: section(sections[0]) }];
    // sonst je Notizbuch ein Paket (.onepkg); einzelne Abschnitte oben (z. B. Schnellnotizen) als .one
    const out = [];
    for (const top of tree) {
      if (top.kind === 'section' || top.kind === 'quick') { out.push({ name: safe(top.name) + '.one', data: section(top) }); continue; }
      const files = [];
      const folder = (g, path) => {
        const entries = [];
        const used = new Set();
        const uniq = (n) => { let x = n, i = 2; while (used.has(x.toLowerCase())) x = `${n} (${i++})`; used.add(x.toLowerCase()); return x; };
        for (const c of g.groups) {
          if (c.kind === 'group' || c.kind === 'notebook') { const n = uniq(safe(c.name)); entries.push({ file: n }); folder(c, path + n + '\\'); }
          else { const n = uniq(safe(c.name)) ; entries.push({ file: n + '.one', color: c.color || null }); files.push({ name: path + n + '.one', data: section(c) }); }
        }
        if (g.pages.length) { const n = uniq(safe(g.name)); entries.push({ file: n + '.one', color: g.color || null }); files.push({ name: path + n + '.one', data: section(g) }); }
        files.push({ name: path + 'Open Notebook.onetoc2', data: buildToc(entries, path ? null : (g.color || null)) });
      };
      folder(top, '');
      out.push({ name: safe(top.name) + '.onepkg', data: buildCab(files) });
    }
    return out;
  }

  return { buildSection, buildToc, buildCab, buildPage, newGuid, guidBytes, crc32, md5, isfPath, Space, FileBuilder, P, J, exportTree, pageModel, htmlParas };
})();

if (typeof module !== 'undefined') module.exports = OneWrite;

</script>
<script>
/* ---- js/ribbon.js ---- */
'use strict';
/* Menüband im PowerPoint-Stil */

const PAGE_COLORS = [null, '#FFFBEA', '#FDF3D1', '#E9F5E4', '#E3F0FB', '#EEE8F8', '#FCE9EE', '#E5F5F3', '#FBEBDF', '#F1F1F1'];
const BG_KINDS = [['punkte', 'Punkte', 'dots'], ['raster-s', 'Karos klein', 'grid'], ['raster', 'Karos mittel', 'grid'], ['raster-l', 'Karos gross', 'grid'],
  ['linien-s', 'Linien schmal', 'lines'], ['linien', 'Linien mittel', 'lines'], ['linien-l', 'Linien weit', 'lines'], ['keiner', 'Keine', 'blank']];

const Ribbon = {
  lastColors: { fontColor: '#C00000', highlight: '#FFFF00', boxFill: '#FFF4C2', boxBorder: '#6AA3E8', linkColor: '#6b4fbb', pkgColor: '#0078d4', shapeFill: '#DCEBFF', drawColor: '#d13438' },

  /* ---------------------------------------------------------- Bausteine */
  btn(cls, cmd, inner, title, arg) {
    const b = el('button', { class: 'rb ' + cls, title: title || '', type: 'button' });
    b.innerHTML = inner;

      b.dataset.cmd = cmd;

  },
  big(cmd, label, ic, title, arg) { return this.btn('big', cmd, icon(ic, 28) + `<span>${label}</span>`, title || label.replace(/­/g, ''), arg); },
  small(cmd, label, ic, title, arg) { return this.btn('small', cmd, icon(ic, 16) + `<span>${label}</span>`, title || label, arg); },
  ico(cmd, inner, title, arg) { return this.btn('ico', cmd, inner.startsWith('<') ? inner : icon(inner, 16), title, arg); },
  glyph(cmd, text, cls, title) { return this.btn('ico', cmd, `<span class="glyph ${cls || ''}">${text}</span>`, title); },

  col(...kids) { return el('div', { class: 'rcol' }, ...kids); },

    const compact = ['Zwischenablage', 'Bearbeiten', 'Ordner', 'Reihenfolge', 'Hilfen', 'Seite', 'Notizbuch', 'Text', 'Pfeile', 'Ebene', 'Fenster'].includes(label);

  /* Knopf mit Pfeil für ein Aufklappmenü */

  /* geteilter Knopf: links ausführen, rechts Menü */
  split(cmd, inner, title, openFn, arg) {

  colorSplit(cmd, ic, title, opts = {}) {

  penGallery() {

  combo(kind, width) {

      b.addEventListener('click', () => Cmd.run(it.cmd, it.arg));
      g.append(b);
    }
    return g;
  },

  /* ---------------------------------------------------------- Registerkarten */
  TABS: [
    { id: 'datei', label: 'Datei' },
    { id: 'start', label: 'Start' },
    { id: 'einfuegen', label: 'Einfügen' },
    { id: 'zeichnen', label: 'Zeichnen' },
    { id: 'anordnen', label: 'Anordnen' },
    { id: 'verbindungen', label: 'Verbindungen' },
    { id: 'ansicht', label: 'Ansicht' },
  ],

  buildTab(id) {
    const B = this;
    const out = [];
    const G = (...a) => out.push(B.group(...a));
    const menuOf = (items) => (anchor) => UI.menu(items, 0, 0, { anchor });

    if (id === 'datei') {

    for (const inp of $$('#panel [data-combo]')) {
      inp.disabled = !t;
      if (document.activeElement === inp) continue;
      inp.value = !t ? '' : inp.dataset.combo === 'font' ? Fmt.currentFont() : String(Fmt.currentSize()).replace('.', ',');

  },

'use strict';
/* Programmstart, Tastenkürzel, Seitenwechsel */

    Ribbon.build();
    Sidebar.init();
    Canvas.init();
    Draw.init();
    this.initChrome();
    this.initKeys();
    UI.saveState('saved');

    let data;
    try {
      data = await Backend.load();
    } catch (e) {
      document.body.innerHTML = `<div style="padding:40px;font:14px Segoe UI"><h2>KnowledgeTree konnte nicht geladen werden</h2><p>${escapeHtml(e.message)}</p></div>`;
      return;
    }
    Store.info = data.info || {};
    Store.pages = {};
    for (const [id, raw] of Object.entries(data.pages || {})) {
      const p = normPage(raw);
      if (p) { p.id = id; Store.pages[id] = p; }
    }
    for (const p of Object.values(Store.pages)) p.boxes = p.boxes.filter(b => !isEmptyBox(p, b));
    const rawTree = JSON.stringify(data.groups || []);
    // Daten aus Version 1.1 (nur Gruppen, ohne Notizbücher/Abschnitte)?
    const legacy = Array.isArray(data.groups) && data.groups.length > 0 && !data.groups.some(g => g && g.kind);
    Store.groups = Tree.norm(data.groups || []);
    Store.ui = { ...UI_DEFAULTS, ...(data.zustand && typeof data.zustand === 'object' ? data.zustand : {}) };
    for (const k of ['collapsed', 'lastPage', 'lastSection', 'views', 'collapsedPages']) if (typeof Store.ui[k] !== 'object' || !Store.ui[k] || Array.isArray(Store.ui[k])) Store.ui[k] = {};
    if (!Array.isArray(Store.ui.recent)) Store.ui.recent = [];
    if ((Store.ui.layoutV || 0) < 2) { Store.ui.pageListSide = 'links'; Store.ui.showTabs = false; Store.ui.layoutV = 2; }
    Store.ui.linkDefault = { ...UI_DEFAULTS.linkDefault, ...(Store.ui.linkDefault || {}) };
    Store.ui.ruler = { ...UI_DEFAULTS.ruler, ...(Store.ui.ruler || {}) };
    Store.ui.protractor = { ...UI_DEFAULTS.protractor, ...(Store.ui.protractor || {}) };
    if (!Array.isArray(Store.ui.pens) || Store.ui.pens.length !== DEFAULT_PENS.length) Store.ui.pens = JSON.parse(JSON.stringify(DEFAULT_PENS));

    let firstRun = false;
    if (!Store.groups.some(g => g.kind === 'notebook') && !Object.keys(Store.pages).length) { Store.groups = []; this.createWelcome(); firstRun = true; }
    Tree.ensureQuick();
    // Ebenen der Unterseiten prüfen
    for (const s of Tree.sections()) Tree.normLevels(s);
    const migrated = !firstRun && JSON.stringify(Store.groups) !== rawTree;

    // Verlauf aus Version 1.1 passt nicht zur neuen Struktur -> neu beginnen
    if (!legacy) Hist.load(data.verlauf);
    Hist.init();
    if (legacy) Hist.persistSoon();
    Store.loaded = true;

    document.body.dataset.theme = Store.ui.theme === 'dunkel' ? 'dunkel' : 'hell';
    Sidebar.applyWidths();
    Ribbon.show(Store.ui.tab || 'start');
    UI.updateUndo();
    if (Store.info.warnung) { const w = $('#warnbar'); w.textContent = Store.info.warnung; w.hidden = false; }

    const pid = Store.pages[Store.ui.currentPage] ? Store.ui.currentPage : null;
    if (pid) this.openPage(pid); else this.openFirstPage();

    if (firstRun || migrated) {
      Save.treeDirty = true;
      for (const id of Object.keys(Store.pages)) Save.dirty.add(id);
      Save.flush();
      if (firstRun) setTimeout(() => Canvas.fit(), 150);
      if (legacy) {
        setTimeout(() => UI.toast('Neu: Notizbücher, Abschnitte und Unterseiten – deine Gruppen wurden übernommen', 4500), 600);
      }
    }
    setInterval(() => this.ping(), 15000);
    this.ping();
  },

  async ping() {
    try {
      if (!(await Backend.ping())) UI.conflict();
    } catch (e) { /* Server evtl. beendet */ }
  },

  nav: { back: [], fwd: [] },
  preview: null,

  openPage(pid, opts = {}) {
    if (this.preview) this.endPreview(true);
    if (pid && !Store.pages[pid]) pid = null;
    const prev = Canvas.pageId;
    if (prev && prev !== pid) Canvas.stopEditing();
    if (!opts.nav && prev && pid && prev !== pid && Store.pages[prev]) {
      this.nav.back.push(prev);
      if (this.nav.back.length > 60) this.nav.back.shift();
      this.nav.fwd = [];
    }
    let sec = null;
    if (pid) sec = Tree.groupOfPage(pid);
    else if (opts.group !== undefined) sec = Tree.group(opts.group);
    if (sec && Tree.isSection(sec)) {
      Store.ui.currentGroup = sec.id;
      const parent = Tree.parentOf(sec.id);
      Store.ui.currentContainer = parent ? parent.id : null;
      const nb = Tree.notebookOf(sec.id);
      if (nb && nb.kind === 'notebook') Store.ui.lastSection[nb.id] = sec.id;
      for (const anc of Tree.path(sec.id).slice(0, -1)) delete Store.ui.collapsed[anc.id];
      if (pid) Store.ui.lastPage[sec.id] = pid;
    } else {
      Store.ui.currentGroup = null;
      if (opts.container) Store.ui.currentContainer = opts.container;
    }
    if (pid) {
      Store.ui.recent = [pid, ...Store.ui.recent.filter(x => x !== pid && Store.pages[x])].slice(0, 15);
      const p = Store.pages[pid];
      if (p && p.level) {
        // eingeklappte Elternseiten aufklappen
        const s = Tree.groupOfPage(pid);
        let lv = p.level;
        for (let i = s.pages.indexOf(pid) - 1; i >= 0 && lv > 0; i--) {
          const q = Store.pages[s.pages[i]];
          if ((q.level || 0) < lv) { delete Store.ui.collapsedPages[q.id]; lv = q.level || 0; }
        }
      }
    }
    if (!opts.keepSel) Sidebar.pageSel = new Set(pid ? [pid] : []);
    Store.ui.currentPage = pid;
    UiState.saveSoon();
    Canvas.load(pid);
    Sidebar.render();
    this.updateTitle();
    this.updateNavButtons();
  },
  openFirstPage() {
    const g = Tree.group(Store.ui.currentGroup);
    let s = Tree.isSection(g) ? g : null;
    if (!s) {
      const c = Tree.group(Store.ui.currentContainer);
      s = (c && !c.closed && Tree.firstSection(c)) || null;
    }
    if (!s) {
      for (const nb of Store.groups) { if (nb.kind === 'notebook' && !nb.closed) { s = Tree.firstSection(nb); if (s) break; } }
    }
    if (!s) s = Tree.quick();
    this.openPage(s && s.pages[0] ? s.pages[0] : null, { group: s ? s.id : null });
  },
  goBack() {
    while (this.nav.back.length) {
      const pid = this.nav.back.pop();
      if (Store.pages[pid] && pid !== Canvas.pageId) { if (Canvas.pageId) this.nav.fwd.push(Canvas.pageId); this.openPage(pid, { nav: true }); return; }
    }
    this.updateNavButtons();
  },
  goForward() {
    while (this.nav.fwd.length) {
      const pid = this.nav.fwd.pop();
      if (Store.pages[pid] && pid !== Canvas.pageId) { if (Canvas.pageId) this.nav.back.push(Canvas.pageId); this.openPage(pid, { nav: true }); return; }
    }
    this.updateNavButtons();
  },
  updateNavButtons() {
    $('#qat-back').disabled = !this.nav.back.some(id => Store.pages[id]);
    $('#qat-fwd').disabled = !this.nav.fwd.some(id => Store.pages[id]);
  },
  recentMenu(anchor) {
    const items = Store.ui.recent.filter(id => Store.pages[id]).map(id => {
      const p = Store.pages[id];
      const s = Tree.groupOfPage(id);
      return { label: (p.title || 'Unbenannte Seite') + (s ? '  ·  ' + s.name : ''), icon: 'page', action: () => this.openPage(id) };
    });
    UI.menu([{ head: 'Zuletzt verwendet' }, ...(items.length ? items : [{ label: 'Noch keine', disabled: true }])], 0, 0, { anchor });
  },
  toggleFullscreen(on) {
    const want = on ?? !document.body.classList.contains('fullscreen');
    document.body.classList.toggle('fullscreen', want);
    $('#fs-exit').hidden = !want;
    try {
      if (want && document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => { });
      if (!want && document.fullscreenElement) document.exitFullscreen().catch(() => { });
    } catch (e) { /* */ }
    Canvas.layoutSoon();
  },
  updateTitle() {
    const p = Canvas.page;
    const s = Tree.group(Store.ui.currentGroup);
    const t = p ? `${p.title || 'Unbenannte Seite'}${s ? ' – ' + s.name : ''} – KnowledgeTree` : 'KnowledgeTree';
    document.title = t;
    $('#tb-title').textContent = t;
  },

  /* ---------------------------------------------------------- Einfügen */
  async onPaste(e) {
    const t = e.target;
    if (t.closest && t.closest('input, textarea')) return;
    const dt = e.clipboardData;
    if (!dt) return;
    const text = t.closest && t.closest('.box-text');
    e.preventDefault();
    if (Store.readOnly) return;
    if (text && Canvas.editing) {
      const imgs = [...dt.files].filter(f => f.type.startsWith('image/'));
      if (imgs.length) { for (const f of imgs) await Canvas.insertImage(Canvas.editing, f, null); return; }
      this.insertClipboardText(dt.getData('text/html'), dt.getData('text/plain'), this._plainNext);
      this._plainNext = false;
      return;
    }
    await Canvas.pasteToCanvas(dt);
  },
  insertClipboardText(html, plain, plainOnly) {
    Hist.flushPending();
    if (html && !plainOnly) {
      const clean = sanitizeHtml(html);
      document.execCommand('insertHTML', false, clean);
    } else if (plain) {
      document.execCommand('insertText', false, plain);
    }
    Canvas.syncEditing();
    Hist.commit('Eingefügt');
  },
  async pasteFromButton(plain) {
    if (!Canvas.page) return;
    let items;
    try { items = await navigator.clipboard.read(); }
    catch (e) {
      UI.toast('Bitte Strg+V verwenden (Zugriff auf die Zwischenablage wurde nicht erlaubt)');
      return;
    }
    let html = '', text = '', blob = null;
    for (const it of items) {
      for (const type of it.types) {
        if (type.startsWith('image/') && !blob) blob = await it.getType(type);
        else if (type === 'text/html' && !html) html = await (await it.getType(type)).text();
        else if (type === 'text/plain' && !text) text = await (await it.getType(type)).text();
      }
    }
    if (Canvas.editing && Canvas.restoreRange()) {
      if (blob && !text) { await Canvas.insertImage(Canvas.editing, blob, null); return; }
      this.insertClipboardText(plain ? '' : html, text, plain);
      return;
    }
    const dt = { files: blob ? [blob] : [], getData: (t) => t === 'text/html' ? (plain ? '' : html) : t === 'text/plain' ? text : '' };
    if (blob) { await Canvas.insertImage(null, blob, Canvas.viewCenter()); return; }
    await Canvas.pasteToCanvas(dt);
  },

  /* ---------------------------------------------------------- Tastatur */
  initKeys() {
    document.addEventListener('keydown', (e) => {
      const t = e.target;
      const inText = !!(t.closest && t.closest('.box-text'));
      const inInput = !!(t.matches && t.matches('input, textarea, select'));
      const inDialog = !!(t.closest && t.closest('.dlg-back, #findpanel'));
      const ctrl = e.ctrlKey || e.metaKey;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

      if (inDialog) return;
      if (this.preview) {
        if (e.key === 'Escape') { e.preventDefault(); this.endPreview(); return; }
        if (ctrl && ['+', '=', '-', '0'].includes(k)) { /* Zoom erlaubt */ }
        else if (ctrl || e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); return; }
      }
      if (e.key === 'F11') { e.preventDefault(); this.toggleFullscreen(); return; }
      if (e.altKey && !ctrl && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !inText && !inInput) { e.preventDefault(); if (e.key === 'ArrowLeft') this.goBack(); else this.goForward(); return; }
      if (ctrl && e.altKey && !e.shiftKey) {
        if (e.code === 'KeyN') { e.preventDefault(); Ops.newSubpage(); return; }
        if (e.code === 'BracketRight' || e.key === ']') { e.preventDefault(); Ops.setLevel(Sidebar.pageSel.size ? [...Sidebar.pageSel] : [Canvas.pageId], +1); return; }
        if (e.code === 'BracketLeft' || e.key === '[') { e.preventDefault(); Ops.setLevel(Sidebar.pageSel.size ? [...Sidebar.pageSel] : [Canvas.pageId], -1); return; }
      }
      if (e.altKey && e.shiftKey && !ctrl) {
        if (e.code === 'KeyN') { e.preventDefault(); Ops.quickNote(); return; }
        if (inText && (e.code === 'KeyD' || e.code === 'KeyT' || e.code === 'KeyF')) {
          e.preventDefault();
          const d = new Date();
          const ds = d.toLocaleDateString('de-CH', { day: 'numeric', month: 'long', year: 'numeric' }), ts = d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
          Cmd.run('insertSymbol', e.code === 'KeyD' ? ds : e.code === 'KeyT' ? ts : ds + ', ' + ts);
          return;
        }
      }
      if (e.key === 'Escape' && Draw.replaying) { e.preventDefault(); Draw.stopReplay(); return; }
      if (e.key === 'Escape' && Draw.tool !== 'select' && !inText && !inInput) { e.preventDefault(); Draw.setTool('select'); return; }
      if (e.key === 'Escape') {
        if (Fmt.painter) { Fmt.cancelPainter(); e.preventDefault(); return; }
        if (UI.popupOpen()) { UI.closePopup(); e.preventDefault(); return; }
        if (Find.el && !Find.el.hidden) { Find.close(); return; }
      }
      if (ctrl && !e.altKey) {
        if (k === 'z' && !e.shiftKey) { e.preventDefault(); if (!inInput || t.id === 'page-title') { Hist.flushPending(); Cmd.run('undo'); } return; }
        if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); if (!inInput || t.id === 'page-title') Cmd.run('redo'); return; }
        if (k === 's') { e.preventDefault(); Cmd.run('save'); return; }
        if (k === 'f' || (k === 'e' && !inText)) { e.preventDefault(); Cmd.run('find'); return; }
        if (k === 'h') { e.preventDefault(); Cmd.run('replace'); return; }
        if (k === 'n' && !e.shiftKey) { e.preventDefault(); Cmd.run('newPage'); return; }
        if (k === 'p') { e.preventDefault(); return; }
        if (k === '+' || k === '=' ) { e.preventDefault(); Cmd.run('zoomIn'); return; }
        if (k === '-') { e.preventDefault(); Cmd.run('zoomOut'); return; }
        if (k === '0') { e.preventDefault(); Cmd.run('zoom100'); return; }
        if (k === 'g') { e.preventDefault(); Cmd.run(e.shiftKey ? 'ungroup' : 'group'); return; }
        if (k === 'l' && e.shiftKey) { e.preventDefault(); Cmd.run('toggleLock'); return; }
        if (inText) {
          if (k === 'l') { e.preventDefault(); Cmd.run('alignLeft'); return; }
          if (k === 'e') { e.preventDefault(); Cmd.run('alignCenter'); return; }
          if (k === 'r') { e.preventDefault(); Cmd.run('alignRight'); return; }
          if (k === 'j') { e.preventDefault(); Cmd.run('alignJustify'); return; }
          if (k === 'k') { e.preventDefault(); Cmd.run('insertLink'); return; }
          if (e.shiftKey && (e.key === '>' || e.code === 'Period')) { e.preventDefault(); Cmd.run('grow'); return; }
          if (e.shiftKey && (e.key === '<' || e.code === 'Comma')) { e.preventDefault(); Cmd.run('shrink'); return; }
          if (k === 'v' && e.shiftKey) { this._plainNext = true; return; }
          if (k === 'b' || k === 'i' || k === 'u') { e.preventDefault(); Cmd.run(k === 'b' ? 'bold' : k === 'i' ? 'italic' : 'underline'); return; }
          return;
        }
        if (k === 'r') { e.preventDefault(); return; }
        if (!inInput) {
          if (k === 'c') { if (Canvas.copySelection(false)) e.preventDefault(); return; }
          if (k === 'x') { if (Canvas.copySelection(true)) e.preventDefault(); return; }
          if (k === 'd') { e.preventDefault(); Canvas.duplicate(); return; }
          if (k === 'a') { e.preventDefault(); Canvas.selectAll(); return; }
        }
        return;
      }
      if (e.altKey && !ctrl && !e.shiftKey && (k === 'n' || e.code === 'KeyN')) { e.preventDefault(); Cmd.run('newPage'); return; }
      if (e.altKey && !ctrl && e.key === '=' && !inInput) { e.preventDefault(); Cmd.run('insertFormula'); return; }
      if (e.key === 'F5' && Backend.kind === 'server') { e.preventDefault(); return; }
      if (inText || inInput) return;
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); Canvas.deleteSelection(); return; }
      if (e.key === 'Escape') { Canvas.clearSel(); return; }
      if (e.key === 'F2') { e.preventDefault(); if (Canvas.page) Ops.renamePage(Canvas.pageId); return; }
      if (e.key.startsWith('Arrow') && Canvas.sel.size) {
        e.preventDefault();
        const s = e.shiftKey ? 10 : 1;
        Canvas.nudge(e.key === 'ArrowLeft' ? -s : e.key === 'ArrowRight' ? s : 0, e.key === 'ArrowUp' ? -s : e.key === 'ArrowDown' ? s : 0);
        return;
      }
      if (e.key === ' ' && !e.repeat) { e.preventDefault(); Canvas.spaceDown = true; Canvas.vp.classList.add('space'); return; }
      if (e.key === 'Enter' && Canvas.sel.size === 1) {
        const id = [...Canvas.sel][0];
        if (Canvas.box(id) && !Canvas.isLocked(Canvas.box(id))) { e.preventDefault(); Canvas.focusText(id); }
      }
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === ' ') { Canvas.spaceDown = false; Canvas.vp.classList.remove('space'); }
    });
    window.addEventListener('blur', () => { Canvas.spaceDown = false; Canvas.vp.classList.remove('space'); });
  },

    UI.info('Über KnowledgeTree', `<div class="about-logo"></div>
      <p><b>KnowledgeTree ${escapeHtml(i.version || '')}</b> – by ${escapeHtml(i.author || 'TheDragonas')}<br>Ein digitales Freiform-Notizbuch zum Brainstormen: Notizbücher, Abschnitte, Seiten, freie Textfelder, Zeichnungen, Pakete und Verbindungen.</p>

  /* ---------------------------------------------------------- Webseiten-Version: Sicherung & Papierkorb */
  async fillStorageInfo() {
    if (!Backend.storageInfo) return;
    const info = await Backend.storageInfo();
    const p = document.getElementById('kt-storage');
    if (!p) return;
    if (!info) { p.textContent = ''; return; }
    const mb = (b) => (b / 1024 / 1024).toFixed(1).replace('.', ',') + ' MB';
    p.textContent = `Belegt: ${mb(info.usage)} von ca. ${mb(info.quota)} · ` + (info.persisted ? 'dauerhaft gespeichert ✓' : 'Browser darf bei Platzmangel aufräumen – Backups machen!');
  },
  /* KnowledgeTree-Datei ohne eigene Backend-Funktion einlesen (Desktop): Bilder/Anhänge hochladen, Namen anpassen */
  async readBackupGeneric(file) {
    const data = JSON.parse(await file.text());
    if (!data || data.typ !== 'KnowledgeTree-Backup' || !data.seiten) throw new Error('Das ist keine KnowledgeTree-Datei.');
    const ren = {};
    for (const [name, url] of Object.entries(data.bilder || {})) {
      const m = /^data:([^;,]+)?(;base64)?,(.*)$/.exec(url);
      if (!m) continue;
      const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const ext = name.split('.').pop();
      const blob = new Blob([arr], { type: m[1] || 'application/octet-stream' });
      const isImg = /^image\/(png|jpeg|gif|webp|bmp|svg\+xml)$/.test(blob.type);
      const nn = isImg ? await Backend.saveImage(blob) : await Backend.saveFile(blob, ext);
      if (nn && nn !== name) ren[name] = nn;
    }
    if (Object.keys(ren).length) {
      let s = JSON.stringify(data.seiten);
      for (const [a, b] of Object.entries(ren)) s = s.split(a).join(b);
      data.seiten = JSON.parse(s);
    }
    return data;
  },
  async restoreBackup() {
    const file = await new Promise((res) => {
      const inp = el('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
      inp.addEventListener('change', () => { res(inp.files[0] || null); inp.remove(); });
      document.body.append(inp);
      inp.click();
    });
    if (!file) return;
    let data;
    try { data = Backend.readBackup ? await Backend.readBackup(file) : await this.readBackupGeneric(file); }
    catch (e) { UI.toast('Backup konnte nicht gelesen werden: ' + e.message, 4000); return; }
    const n = Object.keys(data.seiten).length;
    const mode = await UI.dialog((d, close) => {
      d.append(el('h2', { text: 'Backup laden' }));
      d.append(el('p', { text: `Die Sicherung enthält ${n} Seite(n) vom ${new Date(data.erstellt).toLocaleString('de-CH')}. Was soll passieren?` }));
      d.append(el('div', { class: 'dlg-btns' },
        el('button', { class: 'btn', text: 'Abbrechen', onclick: () => close(null) }),
        el('button', { class: 'btn', text: 'Zusätzlich hinzufügen', onclick: () => close('add') }),
        Backend.kind === 'browser' ? el('button', { class: 'btn danger', text: 'Alles ersetzen', onclick: () => close('replace') }) : null));
    });
    if (!mode) return;
    Canvas.stopEditing();
    Hist.flushPending();
    const pages = {};
    for (const [id, raw] of Object.entries(data.seiten)) { const p = normPage(raw); if (p) { p.id = id; pages[id] = p; } }
    let groups = data.gruppen || [];
    if (mode === 'add') {
      const map = {};
      for (const id of Object.keys(pages)) map[id] = uid('p');
      const reid = (list) => list.map(g => { const n = { ...g, id: uid('g'), pages: (g.pages || []).filter(p => map[p]).map(p => map[p]), groups: reid(g.groups || []) }; delete n.closed; return n; });
      groups = reid(groups);
      for (const [oldId, p] of Object.entries(pages)) { p.id = map[oldId]; Store.pages[p.id] = p; }
      // alte Sicherungen (nur Gruppen) als eigenes Notizbuch einlesen
      if (!groups.some(g => g.kind)) groups = [{ id: uid('g'), name: data.name || 'Wiederhergestellt', color: '', kind: 'notebook', groups, pages: [] }];
      Store.groups.push(...groups);
    } else {
      Store.pages = pages;
      Store.groups = groups;
    }
    Store.groups = Tree.norm(Store.groups);
    Tree.ensureQuick();
    for (const s of Tree.sections()) Tree.normLevels(s);
    Hist.undo = []; Hist.redo = [];
    Hist.init();
    Hist.persistSoon();
    for (const id of Object.keys(Store.pages)) Save.dirty.add(id);
    Save.treeDirty = true;
    await Save.flushAll();
    UI.updateUndo();
    Store.ui.currentPage = null;
    this.openFirstPage();
    UI.toast(mode === 'add' ? `${n} Seite(n) hinzugefügt` : 'Backup geladen', 3000);
  },
  /* einzelnes Notizbuch als Datei (gleiches Format wie ein Backup) */
  async exportNotebook(id) {
    const nb = Tree.group(id);
    if (!nb || nb.kind !== 'notebook') { UI.toast('Zuerst ein Notizbuch öffnen'); return; }
    if (Backend.kind !== 'browser') { Backend.openFolder('saves'); UI.toast('Jedes Notizbuch ist ein Ordner in „Saves“'); return; }
    await Save.flushAll();
    try { UI.toast(await Backend.backup({ groups: [JSON.parse(JSON.stringify(nb))], pageIds: Tree.pagesDeep(nb), name: nb.name }), 3500); }
    catch (e) { UI.toast('Export fehlgeschlagen: ' + e.message); }
  },

  /* ---------------------------------------------------------- Seitenversionen */
  async showVersions(pid) {
    if (!Backend.versionList) return;
    pid = pid || Canvas.pageId;
    if (!Store.pages[pid]) return;
    if (Canvas.pageId !== pid) this.openPage(pid);
    await Save.flushAll();
    let list;
    try { list = await Backend.versionList(pid); } catch (e) { UI.toast('Versionen konnten nicht gelesen werden'); return; }
    if (!list.length) {
      UI.info('Seitenversionen', `<p>Für „${escapeHtml(Store.pages[pid].title)}“ gibt es noch keine älteren Versionen.</p>
        <p>KnowledgeTree merkt sich automatisch frühere Stände einer Seite, sobald du sie länger bearbeitest (höchstens alle 10 Minuten eine Version, bis zu 50 pro Seite).</p>`);
      return;
    }
    this.preview = { pid, list, idx: 0 };
    document.body.classList.add('previewing');
    await this.showPreview();
  },
  async showPreview() {
    const pv = this.preview;
    if (!pv) return;
    const v = pv.list[pv.idx];
    let data;
    try { data = await Backend.versionGet(v.id); } catch (e) { data = null; }
    if (!this.preview || this.preview !== pv) return;
    if (!data) { UI.toast('Diese Version ist nicht mehr vorhanden'); return; }
    const page = normPage(JSON.parse(JSON.stringify(data)));
    page.id = pv.pid;
    pv.page = page;
    Canvas.showPage(page);
    $('#preview-glass').hidden = false;
    this.renderVersionBar();
  },
  renderVersionBar() {
    const pv = this.preview, bar = $('#version-bar');
    bar.innerHTML = '';
    bar.hidden = false;
    const v = pv.list[pv.idx];
    const sel = el('select', { title: 'Version wählen' });
    pv.list.forEach((x, i) => sel.append(el('option', { value: i, text: new Date(x.t).toLocaleString('de-CH', { dateStyle: 'medium', timeStyle: 'short' }) + (x.title ? ' – ' + x.title : '') })));
    sel.value = pv.idx;
    sel.addEventListener('change', () => { pv.idx = +sel.value; this.showPreview(); });
    const b = (txt, ic, fn, cls = '', title = '') => { const x = el('button', { class: 'btn ' + cls, title, html: (ic ? icon(ic, 14) : '') + `<span>${txt}</span>` }); x.addEventListener('click', fn); return x; };
    bar.append(
      el('span', { class: 'vb-ic', html: icon('versions', 18) }),
      el('div', { class: 'vb-text' }, el('b', { text: 'Seitenversion' }), el('span', { text: `${pv.idx + 1} von ${pv.list.length} · nur ansehen` })),
      b('', 'chevRight', () => { if (pv.idx < pv.list.length - 1) { pv.idx++; this.showPreview(); } }, 'ico flip' + (pv.idx >= pv.list.length - 1 ? ' dis' : ''), 'Ältere Version'),
      sel,
      b('', 'chevRight', () => { if (pv.idx > 0) { pv.idx--; this.showPreview(); } }, 'ico' + (pv.idx <= 0 ? ' dis' : ''), 'Neuere Version'),
      el('span', { class: 'vb-gap' }),
      b('Wiederherstellen', 'restore', () => this.restoreVersion(false), 'primary', 'Die aktuelle Seite durch diese Version ersetzen (rückgängig machbar)'),
      b('Als Kopie', 'duplicate', () => this.restoreVersion(true), '', 'Diese Version als neue Seite unter der aktuellen einfügen'),
      b('', 'trash', () => this.deleteVersion(), 'ico', 'Diese Version löschen'),
      b('Schliessen', 'x', () => this.endPreview(), '', 'Zur aktuellen Seite zurück (Esc)'),
    );
    void v;
  },
  endPreview(silent) {
    if (!this.preview) return;
    const pid = this.preview.pid;
    this.preview = null;
    document.body.classList.remove('previewing');
    $('#version-bar').hidden = true;
    $('#preview-glass').hidden = true;
    if (!silent && Store.pages[pid]) Canvas.showPage(Store.pages[pid]);
    Ribbon.refreshSoon();
  },
  restoreVersion(asCopy) {
    const pv = this.preview;
    if (!pv || !pv.page) return;
    const cur = Store.pages[pv.pid];
    const s = Tree.groupOfPage(pv.pid);
    if (!cur || !s) { this.endPreview(); return; }
    Hist.flushPending();
    const page = normPage(JSON.parse(JSON.stringify(pv.page)));
    const when = new Date(pv.list[pv.idx].t).toLocaleString('de-CH', { dateStyle: 'short', timeStyle: 'short' });
    this.endPreview(true);
    if (asCopy) {
      page.id = uid('p');
      page.title = (page.title || 'Seite') + ` (Version ${when})`;
      page.level = Math.min(2, (cur.level || 0) + 1);
      page.created = Date.now();
      const blk = Tree.block(s, cur.id);
      s.pages.splice(s.pages.indexOf(blk[blk.length - 1]) + 1, 0, page.id);
      Store.pages[page.id] = page;
      Tree.normLevels(s);
      Hist.touchPage(page.id); Hist.touchTree(); Hist.commit('Version als Kopie eingefügt');
      this.openPage(page.id);
    } else {
      page.id = cur.id;
      page.level = cur.level || 0;
      page.created = cur.created;
      Store.pages[cur.id] = page;
      Hist.touchPage(cur.id); Hist.commit('Seitenversion wiederhergestellt');
      Canvas.load(cur.id);
      Sidebar.render();
    }
    UI.toast(`Version vom ${when} wiederhergestellt` + (asCopy ? ' (als Kopie)' : ' – Strg+Z macht es rückgängig'), 3500);
  },
  async deleteVersion() {
    const pv = this.preview;
    if (!pv) return;
    const v = pv.list[pv.idx];
    if (!(await UI.confirm('Diese Version löschen?', 'Die Version vom ' + new Date(v.t).toLocaleString('de-CH') + ' wird endgültig entfernt. Die aktuelle Seite bleibt unverändert.', { ok: 'Löschen', danger: true }))) return;
    await Backend.versionDelete([v.id]);
    pv.list.splice(pv.idx, 1);
    if (!pv.list.length) { this.endPreview(); UI.toast('Keine weiteren Versionen'); return; }
    pv.idx = Math.min(pv.idx, pv.list.length - 1);
    this.showPreview();
  },
  initPreviewGlass() {
    const g = $('#preview-glass');
    let drag = null;
    g.addEventListener('wheel', (e) => Canvas.onWheel(e), { passive: false });
    g.addEventListener('pointerdown', (e) => { e.preventDefault(); drag = { x: e.clientX, y: e.clientY, vx: Canvas.view.x, vy: Canvas.view.y }; g.setPointerCapture(e.pointerId); g.classList.add('grab'); });
    g.addEventListener('pointermove', (e) => { if (!drag) return; Canvas.view.x = drag.vx + e.clientX - drag.x; Canvas.view.y = drag.vy + e.clientY - drag.y; Canvas.applyView(); });
    const up = () => { drag = null; g.classList.remove('grab'); };
    g.addEventListener('pointerup', up);
    g.addEventListener('pointercancel', up);
    g.addEventListener('contextmenu', (e) => e.preventDefault());
  },
  async showTrash() {
    if (!Backend.trashList) { Backend.openFolder('papierkorb'); return; }
    const list = await Backend.trashList();
    await UI.dialog((d, close) => {
      d.append(el('h2', { text: 'Papierkorb' }));
      if (!list.length) { d.append(el('p', { text: 'Der Papierkorb ist leer. Gelöschte Seiten landen hier.' })); }
      const box = el('div', { style: { maxHeight: '50vh', overflow: 'auto', margin: '0 -6px' } });
      for (const it of list) {
        const row = el('div', { class: 'mi', style: { height: 'auto', padding: '6px 8px', alignItems: 'center' } });
        const info = el('div', { style: { flex: 1, minWidth: 0 } },
          el('div', { style: { fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis' }, text: it.page.title || 'Unbenannte Seite' }),
          el('div', { style: { fontSize: '11px', color: 'var(--ink-3)' }, text: (it.path || []).map(x => x.name).join(' › ') + ' · gelöscht ' + new Date(it.deletedAt).toLocaleString('de-CH') }));
        info.title = 'Wird in den ursprünglichen Abschnitt zurückgelegt (falls es ihn nicht mehr gibt: in die Schnellnotizen)';
        const restore = el('button', { class: 'btn', text: 'Wiederherstellen' });
        const del = el('button', { class: 'btn', title: 'Endgültig löschen', html: icon('trash', 14), style: { padding: '0 8px', marginLeft: '6px' } });
        restore.addEventListener('click', async () => {
          const p = normPage(JSON.parse(JSON.stringify(it.page)));
          if (Store.pages[p.id]) p.id = uid('p');
          let g = null;
          for (const x of [...(it.path || [])].reverse()) { const c = Tree.group(x.id); if (Tree.isSection(c)) { g = c; break; } if (Tree.isContainer(c)) { g = Tree.firstSection(c); if (g) break; } }
          if (!g || Tree.notebookOf(g.id)?.closed) { Tree.ensureQuick(); g = Tree.quick(); }
          p.level = 0;
          Store.pages[p.id] = p;
          g.pages.push(p.id);
          Hist.touchPage(p.id); Hist.touchTree(); Hist.commit('Seite wiederhergestellt');
          await Backend.trashRemove([it.id]);
          close(true);
          this.openPage(p.id);
          UI.toast('Seite wiederhergestellt');
        });
        del.addEventListener('click', async () => { await Backend.trashRemove([it.id]); row.remove(); });
        row.append(info, restore, del);
        box.append(row);
      }
      d.append(box);
      d.append(el('div', { class: 'dlg-btns' },
        list.length ? el('button', { class: 'btn', text: 'Papierkorb leeren', onclick: async () => { if (await UI.confirm('Papierkorb leeren?', 'Die Seiten sind danach endgültig weg.', { ok: 'Leeren', danger: true })) { await Backend.trashRemove(list.map(x => x.id)); close(true); } } }) : null,
        el('button', { class: 'btn primary', text: 'Schliessen', onclick: () => close(true) })));
    }, { wide: true });
  },

  async quit() {
    UI.toast('Speichere …');
    await this.closeGracefully();
    window.close();
    setTimeout(() => {
      document.body.innerHTML = '<div style="display:flex;height:100vh;align-items:center;justify-content:center;font:16px Segoe UI;color:#666">KnowledgeTree wurde beendet. Du kannst dieses Fenster schliessen.</div>';

    try {

      await Hist.persist();
      await UiState.save();

    if (Backend.quit) await Backend.quit();
  },

    ps.boxes.push(b(0, 0, 460, '<h2>So ist alles geordnet</h2><ul><li><b>Notizbuch</b> → <b>Abschnittsgruppen</b> → <b>Abschnitte</b> (farbige Register) → <b>Seiten</b></li><li>Unterseiten: Seite in der Liste nach rechts ziehen oder <b>Strg+Alt+]</b></li><li>Mehrere Seiten: <b>Strg</b>/<b>Umschalt</b> + Klick, dann ziehen oder Rechtsklick → <i>Verschieben nach …</i></li><li><b>Schnellnotizen</b> (Alt+Umsch+N) für schnelle Gedanken</li><li><b>Seitenversionen</b>: Rechtsklick auf eine Seite</li><li>Klick auf das Datum unter dem Titel = Datum ändern</li></ul>'));
    add(s1, ps, 1);

    const pi = newPage('Brainstorming');
    pi.bg = 'raster';
    pi.boxes.push(b(0, 0, 300, '<h2>Ideen sammeln</h2><div>Hier ist Platz für deine nächsten Ideen.</div>', { style: yellow }));
    add(s2, pi);

    const p2 = newPage('Meine Notizen');
    p2.bg = 'linien';
    p2.boxes.push(b(0, 0, 380, '<h2>Abschnitt in einer Abschnittsgruppe</h2><div>Abschnittsgruppen sind wie Ordner für Abschnitte. Rechtsklick in der Liste links oder auf die Register oben für neue Abschnitte, Gruppen und Notizbücher.</div>'));
    add(s3, p2);

    Store.ui.currentGroup = s1.id;
    Store.ui.currentPage = p.id;
  },
};

/* Wird vom Programmfenster aufgerufen, bevor es schliesst */
window.KT_appClosing = () => App.closeGracefully();

window.addEventListener('error', (e) => { console.error(e.error || e.message); });
document.addEventListener('DOMContentLoaded', () => App.boot());

</script>
