    const s = Math.ceil(r * 2 + 4);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}"><circle cx="${s / 2}" cy="${s / 2}" r="${r}" fill="rgba(255,255,255,.6)" stroke="#444" stroke-width="1.2"/></svg>`;
    Canvas.vp.style.setProperty('--eraser-cursor', `url("data:image/svg+xml,${encodeURIComponent(svg)}") ${s / 2} ${s / 2}, crosshair`);
  },

  /* ---------------------------------------------------------- Darstellung */
  sig(d) {
    if (d.type === 'ink') { const p = d.pts, n = p.length; return `i|${d.sharp ? 's' : ''}${d.kind}|${d.color}|${d.w}|${n}|${p[0]}|${p[1]}|${p[n - 3]}|${p[n - 2]}|${p[(n / 2 | 0) - ((n / 2 | 0) % 3)]}`; }
    return `s|${d.shape}|${d.color}|${d.w}|${d.fill}|${d.x1}|${d.y1}|${d.x2}|${d.y2}|${d.pts ? d.pts.join(',') : ''}`;
  },
  markup(d) {
    const c = d.color || '#1f1f1f', w = d.w || 2;
    if (d.type === 'ink') {
      const pts = d.sharp ? DG.inkPts(d) : DG.smooth(DG.inkPts(d));
      if (d.sharp) {
        const path = 'M' + pts.map(q => n1(q.x) + ',' + n1(q.y)).join('L');
        return `<path${d.kind === 'marker' ? ' class="ink-marker"' : kb(c, 's')} d="${path}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
      switch (d.kind) {
        case 'marker': return `<path class="ink-marker" d="${centerPath(pts)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
        case 'pencil': return `<path${kb(c, 'f')} d="${outlinePath(pts, w, 'pencil')}" fill="${c}" opacity=".85" filter="url(#kt-pencil)"/>`;
        case 'rainbow': return `<path d="${outlinePath(pts, w, 'rainbow')}" fill="url(#kt-rainbow)"/>`;
        case 'glitter': { const o = outlinePath(pts, w, 'glitter'); return `<path d="${o}" fill="url(#kt-gold)"/><path d="${o}" fill="url(#kt-glitter)"/>`; }
        default: return `<path${kb(c, 'f')} d="${outlinePath(pts, w, 'pen')}" fill="${c}"/>`;
      }
    }
    const sw = `stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${kb(c, 's')}`;
    const fill = d.fill ? `fill="${d.fill}"` : 'fill="none"';
    const b = DG.box(d);
    switch (d.shape) {
      case 'line': return `<line x1="${n1(d.x1)}" y1="${n1(d.y1)}" x2="${n1(d.x2)}" y2="${n1(d.y2)}" ${sw}/>`;
      case 'arrow': case 'darrow': {
        const len = Math.hypot(d.x2 - d.x1, d.y2 - d.y1) || 1, ux = (d.x2 - d.x1) / len, uy = (d.y2 - d.y1) / len;
        const h = Math.min(len * 0.45, Math.max(9, w * 3.6) * 0.75);
        const a = d.shape === 'darrow' ? { x: d.x1 + ux * h, y: d.y1 + uy * h } : { x: d.x1, y: d.y1 };
        const e = { x: d.x2 - ux * h, y: d.y2 - uy * h };
        return `<line x1="${n1(a.x)}" y1="${n1(a.y)}" x2="${n1(e.x)}" y2="${n1(e.y)}" ${sw}/>` + arrowHead(d.x1, d.y1, d.x2, d.y2, w, c) +
          (d.shape === 'darrow' ? arrowHead(d.x2, d.y2, d.x1, d.y1, w, c) : '');
      }
      case 'rect': return `<rect x="${n1(b.minx)}" y="${n1(b.miny)}" width="${n1(b.maxx - b.minx)}" height="${n1(b.maxy - b.miny)}" ${sw} ${fill}/>`;
      case 'ellipse': return `<ellipse cx="${n1(b.cx)}" cy="${n1(b.cy)}" rx="${n1((b.maxx - b.minx) / 2)}" ry="${n1((b.maxy - b.miny) / 2)}" ${sw} ${fill}/>`;
      case 'triangle': case 'diamond': case 'poly': {
        const l = DG.lines(d).lines[0].slice(0, -1);
        return `<polygon points="${l.map(p => n1(p.x) + ',' + n1(p.y)).join(' ')}" ${sw} ${fill}/>`;
      }
      case 'polyline': {
        const l = DG.lines(d).lines[0];
        return `<polyline points="${l.map(p => n1(p.x) + ',' + n1(p.y)).join(' ')}" ${sw} fill="none"/>`;
      }
      case 'axes': {
        const o = { x: b.minx, y: b.maxy };
        const h = Math.max(9, w * 3.6) * 0.75;
        return `<path d="M${n1(o.x)},${n1(o.y)}H${n1(b.maxx - h)}M${n1(o.x)},${n1(o.y)}V${n1(b.miny + h)}" ${sw} fill="none"/>` +
          arrowHead(o.x, o.y, b.maxx, o.y, w, c) + arrowHead(o.x, o.y, o.x, b.miny, w, c);
      }
    }
    return '';
  },
  render() {
    const p = Canvas.page;
    if (!this.gOver) return;
    if (!p) { this.gUnder.innerHTML = this.gMark.innerHTML = this.gOver.innerHTML = ''; this.sel.clear(); this.renderSel(); this.renderTools(); return; }
    const out = { u: [], m: [], o: [] };
    const seen = new Set();
    for (const d of p.drawings) {
      seen.add(d.id);
      const key = this.sig(d);
      let c = this.cache.get(d.id);
      if (!c || c.key !== key) { c = { key, html: this.markup(d) }; this.cache.set(d.id, c); }
      const g = `<g data-d="${d.id}"${this.sel.has(d.id) ? ' class="dsel"' : ''}>${c.html}</g>`;
      if (d.layer === 'unten') out.u.push(g);
      else if (d.type === 'ink' && d.kind === 'marker') out.m.push(g);
      else out.o.push(g);
    }
    for (const id of this.cache.keys()) if (!seen.has(id)) this.cache.delete(id);
    for (const id of [...this.sel]) if (!seen.has(id)) this.sel.delete(id);
    this.gUnder.innerHTML = out.u.join('');
    this.gMark.innerHTML = out.m.join('');
    this.gOver.innerHTML = out.o.join('');
    this.renderSel();
    this.renderTools();
  },
  drawing(id) { return Canvas.page ? Canvas.page.drawings.find(d => d.id === id) : null; },
  selected() { return Canvas.page ? Canvas.page.drawings.filter(d => this.sel.has(d.id)) : []; },
  onView() { if (this.sel.size) this.renderSel(); },

  /* Auswahlrahmen mit Eckpunkten zum Skalieren */
  renderSel() {
    const svg = this.selSvg;
    if (!svg) return;
    const list = this.selected();
    if (!list.length || this.replaying) { svg.innerHTML = ''; return; }
    const r = DG.union(list.map(d => DG.bbox(d)));
    const z = Canvas.view.z, hs = 9 / z, pad = 4 / z;
    const x = r.x - pad, y = r.y - pad, w = r.w + 2 * pad, h = r.h + 2 * pad;
    const corners = [[x, y, 'nw'], [x + w, y, 'ne'], [x + w, y + h, 'se'], [x, y + h, 'sw']];
    svg.innerHTML = `<rect class="dsel-frame" data-dh="move" x="${x}" y="${y}" width="${w}" height="${h}"/>` +
      corners.map(([cx, cy, k], i) => `<rect class="dsel-h ${k}" data-dh="${i}" x="${cx - hs / 2}" y="${cy - hs / 2}" width="${hs}" height="${hs}"/>`).join('');
    this.selBox = { x, y, w, h };
  },
  select(ids, additive) {
    if (!additive) this.sel.clear();
    for (const id of ids) this.sel.add(id);
    this.render();
    this.selInfo();
    Ribbon.refreshSoon();
  },
  clearSel(silent) {
    if (!this.sel.size) return;
    this.sel.clear();
    if (!silent) { this.render(); Ribbon.refreshSoon(); }
    else { for (const g of $$('#world g.dsel')) g.classList.remove('dsel'); this.renderSel(); }
  },
  selInfo() {
    if (!this.sel.size) return;
    $('#sb-hint').textContent = `${this.sel.size} Zeichnung${this.sel.size === 1 ? '' : 'en'} ausgewählt · ziehen = verschieben · Ecken = Grösse · Entf = löschen · Rechtsklick = Optionen`;
  },
  selectInRect(r) {
    const ids = [];
    for (const d of Canvas.page.drawings) {
      const b = DG.bbox(d);
      if (b.x >= r.x && b.y >= r.y && b.x + b.w <= r.x + r.w && b.y + b.h <= r.y + r.h) ids.push(d.id);
    }
    if (ids.length) this.select(ids, true);
  },
  hitAt(w, includeUnder, skipMarker) {
    const p = Canvas.page;
    if (!p) return null;
    const tol = 5 / Canvas.view.z;
    for (let i = p.drawings.length - 1; i >= 0; i--) {
      const d = p.drawings[i];
      if (d.layer === 'unten') continue;
      if (skipMarker && d.type === 'ink' && d.kind === 'marker') continue;
      if (DG.hit(d, w, tol)) return d;
    }
    if (includeUnder) {
      for (let i = p.drawings.length - 1; i >= 0; i--) {
        const d = p.drawings[i];
        if (d.layer === 'unten' && DG.hit(d, w, tol)) return d;
      }
    }
    return null;
  },

  /* ---------------------------------------------------------- Maus / Stift / Finger */
  onDown(ev) {
    if (!Canvas.page || App.preview) return false;
    if (this.replaying) { this.stopReplay(); return true; }
    if (ev.pointerType === 'touch' && this.touchDown(ev)) return true;
    const eraserBtn = ev.pointerType === 'pen' && (ev.buttons & 32);
    if (ev.button !== 0 && !eraserBtn) return false;
    if (Canvas.spaceDown) return false;
    const t = ev.target;
    const w = Canvas.toWorld(ev.clientX, ev.clientY);
    const base = { pid: ev.pointerId, ptype: ev.pointerType, sx: ev.clientX, sy: ev.clientY, w0: w, moved: false };

    // Auswahlrahmen
    const dh = t.closest && t.closest('[data-dh]');
    if (dh && this.sel.size) {
      ev.preventDefault();
      Canvas.stopEditing();
      const orig = new Map(this.selected().map(d => [d.id, JSON.parse(JSON.stringify(d))]));
      if (dh.dataset.dh === 'move') {
        this.drag = { ...base, type: 'move', orig, boxes: this.movableBoxes() };
      } else {
        const r = this.selBox, i = +dh.dataset.dh;
        const corners = [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]];
        const a = corners[(i + 2) % 4], c = corners[i];
        this.drag = { ...base, type: 'scale', orig, ax: a[0], ay: a[1], cx: c[0], cy: c[1] };
      }
      Canvas.capture(ev);
      return true;
    }
    // Lineal / Winkelmesser
    const tl = t.closest && t.closest('.kt-tool');
    let snap = null;
    if (tl) {
      const which = tl.dataset.tool;
      if (t.closest('.kt-rot')) { ev.preventDefault(); this.drag = { ...base, type: 'toolRot', which }; Canvas.capture(ev); return true; }
      if (which === 'ruler' && (this.tool === 'pen' && !eraserBtn)) snap = this.rulerSnap(w);
      if (!snap) {
        ev.preventDefault();
        const st = Store.ui[which];
        this.drag = { ...base, type: 'toolMove', which, ox: st.x, oy: st.y };
        Canvas.capture(ev);
        return true;
      }
    }
    if (!snap && this.tool === 'pen' && Store.ui.ruler.visible) snap = this.rulerSnap(w);

    let mode = eraserBtn ? 'eraser' : this.tool;
    if (mode === 'select') return this.selectDown(ev, base, w);
    if (Store.ui.penOnly && ev.pointerType === 'touch') return false;
    ev.preventDefault();
    Canvas.stopEditing();
    if (document.activeElement && document.activeElement !== document.body && document.activeElement !== Canvas.vp) document.activeElement.blur();
    if (Canvas.sel.size || Canvas.selLink) Canvas.clearSel();
    if (mode !== 'lasso') this.clearSel();
    Canvas.capture(ev);
    if (mode === 'pen') {
      const pen = this.activePen();
      const pr = this.pressure(ev);
      const q = snap ? snap.project(w) : w;
      this.drag = { ...base, type: 'ink', pen: { ...pen }, pts: [r1(q.x), r1(q.y), pr], t0: Date.now(), snap };
      this.live = this.liveEl(pen.kind === 'marker' ? this.gMark : this.gOver);
      this.renderLive();
    } else if (mode === 'eraser') {
      this.drag = { ...base, type: 'erase', point: Store.ui.eraserMode === 'punkt' && !eraserBtn, removed: 0, changed: false, last: w };
      this.eraseAt(w);
    } else if (mode === 'lasso') {
      this.drag = { ...base, type: 'lasso', pts: [w], additive: ev.shiftKey || ev.ctrlKey };
    } else if (mode === 'shape') {
      this.drag = { ...base, type: 'shape', shape: this.shape, x1: w.x, y1: w.y, x2: w.x, y2: w.y };
      this.live = this.liveEl(this.gOver);
    }
    return true;
  },
  selectDown(ev, base, w) {
    const t = ev.target;
    if (t.closest('.box-text') && Canvas.editing && t.closest('.box')?.dataset.id === Canvas.editing) return false;
    if (t.closest('.sock, .link-handle, .box-rs, .fimg, .pkg-head, [data-link]')) { if (!ev.shiftKey) this.clearSel(true); return false; }
    const inText = !!t.closest('.box-text');
    const onNode = !!t.closest('.box, .pkg');
    const d = this.hitAt(w, !onNode, inText);
    if (!d) { if (!ev.shiftKey && !ev.ctrlKey) this.clearSel(true); return false; }
    ev.preventDefault();
    Canvas.stopEditing();
    if (ev.shiftKey || ev.ctrlKey) {
      if (this.sel.has(d.id)) this.sel.delete(d.id); else this.sel.add(d.id);
      this.render();
    } else if (!this.sel.has(d.id)) {
      if (Canvas.sel.size || Canvas.selLink) { Canvas.sel.clear(); Canvas.selLink = null; Canvas.refreshSel(); }
      this.select([d.id]);
    }
    this.selInfo();
    Ribbon.refreshSoon();
    const orig = new Map(this.selected().map(x => [x.id, JSON.parse(JSON.stringify(x))]));
    this.drag = { ...base, type: 'move', orig, boxes: this.movableBoxes() };
    Canvas.capture(ev);
    return true;
  },
  movableBoxes() { return Canvas.selectedBoxes().filter(b => !Canvas.isLocked(b)).map(b => ({ b, x: b.x, y: b.y })); },
  pressure(ev) {
    if (ev.pointerType !== 'pen') return 0.5;
    return Math.round(clamp(ev.pressure || 0.5, 0.05, 1) * 100) / 100;
  },
  liveEl(parent) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'live');
    parent.append(g);
    return g;
  },

  onMove(ev) {
    if (ev.pointerType === 'touch' && this.touches.has(ev.pointerId)) {
      this.touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (this.drag && (this.drag.type === 'pinch' || this.drag.type === 'tpan')) { this.touchMove(); return true; }
    }
    const d = this.drag;
    if (!d || d.pid !== ev.pointerId) return !!d && (d.type === 'pinch');
    const z = Canvas.view.z;
    if (!d.moved && Math.hypot(ev.clientX - d.sx, ev.clientY - d.sy) >= 3) d.moved = true;
    const w = Canvas.toWorld(ev.clientX, ev.clientY);
    switch (d.type) {
      case 'ink': {
        const evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
        for (const e of (evs.length ? evs : [ev])) {
          let q = Canvas.toWorld(e.clientX, e.clientY);
          if (d.snap) q = d.snap.project(q);
          const n = d.pts.length;
          if (Math.hypot(q.x - d.pts[n - 3], q.y - d.pts[n - 2]) < 0.9 / z) continue;
          if (d.snap && n >= 6) { d.pts.splice(3, n - 3); }
          d.pts.push(r1(q.x), r1(q.y), this.pressure(e));
        }
        this.renderLive();
        break;
      }
      case 'erase': {
        const steps = Math.max(1, Math.ceil(DG.dist(d.last, w) / (4 / z)));
        for (let i = 1; i <= steps; i++) this.eraseAt({ x: d.last.x + (w.x - d.last.x) * i / steps, y: d.last.y + (w.y - d.last.y) * i / steps });
        d.last = w;
        break;
      }
      case 'lasso': {
        const l = d.pts[d.pts.length - 1];
        if (DG.dist(l, w) > 3 / z) d.pts.push(w);
        Canvas.ov.innerHTML = `<path class="lasso-line" d="M${d.pts.map(p => n1(p.x) + ',' + n1(p.y)).join('L')}Z"/>`;
        break;
      }
      case 'shape': {
        let x2 = w.x, y2 = w.y;
        if (ev.shiftKey) {
          const dx = x2 - d.x1, dy = y2 - d.y1;
          if (['line', 'arrow', 'darrow'].includes(d.shape)) {
            const a = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4), L = Math.hypot(dx, dy);
            x2 = d.x1 + Math.cos(a) * L; y2 = d.y1 + Math.sin(a) * L;
          } else { const s = Math.max(Math.abs(dx), Math.abs(dy)); x2 = d.x1 + Math.sign(dx || 1) * s; y2 = d.y1 + Math.sign(dy || 1) * s; }
        }
        d.x2 = x2; d.y2 = y2;
        const sh = this.newShape(d);
        this.live.innerHTML = this.markup(sh);
        break;
      }
      case 'move': {
        const dx = (ev.clientX - d.sx) / z, dy = (ev.clientY - d.sy) / z;
        for (const [id, o] of d.orig) {
          const cur = this.drawing(id);
          if (!cur) continue;
          const copy = JSON.parse(JSON.stringify(o));
          DG.map(copy, (x, y) => ({ x: x + dx, y: y + dy }));
          Object.assign(cur, copy);
        }
        for (const it of d.boxes) {
          it.b.x = Math.round(it.x + dx); it.b.y = Math.round(it.y + dy);
          const e = Canvas.els.get(it.b.id);
          if (e) { e.style.left = it.b.x + 'px'; e.style.top = it.b.y + 'px'; }
        }
        if (d.boxes.length) Canvas.layout();
        this.render();
        break;
      }
      case 'scale': {
        let sx = (w.x - d.ax) / ((d.cx - d.ax) || 1), sy = (w.y - d.ay) / ((d.cy - d.ay) || 1);
        if (!ev.shiftKey) { const s = Math.max(Math.abs(sx), Math.abs(sy)); sx = Math.sign(sx || 1) * s; sy = Math.sign(sy || 1) * s; }
        if (Math.abs(sx) < 0.05) sx = 0.05 * Math.sign(sx || 1);
        if (Math.abs(sy) < 0.05) sy = 0.05 * Math.sign(sy || 1);
        for (const [id, o] of d.orig) {
          const cur = this.drawing(id);
          if (!cur) continue;
          const copy = JSON.parse(JSON.stringify(o));
          DG.map(copy, (x, y) => ({ x: d.ax + (x - d.ax) * sx, y: d.ay + (y - d.ay) * sy }));
          Object.assign(cur, copy);
        }
        this.render();
        break;
      }
      case 'toolMove': {
        const st = Store.ui[d.which];
        st.x = Math.round(d.ox + (ev.clientX - d.sx) / z); st.y = Math.round(d.oy + (ev.clientY - d.sy) / z);
        this.renderTools();
        break;
      }
      case 'toolRot': {
        const st = Store.ui[d.which];
        let a = Math.atan2(w.y - st.y, w.x - st.x) * 180 / Math.PI;
        a = Math.round(a);
        for (const s of [0, 45, 90, 135, 180, -45, -90, -135, -180]) if (Math.abs(a - s) <= 2) a = s;
        st.angle = ((a % 360) + 360) % 360;
        this.renderTools();
        break;
      }
    }
    return true;
  },

  onUp(ev, cancel) {
    if (ev.pointerType === 'touch' && this.touches.has(ev.pointerId)) {
      this.touches.delete(ev.pointerId);
      if (this.drag && (this.drag.type === 'pinch' || this.drag.type === 'tpan')) {
        if (this.touches.size === 0) this.drag = null;
        else if (this.drag.type === 'pinch') this.drag = { type: 'tpan-wait' };
        return true;
      }
      if (this.drag && this.drag.type === 'tpan-wait') { if (!this.touches.size) this.drag = null; return true; }
    }
    const d = this.drag;
    if (!d || d.pid !== ev.pointerId) return false;
    this.drag = null;
    try { Canvas.vp.releasePointerCapture(ev.pointerId); } catch (e) { /* */ }
    const p = Canvas.page;
    if (this.live) { this.live.remove(); this.live = null; }
    if (cancel || !p) { this.render(); return true; }
    switch (d.type) {
      case 'ink': {
        const pen = d.pen;
        const ink = { id: uid('d'), type: 'ink', kind: pen.kind, color: pen.color, w: pen.w, pts: d.pts, t0: d.t0, dur: Date.now() - d.t0, layer: 'oben' };
        let label = 'Freihand';
        if (Store.ui.recognize && !d.snap && (pen.kind === 'pen' || pen.kind === 'pencil')) {
          const sh = Recog.detect(DG.inkPts(ink));
          if (sh) { p.drawings.push(this.shapeFromRecog(sh, ink)); label = 'Form erkannt'; break; }
        }
        p.drawings.push(ink);
        Hist.touchPage(Canvas.pageId); Hist.commit(label);
        this.render();
        return true;
      }
      case 'erase':
        if (d.changed) { Hist.touchPage(Canvas.pageId); Hist.commit('Radiert'); }
        return true;
      case 'lasso': {
        Canvas.ov.innerHTML = '';
        if (d.pts.length < 3) { this.clearSel(); Canvas.clearSel(); return true; }
        const poly = d.pts;
        const ids = [];
        for (const dr of p.drawings) {
          const pts = DG.lines(dr).lines.flat();
          const inside = pts.filter(q => DG.inside(q, poly)).length;
          if (inside >= Math.max(1, pts.length * 0.6)) ids.push(dr.id);
        }
        const nodes = [];
        for (const k of p.pkgs) { const r = Canvas.rects.get(k.id); if (r && DG.inside(rectCenter(r), poly)) nodes.push(k.id); }
        for (const b of p.boxes) { if (b.pkg && nodes.includes(b.pkg)) continue; const r = Canvas.rects.get(b.id); if (r && DG.inside(rectCenter(r), poly)) nodes.push(b.id); }
        if (!d.additive) { Canvas.sel.clear(); Canvas.selLink = null; }
        for (const id of nodes) Canvas.sel.add(id);
        Canvas.refreshSel();
        this.select(ids, d.additive);
        if (!ids.length && !nodes.length) UI.toast('Nichts eingefangen – einfach um die Striche herumfahren');
        else $('#sb-hint').textContent = `${ids.length + nodes.length} Element(e) ausgewählt · verschieben: Rahmen ziehen · Entf = löschen · Rechtsklick = Optionen`;
        return true;
      }
      case 'shape': {
        if (Math.hypot(d.x2 - d.x1, d.y2 - d.y1) * Canvas.view.z < 4) { this.render(); return true; }
        const sh = this.newShape(d);
        p.drawings.push(sh);
        Hist.touchPage(Canvas.pageId); Hist.commit((SHAPES.find(s => s.id === d.shape) || {}).label || 'Form');
        this.render();
        return true;
      }
      case 'move':
        if (d.moved) { Hist.touchPage(Canvas.pageId); Hist.commit('Verschieben'); }
        this.render();
        return true;
      case 'scale':
        if (d.moved) { Hist.touchPage(Canvas.pageId); Hist.commit('Grösse geändert'); }
        this.render();
        return true;
      case 'toolMove': case 'toolRot':
        UiState.saveSoon();
        return true;
    }
    Hist.touchPage(Canvas.pageId); Hist.commit('Form erkannt');
    this.render();
    return true;
  },
  newShape(d) {
    const pen = this.activePen();
    const color = pen.kind === 'rainbow' || pen.kind === 'glitter' ? '#1f1f1f' : pen.color;
    const w = pen.kind === 'marker' ? 2.5 : clamp(pen.w, 1, 8);
    return { id: uid('d'), type: 'shape', shape: d.shape, x1: r1(d.x1), y1: r1(d.y1), x2: r1(d.x2), y2: r1(d.y2), color, w, fill: Store.ui.shapeFill || null, t0: Date.now(), layer: 'oben' };
  },
  shapeFromRecog(sh, ink) {
    const out = { id: ink.id, type: 'shape', shape: sh.shape, color: ink.kind === 'marker' ? '#1f1f1f' : ink.color, w: Math.max(1, ink.w), fill: null, t0: ink.t0, layer: ink.layer };
    if (sh.pts) out.pts = sh.pts.map(r1);
    else { out.x1 = r1(sh.x1); out.y1 = r1(sh.y1); out.x2 = r1(sh.x2); out.y2 = r1(sh.y2); }
    return out;
  },
  renderLive() {
    const d = this.drag;
    if (!d || !this.live) return;
    const ink = { type: 'ink', kind: d.pen.kind, color: d.pen.color, w: d.pen.w, pts: d.pts };
    this.live.innerHTML = this.markup(ink);
  },

  /* Radierer */
  eraseAt(w) {
    const p = Canvas.page, d = this.drag;
    const z = Canvas.view.z;
    const r = d.point ? clamp(Store.ui.eraserSize || 14, 6, 60) / 2 / z : 6 / z;
    let changed = false;
    const next = [];
    for (const dr of p.drawings) {
      if (!DG.hit(dr, w, r)) { next.push(dr); continue; }
      changed = true;
      if (!d.point || dr.type !== 'ink') continue;
      // Punkt-Radierer: Strich an dieser Stelle teilen
      const pts = DG.inkPts(dr);
      const parts = [];
      let cur = [];
      for (const q of pts) {
        if (DG.dist(q, w) <= r + dr.w / 2) { if (cur.length) parts.push(cur); cur = []; }
        else cur.push(q);
      }
      if (cur.length) parts.push(cur);
      parts.forEach((part, i) => {
        if (part.length < 2) return;
        next.push({ ...dr, id: i === 0 ? dr.id : uid('d'), pts: part.flatMap(q => [q.x, q.y, q.p]) });
      });
    }
    if (changed) { p.drawings = next; d.changed = true; this.render(); }
  },

  /* Lineal: Projektion auf die Kante */
  rulerSnap(w) {
    const st = Store.ui.ruler;
    if (!st.visible) return null;
    const a = st.angle * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a);
    const L = 640, H = 72;
    // obere Kante: Mitte - Normale * H/2
    const nx = -uy, ny = ux;
    const ex = st.x - nx * H / 2, ey = st.y - ny * H / 2;
    const rx = w.x - ex, ry = w.y - ey;
    const along = rx * ux + ry * uy, across = rx * nx + ry * ny;
    const tol = 22 / Canvas.view.z;
    if (Math.abs(along) > L / 2 + 10 || across < -tol || across > tol) return null;
    const off = -2 / Canvas.view.z; // knapp ausserhalb der Kante zeichnen
    return { project: (q) => { const t = (q.x - ex) * ux + (q.y - ey) * uy; return { x: ex + ux * t + nx * off, y: ey + uy * t + ny * off }; } };
  },

  /* ---------------------------------------------------------- Finger */
  touchDown(ev) {
    if (this.drag && this.drag.ptype && this.drag.ptype !== 'touch') return true; // Handballen beim Zeichnen mit dem Stift ignorieren
    this.touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    Canvas.capture(ev);
    if (this.touches.size >= 2) {
      // zweiter Finger: laufende Aktion abbrechen, zoomen
      if (this.drag && this.drag.type === 'ink' && this.live) { this.live.remove(); this.live = null; }
      if (Canvas.drag) { Canvas.drag = null; $('#marquee').hidden = true; Canvas.ov.innerHTML = ''; }
      const [a, b] = [...this.touches.values()];
      this.drag = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, z0: Canvas.view.z, vx: Canvas.view.x, vy: Canvas.view.y };
      ev.preventDefault();
      return true;
    }
    if ((Store.ui.penOnly && this.tool !== 'select') || this.tool === 'select' && Store.ui.penOnly) {
      this.drag = { type: 'tpan', pid: ev.pointerId, sx: ev.clientX, sy: ev.clientY, vx: Canvas.view.x, vy: Canvas.view.y };
      ev.preventDefault();
      return true;
    }
    return false;
  },
  touchMove() {
    const d = this.drag;
    const pts = [...this.touches.values()];
    if (d.type === 'pinch' && pts.length >= 2) {
      const [a, b] = pts;
      const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1, m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const z = clamp(d.z0 * dist / d.d0, 0.15, 4);
      const r = Canvas.vp.getBoundingClientRect();
      const wx = (d.m0.x - r.left - d.vx) / d.z0, wy = (d.m0.y - r.top - d.vy) / d.z0;
      Canvas.view.z = z;
      Canvas.view.x = m.x - r.left - wx * z;
      Canvas.view.y = m.y - r.top - wy * z;
      Canvas.applyView();
    } else if (d.type === 'tpan' && pts.length) {
      const p = this.touches.get(d.pid) || pts[0];
      Canvas.view.x = d.vx + p.x - d.sx; Canvas.view.y = d.vy + p.y - d.sy;
      Canvas.applyView();
    }
  },

  /* ---------------------------------------------------------- Lineal & Winkelmesser */
  buildTools() {
    const cm = 37.8;
    // Lineal 640 × 72
    let ticks = '';
    for (let i = 0, x = 8; x <= 632; i++, x = 8 + i * cm / 10) {
      const major = i % 10 === 0, half = i % 5 === 0;
      ticks += `<line x1="${n1(x)}" y1="0" x2="${n1(x)}" y2="${major ? 18 : half ? 12 : 7}"/>`;
      if (major) ticks += `<text x="${n1(x)}" y="30">${i / 10}</text>`;
    }
    this.ruler = el('div', { class: 'kt-tool ruler', dataset: { tool: 'ruler' }, hidden: true });
    this.ruler.innerHTML = `<svg width="640" height="72" viewBox="0 0 640 72"><g class="ticks">${ticks}</g></svg><span class="kt-angle"></span><span class="kt-rot" title="Drehen (oder Mausrad über dem Lineal)">${icon('restore', 14)}</span>`;
    // Winkelmesser Radius 200
    let pt = '';
    const R = 200;
    for (let a = 0; a <= 180; a++) {
      const rad = Math.PI - a * Math.PI / 180, len = a % 10 === 0 ? 16 : a % 5 === 0 ? 11 : 6;
      const x1 = 210 + Math.cos(rad) * R, y1 = 206 - Math.sin(rad) * R, x2 = 210 + Math.cos(rad) * (R - len), y2 = 206 - Math.sin(rad) * (R - len);
      pt += `<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}"/>`;
      if (a % 10 === 0) pt += `<text x="${n1(210 + Math.cos(rad) * (R - 30))}" y="${n1(206 - Math.sin(rad) * (R - 30) + 4)}">${a}</text>`;
      if (a % 30 === 0 && a && a < 180) pt += `<line class="ray" x1="210" y1="206" x2="${n1(210 + Math.cos(rad) * (R - 46))}" y2="${n1(206 - Math.sin(rad) * (R - 46))}"/>`;
    }
    this.prot = el('div', { class: 'kt-tool protractor', dataset: { tool: 'protractor' }, hidden: true });
    this.prot.innerHTML = `<svg width="420" height="214" viewBox="0 0 420 214"><path class="body" d="M10,206 A200,200 0 0 1 410,206 Z"/><g class="ticks">${pt}</g><circle cx="210" cy="206" r="3"/></svg><span class="kt-angle"></span><span class="kt-rot" title="Drehen (oder Mausrad)">${icon('restore', 14)}</span>`;
    this.tools.append(this.ruler, this.prot);
    for (const t of [this.ruler, this.prot]) {
      t.addEventListener('wheel', (e) => {
        e.preventDefault(); e.stopPropagation();
        const st = Store.ui[t.dataset.tool];
        const step = e.shiftKey ? 15 : 1;
        st.angle = ((Math.round((st.angle + Math.sign(e.deltaY || e.deltaX) * step) / step) * step) % 360 + 360) % 360;
        this.renderTools();
        UiState.saveSoon();
      }, { passive: false });
      t.addEventListener('dblclick', (e) => { e.stopPropagation(); Store.ui[t.dataset.tool].angle = 0; this.renderTools(); UiState.saveSoon(); });
    }
  },
  renderTools() {
    if (!this.ruler || !Store.ui.ruler) return;
    const show = !!Canvas.page && !App.preview;
    for (const [elx, st, W, H, oy] of [[this.ruler, Store.ui.ruler, 640, 72, 36], [this.prot, Store.ui.protractor, 420, 214, 206]]) {
      elx.hidden = !(show && st.visible);
      if (elx.hidden) continue;
      elx.style.left = (st.x - W / 2) + 'px';
      elx.style.top = (st.y - oy) + 'px';
      elx.style.transformOrigin = `${W / 2}px ${oy}px`;
      elx.style.transform = `rotate(${st.angle}deg)`;
      const a = st.angle > 180 ? st.angle - 360 : st.angle;
      elx.querySelector('.kt-angle').textContent = Math.abs(a) + '°';
    }
  },
  toggleTool(which) {
    const st = Store.ui[which];
    st.visible = !st.visible;
    if (st.visible) {
      const c = Canvas.viewCenter();
      const r = Canvas.vp.getBoundingClientRect();
      const vis = (x, y) => { const sx = x * Canvas.view.z + Canvas.view.x, sy = y * Canvas.view.z + Canvas.view.y; return sx > 0 && sy > 0 && sx < r.width && sy < r.height; };
      if (!vis(st.x, st.y)) { st.x = Math.round(c.x); st.y = Math.round(c.y); }
      if (which === 'ruler' && this.tool !== 'pen') this.setTool('pen');
    }
    this.renderTools();
    UiState.saveSoon();
    Ribbon.refreshSoon();
    if (st.visible) UI.toast(which === 'ruler' ? 'Lineal: verschieben = ziehen · drehen = Mausrad oder Pfeil-Knopf · mit dem Stift an der Kante entlang zeichnen' : 'Winkelmesser: verschieben = ziehen · drehen = Mausrad', 4200);
  },

  /* ---------------------------------------------------------- Auswahl bearbeiten */
  removeSelected() {
    const p = Canvas.page;
    if (!p || !this.sel.size) return 0;
    const n = this.sel.size;
    p.drawings = p.drawings.filter(d => !this.sel.has(d.id));
    this.sel.clear();
    this.render();
    return n;
  },
  nudge(dx, dy) {
    for (const d of this.selected()) DG.map(d, (x, y) => ({ x: x + dx, y: y + dy }));
    this.render();
  },
  selectAll() { if (Canvas.page) this.select(Canvas.page.drawings.map(d => d.id), true); },
  recolor(color) {
    const list = this.selected();
    if (!list.length) return false;
    for (const d of list) { if (d.type === 'ink' && (d.kind === 'rainbow' || d.kind === 'glitter')) d.kind = 'pen'; d.color = color; }
    this.render();
    Hist.touchPage(Canvas.pageId); Hist.commit('Farbe geändert');
    return true;
  },
  setFill(color) {
    const list = this.selected().filter(d => d.type === 'shape' && !['line', 'arrow', 'darrow', 'axes'].includes(d.shape));
    if (!list.length) return false;
    for (const d of list) d.fill = color || null;
    this.render();
    Hist.touchPage(Canvas.pageId); Hist.commit('Füllung geändert');
    return true;
  },
  setWidth(w) {
    const list = this.selected();
    if (!list.length) return false;
    for (const d of list) d.w = w;
    this.render();
    Hist.touchPage(Canvas.pageId); Hist.commit('Strichstärke geändert');
    return true;
  },
  order(front) {
    const p = Canvas.page, list = this.selected();
    if (!list.length) return false;
    const rest = p.drawings.filter(d => !this.sel.has(d.id));
    for (const d of list) d.layer = front ? 'oben' : 'unten';
    p.drawings = front ? [...rest, ...list] : [...list, ...rest];
    this.render();
    Hist.touchPage(Canvas.pageId); Hist.commit(front ? 'Zeichnung vor den Text' : 'Zeichnung hinter den Text');
    UI.toast(front ? 'Liegt jetzt über den Textfeldern' : 'Liegt jetzt hinter den Textfeldern');
    return true;
  },
  contextMenu(x, y) {
    const list = this.selected();
    const shapes = list.filter(d => d.type === 'shape');
    UI.menu([
      { head: `${list.length} Zeichnung${list.length === 1 ? '' : 'en'}` },
      { label: 'Ausschneiden', icon: 'cut', key: 'Strg+X', action: () => Canvas.copySelection(true) },
      { label: 'Kopieren', icon: 'copy', key: 'Strg+C', action: () => Canvas.copySelection(false) },
      { label: 'Duplizieren', icon: 'duplicate', key: 'Strg+D', action: () => Canvas.duplicate() },
      '-',
      { head: 'Farbe' }, { colors: INK_COLORS.slice(0, 14), action: (c) => this.recolor(c) },
      shapes.length ? { head: 'Füllung' } : null,
      shapes.length ? { colors: [null, '#ffffff', '#FFF4C2', '#DCEBFF', '#DDF3E0', '#FDE2E4', '#EDE4FF', '#1f1f1f', '#2f5fd0', '#d13438'], action: (c) => this.setFill(c) } : null,
      '-',
      { label: 'Vor den Text', icon: 'layerUp', action: () => this.order(true) },
      { label: 'Hinter den Text', icon: 'layerDown', action: () => this.order(false) },
      list.some(d => d.type === 'ink') ? { label: 'Freihand → Form', icon: 'inkShape', action: () => this.inkToShape() } : null,
      list.some(d => d.type === 'ink') ? { label: 'Freihand → Text (Beta)', icon: 'inkText', action: () => this.inkToText() } : null,
      '-',
      { label: 'Löschen', icon: 'trash', danger: true, key: 'Entf', action: () => Canvas.deleteSelection() },
    ], x, y);
  },

  /* ---------------------------------------------------------- Umwandeln */
  inkToShape() {
    const p = Canvas.page;
    const inks = this.selected().filter(d => d.type === 'ink');
    if (!inks.length) { UI.toast('Zuerst Freihand-Striche auswählen (Auswählen oder Lasso)'); return; }
    let n = 0;
    for (const ink of inks) {
      const sh = Recog.detect(DG.inkPts(ink));
      if (!sh) continue;
      const i = p.drawings.indexOf(ink);
      p.drawings[i] = this.shapeFromRecog(sh, ink);
      n++;
    }
    if (!n) { UI.toast('Keine Form erkannt – Linien, Rechtecke, Dreiecke, Rauten, Kreise und Vielecke gehen am besten'); return; }
    this.render();
    Hist.touchPage(Canvas.pageId); Hist.commit(n === 1 ? 'Freihand → Form' : `Freihand → ${n} Formen`);
    UI.toast(`${n} von ${inks.length} Strich${inks.length === 1 ? '' : 'en'} in Formen umgewandelt`);
  },
  loadScript(src) {
    return new Promise((res, rej) => {
      if (document.querySelector(`script[data-src="${src}"]`)) { res(); return; }
      const s = el('script', { src, dataset: { src } });
      s.onload = () => res();
      s.onerror = () => { s.remove(); rej(new Error('Laden fehlgeschlagen – ist das Internet verbunden?')); };
      document.head.append(s);
    });
  },
  async inkToText() {
    const inks = this.selected().filter(d => d.type === 'ink');
    if (!inks.length) { UI.toast('Zuerst die handgeschriebenen Striche auswählen (z.B. mit dem Lasso)'); return; }
    const r = DG.union(inks.map(d => DG.bbox(d)));
    const scale = clamp(110 / Math.max(30, Math.min(r.h, 400)), 0.6, 3);
    const pad = 24;
    const cv = el('canvas');
    cv.width = Math.min(3000, Math.ceil(r.w * scale + pad * 2));
    cv.height = Math.min(3000, Math.ceil(r.h * scale + pad * 2));
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = '#000'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const d of [...inks].sort((a, b) => (a.t0 || 0) - (b.t0 || 0))) {
      const pts = DG.smooth(DG.inkPts(d));
      ctx.lineWidth = Math.max(3, Math.min(d.w, 6) * scale);
      ctx.beginPath();
      pts.forEach((q, i) => { const x = (q.x - r.x) * scale + pad, y = (q.y - r.y) * scale + pad; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
      if (pts.length === 1) ctx.lineTo((pts[0].x - r.x) * scale + pad + 0.1, (pts[0].y - r.y) * scale + pad);
      ctx.stroke();
    }
    UI.toast('Handschrift wird erkannt … (beim ersten Mal wird die Texterkennung geladen, das kann etwas dauern)', 8000);
    let text = '';
    try {
      if (!window.Tesseract) await this.loadScript(TESSERACT_URL);
      const worker = await Tesseract.createWorker('deu');
      const res = await worker.recognize(cv);
      await worker.terminate();
      text = (res && res.data && res.data.text || '').trim();
    } catch (e) {
      UI.toast('Texterkennung nicht verfügbar: ' + e.message, 4500);
      return;
    }
    const out = await UI.dialog((dl, close) => {
      dl.append(el('h2', { text: 'Freihand → Text (Beta)' }));
      dl.append(el('p', { text: text ? 'Erkannter Text – bei Bedarf korrigieren:' : 'Es wurde kein Text erkannt. Deutlich und gross schreiben hilft. Du kannst den Text auch selbst eintippen:' }));
      const ta = el('textarea', { style: { width: '100%', minHeight: '110px', font: '13px var(--font-note)', padding: '8px', border: '1px solid var(--line-2)', borderRadius: '5px', background: 'var(--chrome-2)', color: 'var(--ink)', resize: 'vertical' } });
      ta.value = text;
      const keep = el('input', { type: 'checkbox' });
      dl.append(ta, el('label', { style: { display: 'flex', gap: '6px', alignItems: 'center', marginTop: '8px', color: 'var(--ink-2)' } }, keep, 'Handschrift behalten'));
      dl.append(el('div', { class: 'dlg-btns' },
        el('button', { class: 'btn', text: 'Abbrechen', onclick: () => close(null) }),
        el('button', { class: 'btn primary', text: 'Als Textfeld einfügen', onclick: () => close({ text: ta.value, keep: keep.checked }) })));
      setTimeout(() => ta.focus(), 30);
    });
    if (!out || !out.text.trim()) return;
    const p = Canvas.page;
    const html = out.text.trim().split(/\r?\n/).map(l => `<div>${l.trim() ? escapeHtml(l) : '<br>'}</div>`).join('');
    if (!out.keep) { p.drawings = p.drawings.filter(d => !inks.includes(d)); this.sel.clear(); }
    const b = Canvas.createBoxAt({ x: r.x + PADX, y: r.y + BAR + 11 }, { html, w: clamp(Math.round(r.w + 30), 160, 640), noFocus: true, label: 'Freihand → Text' });
    this.render();
    if (b) Canvas.select([b.id]);
  },

  /* Freihand-Wiedergabe: Striche in der Reihenfolge des Zeichnens */
  async replay() {
    const p = Canvas.page;
    if (!p || !p.drawings.length) { UI.toast('Auf dieser Seite gibt es noch keine Zeichnungen'); return; }
    if (this.replaying) { this.stopReplay(); return; }
    const list = [...p.drawings].sort((a, b) => (a.t0 || 0) - (b.t0 || 0));
    const token = { stop: false };
    this.replaying = token;
    this.clearSel(true);
    this.renderSel();
    for (const g of $$('#world g[data-d]')) g.style.opacity = '0';
    UI.toast('Wiedergabe … (Esc oder Klick = abbrechen)', 2500);
    for (const d of list) {
      if (token.stop) break;
      const g = $(`#world g[data-d="${d.id}"]`);
      if (!g) continue;
      if (d.type === 'ink' && d.pts.length >= 6) {
        const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        tmp.setAttribute('d', centerPath(DG.smooth(DG.inkPts(d))));
        tmp.setAttribute('fill', 'none');
        tmp.setAttribute('stroke', d.kind === 'rainbow' ? '#ff9500' : d.kind === 'glitter' ? '#c9a227' : d.color);
        tmp.setAttribute('stroke-width', d.w * (d.kind === 'marker' ? 1 : 0.9));
        tmp.setAttribute('stroke-linecap', 'round');
        tmp.setAttribute('stroke-linejoin', 'round');
        if (d.kind === 'marker') tmp.setAttribute('class', 'ink-marker');
        g.parentNode.insertBefore(tmp, g);
        const len = tmp.getTotalLength() || 1;
        tmp.style.strokeDasharray = `${len} ${len}`;
        const dur = clamp(d.dur || len * 3, 160, 1400);
        const t0 = performance.now();
        await new Promise(res => {
          const step = (now) => {
            if (token.stop) { res(); return; }
            const k = Math.min(1, (now - t0) / dur);
            tmp.style.strokeDashoffset = String(len * (1 - k));
            if (k < 1) requestAnimationFrame(step); else res();
          };
          requestAnimationFrame(step);
        });
        tmp.remove();
      } else {
        await new Promise(res => setTimeout(res, token.stop ? 0 : 220));
      }
      g.style.transition = 'opacity .15s';
      g.style.opacity = '';
      await new Promise(res => setTimeout(res, token.stop ? 0 : 60));
    }
    if (this.replaying === token) this.stopReplay();
  },
  stopReplay() {
    if (!this.replaying) return;
    this.replaying.stop = true;
    this.replaying = null;
    for (const g of $$('#world g[data-d]')) { g.style.opacity = ''; g.style.transition = ''; }
    this.render();
  },

  /* ---------------------------------------------------------- Stifte einstellen */
  penMenu(i, anchor) {
    const pens = Store.ui.pens;
    const pen = pens[i];
    if (!pen) return;
    const box = el('div', { class: 'pen-pop' });
    const apply = () => { UiState.saveSoon(); this.setTool('pen', i); Ribbon.show(Ribbon.tab); };
    box.append(el('div', { class: 'mhead', text: 'Art' }));
    const kinds = el('div', { class: 'pen-kinds' });
    for (const [k, label] of Object.entries(PEN_KINDS)) {
      const b = el('button', { class: 'pen-kind' + (pen.kind === k ? ' on' : ''), title: label, html: this.penIcon({ ...pen, kind: k }, 26) + `<span>${label}</span>` });
      b.addEventListener('click', () => {
        pen.kind = k;
        const ws = PEN_WIDTHS[k];
        if (!ws.includes(pen.w)) pen.w = ws[Math.floor(ws.length / 2)];
        if (k === 'marker' && !['#FFE600', '#7CFC7C', '#5ee1ff', '#ff8fd0'].includes(pen.color)) pen.color = '#FFE600';
        if (k !== 'marker' && ['#FFE600', '#7CFC7C', '#5ee1ff', '#ff8fd0'].includes(pen.color)) pen.color = '#1f1f1f';
        UI.closePopup(); apply(); this.penMenu(i, $(`#panel .pen-btn[data-pen="${i}"]`) || anchor);
      });
      kinds.append(b);
    }
    box.append(kinds);
    if (pen.kind !== 'rainbow' && pen.kind !== 'glitter') {
      box.append(el('div', { class: 'mhead', text: 'Farbe' }));
      const row = el('div', { class: 'mcolors', style: { maxWidth: '260px' } });
      for (const c of INK_COLORS) {
        const b = el('button', { class: 'sw' + (c === pen.color ? ' cur' : ''), title: c, style: { background: c } });
        b.addEventListener('click', () => { pen.color = c; UI.closePopup(); apply(); });
        row.append(b);
      }
      const more = el('button', { class: 'sw wheel', title: 'Eigene Farbe (Farbrad) …' });
      more.addEventListener('click', () => UI.colorWheel(anchor, pen.color, (c) => { pen.color = c; apply(); }, { title: 'Stiftfarbe' }));
      row.append(more);
      box.append(row);
    }
    box.append(el('div', { class: 'mhead', text: 'Stärke' }));
    const ws = el('div', { class: 'pen-widths' });
    for (const w of PEN_WIDTHS[pen.kind] || PEN_WIDTHS.pen) {
      const b = el('button', { class: 'pen-w' + (w === pen.w ? ' on' : ''), title: String(w).replace('.', ',') + ' px' });
      b.innerHTML = `<i style="width:${Math.min(26, Math.max(2, w * (pen.kind === 'marker' ? 0.8 : 1.6)))}px;height:${Math.min(26, Math.max(2, w * (pen.kind === 'marker' ? 0.8 : 1.6)))}px;background:${pen.kind === 'rainbow' ? 'linear-gradient(45deg,#ff2d55,#ffcc00,#34c759,#0a84ff,#bf5af2)' : pen.kind === 'glitter' ? 'linear-gradient(45deg,#8a6d1d,#f5d76e,#c9a227)' : pen.color}"></i>`;
      b.addEventListener('click', () => { pen.w = w; UI.closePopup(); apply(); });
      ws.append(b);
    }
    box.append(ws);
    const reset = el('div', { class: 'mi', html: `<span class="mi-ic">${icon('restore', 15)}</span><span class="mi-label">Alle Stifte zurücksetzen</span>` });
    reset.addEventListener('click', () => { Store.ui.pens = JSON.parse(JSON.stringify(DEFAULT_PENS)); UI.closePopup(); UiState.saveSoon(); Ribbon.show(Ribbon.tab); });
    box.append(el('div', { class: 'msep' }), reset);
    UI.showPopup(box, 0, 0, { anchor });
  },
  penIcon(pen, size = 30) {
    const c = pen.kind === 'rainbow' ? 'url(#pi-rb)' : pen.kind === 'glitter' ? 'url(#pi-gd)' : pen.color;
    const defs = '<defs><linearGradient id="pi-rb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d55"/><stop offset=".3" stop-color="#ffcc00"/><stop offset=".55" stop-color="#34c759"/><stop offset=".8" stop-color="#0a84ff"/><stop offset="1" stop-color="#bf5af2"/></linearGradient><linearGradient id="pi-gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6d1d"/><stop offset=".45" stop-color="#f5d76e"/><stop offset="1" stop-color="#9c7a1e"/></linearGradient></defs>';
    const body = pen.kind === 'marker'
      ? `<path d="M9 4h6v9l-3 3-3-3z" fill="${c}" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><rect x="8.5" y="15.5" width="7" height="5" rx="1" fill="${c}" opacity=".55"/>`
      : pen.kind === 'pencil'
        ? `<path d="M9.5 3h5v12l-2.5 5-2.5-5z" fill="#e9c46a" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><path d="M10.6 17.3 12 20l1.4-2.7z" fill="${c}"/>`
        : `<path d="M9.5 3h5v11l-2.5 6-2.5-6z" fill="${c}" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><path d="M11 14h2" stroke="#fff" stroke-width="1" opacity=".7"/>`;
    return `<svg class="pen-ic" viewBox="6.5 1.5 11 21" width="${Math.round(size * 0.62)}" height="${size}">${pen.kind === 'rainbow' || pen.kind === 'glitter' ? defs : ''}${body}</svg>`;
  },
};

</script>
<script>
/* ---- js/commands.js ---- */
'use strict';
/* Alle Befehle des Menübands + Textformatierung wie in PowerPoint */

const FONT_SIZES = [8, 9, 10, 10.5, 11, 12, 14, 16, 18, 20, 24, 28, 32, 36, 40, 44, 48, 54, 60, 66, 72, 80, 88, 96];
const FONTS = ['Calibri', 'Aptos', 'Arial', 'Arial Black', 'Cambria', 'Candara', 'Comic Sans MS', 'Consolas', 'Courier New', 'Georgia',
  'Impact', 'Lucida Sans Unicode', 'Palatino Linotype', 'Segoe Print', 'Segoe Script', 'Segoe UI', 'Tahoma', 'Times New Roman', 'Trebuchet MS', 'Verdana'];
const SYMBOLS = ['→', '←', '↑', '↓', '↔', '⇒', '⇐', '⇔', '➜', '↳', '✓', '✗', '★', '☆', '•', '◦', '▪', '►', '◆', '○',
  '…', '–', '—', '≈', '≠', '≤', '≥', '±', '×', '÷', '∞', '°', '€', '£', '$', '§', '©', '®', '™', '¶',
  'α', 'β', 'γ', 'δ', 'Δ', 'λ', 'μ', 'π', 'Σ', 'Ω', '½', '¼', '¾', '²', '³', '√', '∑', '∫', '∅', '∈',
  '💡', '❗', '❓', '⚠️', '✅', '❌', '📌', '📎', '🔗', '📅', '⭐', '🔥', '🎯', '🚀', '🧠', '💬', '📝', '🔍', '🏁', '❤️'];
const BOX_PRESETS = [
  { name: 'Standard', style: { bg: null, border: null, color: null }, sw: 'var(--box-bg)', bd: 'var(--box-border)' },
  { name: 'Unsichtbar (wie OneNote)', style: { bg: 'transparent', border: null, color: null }, sw: 'transparent', bd: 'var(--line-2)', dash: true },
  { name: 'Idee', style: { bg: '#FFF4C2', border: '#E8C547', color: '#252423' } },
  { name: 'Info', style: { bg: '#DCEBFF', border: '#6AA3E8', color: '#252423' } },
  { name: 'Erledigt', style: { bg: '#DDF3E0', border: '#5DB36A', color: '#252423' } },
  { name: 'Wichtig', style: { bg: '#FDE0E0', border: '#E06666', color: '#252423' } },
  { name: 'Frage', style: { bg: '#EDE3FA', border: '#9B7AD6', color: '#252423' } },
  { name: 'Dunkel', style: { bg: '#2B2F36', border: '#2B2F36', color: '#F3F3F3' } },
];

function anchorElement() {
  const s = getSelection();
  if (!s.rangeCount) return null;
  const n = s.anchorNode;
  return n && (n.nodeType === 1 ? n : n.parentElement);
}

const Fmt = {
  painter: null,

  target() {
    if (Canvas.editing && Canvas.restoreRange()) return 'edit';
    if (Canvas.selectedBoxes().length) return 'boxes';
    return null;
  },
  apply(fn, label) {
    if (Store.readOnly) return;
    Hist.flushPending();
    const t = this.target();
    if (t === 'edit') {
      try { document.execCommand('styleWithCSS', false, true); } catch (e) { /* */ }
      fn(Canvas.textEl(Canvas.editing));
      const sel = getSelection();
      if (sel.rangeCount) { Canvas.lastRange = sel.getRangeAt(0).cloneRange(); Canvas.lastRangeBox = Canvas.editing; }
      Canvas.syncEditing();
      Hist.commit(label);
    } else if (t === 'boxes') {
      Canvas.bulkEdit(Canvas.selectedBoxes(), (root) => { document.execCommand('styleWithCSS', false, true); fn(root); });
      Hist.commit(label);
    } else UI.toast('Zuerst Text markieren oder ein Textfeld auswählen');
    Ribbon.refreshSoon();
  },
  exec(cmd, val = null) { document.execCommand(cmd, false, val); },

  setFontSize(pt, root) {
    const s = getSelection();
    if (!s.rangeCount) return;
    if (s.isCollapsed) {
      document.execCommand('insertHTML', false, `<span data-kt-new="1" style="font-size:${pt}pt">\u200B</span>`);
      const sp = root.querySelector('[data-kt-new]');
      if (sp) {
        sp.removeAttribute('data-kt-new');
        const r = document.createRange();
        r.setStart(sp.firstChild, 1); r.collapse(true);
        s.removeAllRanges(); s.addRange(r);
      }
      return;
    }
    document.execCommand('styleWithCSS', false, false);
    document.execCommand('fontSize', false, '7');
    document.execCommand('styleWithCSS', false, true);
    const made = [];
    for (const f of Array.from(root.querySelectorAll('font[size="7"]'))) {
      const sp = document.createElement('span');
      sp.style.fontSize = pt + 'pt';
      for (const inner of f.querySelectorAll('[style]')) { inner.style.fontSize = ''; if (!inner.getAttribute('style')) inner.removeAttribute('style'); }
      for (const inner of f.querySelectorAll('font[size]')) inner.removeAttribute('size');
      while (f.firstChild) sp.append(f.firstChild);
      if (f.getAttribute('color')) sp.style.color = f.getAttribute('color');
      if (f.getAttribute('face')) sp.style.fontFamily = f.getAttribute('face');
      f.replaceWith(sp);
      made.push(sp);
    }
    for (const x of Array.from(root.querySelectorAll('[style*="xxx-large"]'))) x.style.fontSize = pt + 'pt';
    if (made.length) {
      const r = document.createRange();
      r.setStartBefore(made[0]); r.setEndAfter(made[made.length - 1]);
      s.removeAllRanges(); s.addRange(r);
    }
  },
  fontSize(pt) {
    pt = clamp(Math.round(+pt * 2) / 2 || 11, 1, 400);
    this.apply(root => this.setFontSize(pt, root), 'Schriftgrad ' + pt);
  },
  currentSize() {
    let e = anchorElement();
    if (!(e && e.closest('.box-text'))) { const b = Canvas.selectedBoxes()[0]; e = b && Canvas.textEl(b.id); if (e && e.firstElementChild) e = e.firstElementChild; }
    if (!e) return 11;
    const px = parseFloat(getComputedStyle(e).fontSize) || 14.67;
    return Math.round(px * 0.75 * 2) / 2;
  },
  currentFont() {
    let e = anchorElement();
    if (!(e && e.closest('.box-text'))) { const b = Canvas.selectedBoxes()[0]; e = b && Canvas.textEl(b.id); }
    if (!e) return 'Calibri';
    return (getComputedStyle(e).fontFamily.split(',')[0] || 'Calibri').replace(/["']/g, '').trim();
  },
  grow(dir) {
    const cur = this.currentSize();
    const next = dir > 0 ? (FONT_SIZES.find(s => s > cur) || cur + 8) : ([...FONT_SIZES].reverse().find(s => s < cur) || Math.max(1, cur - 1));
    this.fontSize(next);
  },
  changeCase(mode) {
    this.apply((root) => {
      const s = getSelection();
      if (!s.rangeCount) return;
      const r = s.getRangeAt(0);
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) if (r.intersectsNode(walker.currentNode)) nodes.push(walker.currentNode);
      let prev = ' ', first = true;
      const one = (ch, up) => { const t = up ? ch.toLocaleUpperCase('de') : ch.toLocaleLowerCase('de'); return t.length === 1 ? t : ch; };
      for (const n of nodes) {
        const a = n === r.startContainer ? r.startOffset : 0;
        const b = n === r.endContainer ? r.endOffset : n.data.length;
        let seg = '';
        for (const ch of n.data.slice(a, b)) {
          let out = ch;
          if (mode === 'upper') out = one(ch, true);
          else if (mode === 'lower') out = one(ch, false);
          else if (mode === 'toggle') out = ch === one(ch, true) ? one(ch, false) : one(ch, true);
          else if (mode === 'title') out = /\s|[-–(„"]/.test(prev) ? one(ch, true) : one(ch, false);
          else if (mode === 'sentence') out = (first || /[.!?]\s*$/.test(prev + '') ) && /\p{L}/u.test(ch) ? one(ch, true) : one(ch, false);
          if (/\p{L}/u.test(ch)) first = false;
          if (mode === 'sentence' && /[.!?]/.test(ch)) first = true;
          prev = ch;
          seg += out;
        }
        n.data = n.data.slice(0, a) + seg + n.data.slice(b);
      }
      try { s.removeAllRanges(); s.addRange(r); } catch (e) { /* */ }
    }, 'Gross-/Kleinschreibung');
  },
  lineSpacing(v) {
    const boxes = Canvas.editing ? [Canvas.box(Canvas.editing)] : Canvas.selectedBoxes();
    if (!boxes.length || !boxes[0]) { UI.toast('Zuerst ein Textfeld auswählen'); return; }
    Hist.flushPending();
    for (const b of boxes) {
      b.style = { ...b.style, lh: String(v) };
      _tpl.innerHTML = b.html;
      _tpl.content.querySelectorAll('[style]').forEach(x => { x.style.lineHeight = ''; if (!x.getAttribute('style')) x.removeAttribute('style'); });
      b.html = _tpl.innerHTML;
    }
    Canvas.render(true);
    if (Canvas.editing) Canvas.restoreRange();
    Hist.touchPage(Canvas.pageId);
    Hist.commit('Zeilenabstand');
  },
  listStyleAtCursor(type) {
    const e = anchorElement();
    const list = e && e.closest('ul,ol');
    if (list && type) list.style.listStyleType = type;
  },
  bullets(type) {
    this.apply((root) => {
      const e = anchorElement();
      const inUl = e && e.closest('ul');
      if (!inUl || !type) this.exec('insertUnorderedList');
      const ul = anchorElement()?.closest('ul');
      if (ul) { ul.classList.remove('checklist'); if (!ul.className) ul.removeAttribute('class'); if (type) ul.style.listStyleType = type; }
      if (!type && ul) root.querySelectorAll('ul').forEach(x => { if (!x.className) x.removeAttribute('class'); });
    }, 'Aufzählung');
  },
  numbering(type) {
    this.apply(() => {
      const e = anchorElement();
      if (!(e && e.closest('ol')) || !type) this.exec('insertOrderedList');
      this.listStyleAtCursor(type);
    }, 'Nummerierung');
  },
  checklist() {
    this.apply(() => {
      const e = anchorElement();
      const ul = e && e.closest('ul');
      if (ul && ul.classList.contains('checklist')) { this.exec('insertUnorderedList'); return; }
      if (!ul) this.exec('insertUnorderedList');
      const u = anchorElement()?.closest('ul');
      if (u) { u.classList.add('checklist'); u.style.listStyleType = ''; }
    }, 'Checkliste');
  },
  clearFormat() {
    this.apply((root) => {
      this.exec('removeFormat');
      const s = getSelection();
      if (!s.rangeCount) return;
      const r = s.getRangeAt(0);
      for (const x of Array.from(root.querySelectorAll('span[style],font'))) {
        if (!r.intersectsNode(x)) continue;
        if (x.tagName === 'FONT') { x.replaceWith(...x.childNodes); continue; }
        for (const p of ['font-size', 'font-family', 'color', 'background-color', 'font-weight', 'font-style', 'text-decoration', 'text-decoration-line']) x.style.removeProperty(p);
        if (!x.getAttribute('style')) x.replaceWith(...x.childNodes);
      }
    }, 'Formatierung löschen');
  },
  fontColor(c) {
    this.apply((root) => {
      if (c) { this.exec('foreColor', c); return; }
      const s = getSelection();
      if (!s.rangeCount) return;
      const r = s.getRangeAt(0);
      for (const x of Array.from(root.querySelectorAll('[style*="color"],font[color]'))) {
        if (!r.intersectsNode(x)) continue;
        x.style.removeProperty('color'); x.removeAttribute('color');
        if (x.tagName === 'SPAN' && !x.getAttribute('style')) x.replaceWith(...x.childNodes);
      }
    }, 'Schriftfarbe');
  },
  highlight(c) {
    this.apply(() => this.exec('hiliteColor', c || 'transparent'), 'Texthervorhebung');
  },
  blockStyle(tag) {
    this.apply(() => this.exec('formatBlock', tag), 'Formatvorlage');
  },

  /* Format übertragen (Pinsel) */
  startPainter() {
    if (Canvas.editing && Canvas.restoreRange()) {
      const e = anchorElement();
      if (!e) return;
      const cs = getComputedStyle(e);
      let bg = null;
      for (let x = e; x && !x.classList.contains('box-text'); x = x.parentElement) {
        const b = getComputedStyle(x).backgroundColor;
        if (b && b !== 'rgba(0, 0, 0, 0)' && b !== 'transparent') { bg = b; break; }
      }
      this.painter = {
        kind: 'text', bold: parseInt(cs.fontWeight, 10) >= 600, italic: cs.fontStyle === 'italic',
        underline: cs.textDecorationLine.includes('underline'), strike: cs.textDecorationLine.includes('line-through'),
        color: e.closest('[style*="color"],font[color]') ? cs.color : null, bg, font: cs.fontFamily.split(',')[0].replace(/["']/g, ''),
        size: Math.round(parseFloat(cs.fontSize) * 0.75 * 2) / 2,
      };
      UI.toast('Format übertragen: jetzt den Zieltext markieren (Esc = abbrechen)', 3500);
    } else {
      const b = Canvas.selectedBoxes()[0];
      if (!b) { UI.toast('Zuerst Text oder ein Textfeld auswählen, dessen Format übertragen werden soll'); return; }
      this.painter = { kind: 'box', style: { ...b.style } };
      UI.toast('Format übertragen: jetzt auf ein anderes Textfeld klicken (Esc = abbrechen)', 3500);
    }
    document.body.classList.add('painter');
    Ribbon.refreshSoon();
  },
  cancelPainter() {
    this.painter = null;
    document.body.classList.remove('painter');
    Ribbon.refreshSoon();
  },
  applyPainter() {
    const P = this.painter;
    if (!P || P.kind !== 'text') return;
    const s = getSelection();
    if (!s.rangeCount || s.isCollapsed) return;
    const e = anchorElement();
    const root = e && e.closest('.box-text');
    if (!root) return;
    Hist.flushPending();
    document.execCommand('styleWithCSS', false, true);
    this.exec('removeFormat');
    this.exec('fontName', P.font);
    this.setFontSize(P.size, root);
    if (P.color) this.exec('foreColor', P.color);
    if (P.bg) this.exec('hiliteColor', P.bg);
    if (P.bold) this.exec('bold');
    if (P.italic) this.exec('italic');
    if (P.underline) this.exec('underline');
    if (P.strike) this.exec('strikeThrough');
    Canvas.syncEditing();
    Hist.commit('Format übertragen');
    this.cancelPainter();
  },
  applyBoxPainter(boxId) {
    const P = this.painter;
    const b = Canvas.box(boxId);
    if (!P || P.kind !== 'box' || !b) return;
    b.style = { ...P.style };
    Canvas.render();
    Hist.touchPage(Canvas.pageId);
    Hist.commit('Format übertragen');
    this.cancelPainter();
  },
};

/* ---------------------------------------------------------------- Suchen & Ersetzen */
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function replaceInHtml(html, q, rep, once) {
  _tpl.innerHTML = html;
  let count = 0;
  const re = new RegExp(escapeRe(q), 'gi');
  const w = document.createTreeWalker(_tpl.content, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes) {
    if (once && count) break;
    n.data = n.data.replace(re, (m) => { if (once && count) return m; count++; return rep; });
  }
  return { html: _tpl.innerHTML, count };
}

const Find = {
  el: null, results: [], cur: -1,
  open(mode = 'find', q) {
    if (!this.el) this.build();
    this.el.hidden = false;
    this.el.querySelector('.fp-rep').hidden = mode !== 'replace';
    this.el.querySelector('.fp-title').textContent = mode === 'replace' ? 'Suchen und Ersetzen' : 'Suchen';
    const r = $('#stage').getBoundingClientRect();
    this.el.style.left = (r.right - 356) + 'px';
    this.el.style.top = (r.top + 8) + 'px';
    const inp = this.el.querySelector('.fp-q');
    if (q != null) inp.value = q;
    else if (Canvas.editing) { const s = getSelection().toString().trim(); if (s && s.length < 80) inp.value = s; }
    inp.focus(); inp.select();
    this.search();
  },
  close() { if (this.el) this.el.hidden = true; },
  build() {
    const p = el('div', { id: 'findpanel', hidden: true });
    p.innerHTML = `<div class="fp-head"><span class="fp-title">Suchen</span><button class="nav-add fp-x" title="Schliessen">${icon('x', 14)}</button></div>
      <div class="fp-row"><input type="text" class="fp-q" placeholder="In allen Seiten suchen …"></div>
      <div class="fp-rep"><div class="fp-row"><input type="text" class="fp-r" placeholder="Ersetzen durch …"></div>
      <div class="fp-row"><button class="btn fp-one">Ersetzen</button><button class="btn fp-all">Alle ersetzen</button><label><input type="checkbox" class="fp-scope"> alle Seiten</label></div></div>
      <div class="fp-count"></div><div class="fp-res"></div>`;
    document.body.append(p);
    this.el = p;
    p.querySelector('.fp-x').addEventListener('click', () => this.close());
    const q = p.querySelector('.fp-q');
    q.addEventListener('input', debounce(() => this.search(), 120));
    q.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') this.go(this.cur + 1); if (e.key === 'Escape') this.close(); });
    p.querySelector('.fp-r').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') this.close(); });
    p.querySelector('.fp-one').addEventListener('click', () => this.replace(false));
    p.querySelector('.fp-all').addEventListener('click', () => this.replace(true));
  },
  search() {
    const q = this.el.querySelector('.fp-q').value.trim();
    const res = this.el.querySelector('.fp-res');
    res.innerHTML = '';
    this.results = []; this.cur = -1;
    if (!q) { this.el.querySelector('.fp-count').textContent = 'Suchbegriff eingeben – durchsucht alle Seiten und Gruppen.'; return; }
    const ql = q.toLowerCase();
    const order = [];
    for (const { g } of Tree.all()) for (const pid of g.pages) order.push({ pid, g });
    let total = 0;
    for (const { pid, g } of order) {
      const p = Store.pages[pid];
      if (!p) continue;
      if (p.title.toLowerCase().includes(ql)) this.results.push({ pid, boxId: null, text: p.title, g });
      for (const b of p.boxes) {
        const t = htmlToText(b.html).replace(/\s+/g, ' ');
        const i = t.toLowerCase().indexOf(ql);
        if (i < 0) continue;
        total += t.toLowerCase().split(ql).length - 1;
        this.results.push({ pid, boxId: b.id, text: (i > 30 ? '…' : '') + t.slice(Math.max(0, i - 30), i + q.length + 50), g });
      }
    }
    this.el.querySelector('.fp-count').textContent = this.results.length ? `${total || this.results.length} Treffer in ${new Set(this.results.map(r => r.pid)).size} Seite(n)` : 'Keine Treffer';
    const re = new RegExp(escapeRe(escapeHtml(q)), 'gi');
    this.results.slice(0, 200).forEach((r, i) => {
      const it = el('div', { class: 'fp-item' });
      it.innerHTML = `<b></b><span>${escapeHtml(r.text).replace(re, m => `<mark>${m}</mark>`)}</span>`;
      it.querySelector('b').textContent = `${r.g.name} › ${Store.pages[r.pid].title}`;
      it.addEventListener('click', () => this.go(i));
      res.append(it);
    });
  },
  go(i) {
    if (!this.results.length) return;
    this.cur = ((i % this.results.length) + this.results.length) % this.results.length;
    const r = this.results[this.cur];
    if (r.pid !== Canvas.pageId) App.openPage(r.pid);
    $$('.fp-item', this.el).forEach((x, j) => x.style.background = j === this.cur ? 'var(--accent-soft)' : '');
    if (r.boxId) setTimeout(() => { Canvas.scrollToBox(r.boxId); Canvas.select([r.boxId]); }, 40);
  },
  replace(all) {
    const q = this.el.querySelector('.fp-q').value;
    const rep = this.el.querySelector('.fp-r').value;
    if (!q) return;
    Hist.flushPending();
    Canvas.stopEditing();
    let count = 0;
    const scopeAll = this.el.querySelector('.fp-scope').checked;
    const pages = all ? (scopeAll ? Object.values(Store.pages) : [Canvas.page].filter(Boolean)) : [];
    if (!all) {
      const r = this.results[Math.max(0, this.cur)];
      const p = r && Store.pages[r.pid];
      const b = p && r.boxId && p.boxes.find(x => x.id === r.boxId);
      if (b && !b.locked) { const o = replaceInHtml(b.html, q, rep, true); b.html = o.html; count = o.count; Hist.touchPage(p.id); }
    } else {
      for (const p of pages) {
        for (const b of p.boxes) {
          if (b.locked) continue;
          const o = replaceInHtml(b.html, q, rep, false);
          if (o.count) { b.html = o.html; count += o.count; Hist.touchPage(p.id); }
        }
      }
    }
    Hist.commit('Ersetzen');
    Canvas.reload();
    UI.toast(count ? `${count} Stelle(n) ersetzt` : 'Nichts ersetzt');
    this.search();
  },
};

/* ---------------------------------------------------------------- Export */
async function exportPageHtml() {
  const p = Canvas.page;
  if (!p) return;
  Canvas.stopEditing();
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const r of Canvas.rects.values()) { x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y); x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h); }
  if (x1 === Infinity) { x1 = y1 = 0; x2 = y2 = 200; }
  const world = $('#world').cloneNode(true);
  world.removeAttribute('id');
  world.style.transform = `translate(${40 - x1}px, ${20 - y1}px)`;
  world.querySelectorAll('[contenteditable]').forEach(x => x.removeAttribute('contenteditable'));
  world.querySelectorAll('.sock,.box-rs,.fimg-rs,.link-hit,#layer-overlay').forEach(x => x.remove());
  world.querySelectorAll('.sel,.editing').forEach(x => x.classList.remove('sel', 'editing'));
  for (const img of world.querySelectorAll('img')) {
    try { const b = await (await fetch(img.getAttribute('src'))).blob(); img.src = await blobToDataURL(b); } catch (e) { /* */ }
  }
  let css = '';
  const inline = document.getElementById('kt-css');
  if (inline) css = inline.textContent;
  else { try { css = await (await fetch('app.css')).text(); } catch (e) { /* */ } }
  css = css.replace(/url\(icon\.svg\)/g, 'none');
  const W = Math.ceil(x2 - x1 + 80), H = Math.ceil(y2 - y1 + 60);
  const html = `<!doctype html><html lang="de"><head><meta charset="utf-8"><title>${escapeHtml(p.title)}</title><style>${css}
html,body{overflow:auto;height:auto;user-select:text;-webkit-user-select:text}body{background:var(--canvas);padding:0 0 40px}
.kt-title{font:300 28px var(--font-ui);margin:28px 40px 4px;color:var(--ink)}.kt-meta{margin:0 40px 10px;color:var(--ink-3);font-size:12px}
.kt-wrap{position:relative;width:${W}px;height:${H}px}.kt-wrap>div{position:absolute;left:0;top:0}.box-grip{display:none}</style></head>
<body data-theme="${Store.ui.theme === 'dunkel' ? 'dunkel' : 'hell'}"><div class="kt-title">${escapeHtml(p.title)}</div><div class="kt-meta">${escapeHtml(fmtDate(p.created))} · exportiert aus KnowledgeTree</div>
<div class="kt-wrap">${world.outerHTML}</div></body></html>`;
  const a = el('a', { href: URL.createObjectURL(new Blob([html], { type: 'text/html' })), download: (p.title || 'Seite').replace(/[<>:"/\\|?*]+/g, '_') + '.html' });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  UI.toast('Seite als HTML exportiert (Ordner „Downloads“)');
}

function pickImageFiles() {
  return new Promise((res) => {
    const inp = el('input', { type: 'file', accept: 'image/*', multiple: true, style: { display: 'none' } });
    inp.addEventListener('change', () => { res([...inp.files]); inp.remove(); });
    document.body.append(inp);
    inp.click();
  });
}

  theme: { run: (t) => { Store.ui.theme = t || (Store.ui.theme === 'dunkel' ? 'hell' : 'dunkel'); document.body.dataset.theme = Store.ui.theme; Canvas.renderLinks(); Canvas.applyView(); UiState.saveSoon(); }, active: (t) => Store.ui.theme === t },
};

function linkActive(prop, def, v) {
  const ls = Canvas.page ? Canvas.linksOfSelection() : [];
  if (ls.length) return ls.some(l => (l[prop] || def) === v);
  return ((Store.ui.linkDefault || {})[prop] || def) === v;
}

function luma(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return 1;
  const n = parseInt(m[1], 16);
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
}

const Cmd = {
  run(name, arg) {
    const c = COMMANDS[name];
    if (!c) return;
    if (Store.readOnly && !['about', 'shortcuts', 'zoomIn', 'zoomOut', 'zoom100', 'fit', 'find'].includes(name)) return;
    try {
      const r = c.run(arg);
      if (r && r.catch) r.catch(e => { console.error(e); UI.toast('Fehler: ' + e.message); });
    } catch (e) { console.error(e); UI.toast('Fehler: ' + e.message); }

  },
  enabled(name) { const c = COMMANDS[name]; return !c || !c.enabled || c.enabled(); },
  active(name, arg) { const c = COMMANDS[name]; return !!(c && c.active && c.active(arg)); },
};

  /* ---------------------------------------------------------- LaTeX -> MathML */
  toMathML(tex, display) {
    let i = 0;

    let fnFlag = false;
    const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    };
    const group = () => { // {…} oder ein einzelnes Element

      if (peek() === '{') { i++; const r = expr('}'); if (peek() === '}') i++; return `<mrow>${r}</mrow>`; }

    };
    const rawGroup = () => {
      skipWs();

    const optArg = () => {
      skipWs();
      if (peek() !== '[') return null;
      i++;
      const r = expr(']');

      skipWs();

      skipWs();
      const c = peek();
      if (c === undefined) return '';

        const n = readCmd();

        if (n === 'binom') { const a = group(), b = group(); return `<mrow><mo>(</mo><mfrac linethickness="0">${a}${b}</mfrac><mo>)</mo></mrow>`; }

        if (MATH_ACCENTS[n]) { const a = group(); return `<mover accent="true">${a}<mo stretchy="${n === 'overline' || n === 'widehat' || n === 'overrightarrow' ? 'true' : 'false'}">${MATH_ACCENTS[n]}</mo></mover>`; }
        if (n === 'left') { const d = readDelim(); const r = expr('\\right'); let d2 = '.'; if (s.startsWith('\\right', i)) { i += 6; d2 = readDelim(); } return `<mrow>${fence(d)}${r}${fence(d2)}</mrow>`; }

          const env = rawGroup();
          const rows = [[]];
          let cell = '';
          for (;;) {
            if (i >= s.length) break;
            if (s.startsWith('\\end', i)) { i += 4; rawGroup(); break; }
            if (peek() === '&') { i++; rows[rows.length - 1].push(cell); cell = ''; continue; }
            if (s.startsWith('\\\\', i)) { i += 2; rows[rows.length - 1].push(cell); cell = ''; rows.push([]); continue; }
            cell += expr('&');
          }
          rows[rows.length - 1].push(cell);
          if (rows.length > 1 && rows[rows.length - 1].every(x => !x)) rows.pop();
          const tbl = `<mtable${env === 'cases' ? ' columnalign="left left"' : ''}>${rows.map(r => `<mtr>${r.map(x => `<mtd><mrow>${x}</mrow></mtd>`).join('')}</mtr>`).join('')}</mtable>`;
          const f = { pmatrix: ['(', ')'], bmatrix: ['[', ']'], Bmatrix: ['{', '}'], vmatrix: ['|', '|'], Vmatrix: ['‖', '‖'], cases: ['{', ''] }[env];

        if (n === ';' || n === ':') return '<mspace width="0.28em"/>';
        if (n === 'quad') return '<mspace width="1em"/>';
        if (n === 'qquad') return '<mspace width="2em"/>';
        if (n === '!') return '<mspace width="-0.17em"/>';
        if (n === ' ') return '<mspace width="0.25em"/>';
        if (n === '\\') return '';

        if (MATH_SYMBOLS[n]) return `<mi${/^[A-Z]/.test(n) && n.length > 1 ? ' mathvariant="normal"' : ''}>${MATH_SYMBOLS[n]}</mi>`;
        if (MATH_OPS[n]) return `<mo>${MATH_OPS[n]}</mo>`;
        if (MATH_BIG[n]) return `<mo largeop="true" movablelimits="${n.includes('int') ? 'false' : 'true'}"${n.includes('int') ? '' : ''} data-big="${n}">${MATH_BIG[n]}</mo>`;

      }

    };

      for (;;) {
        skipWs();
        if (peek() === '^' && sup === null) { i++; sup = group(); continue; }
        if (peek() === '_' && sub === null) { i++; sub = group(); continue; }
        if (peek() === "'" && sup === null) { i++; primes += '′'; continue; }

      }

        if (sup === null && sub === null) return `<mrow>${base}<mo lspace="0" rspace="0">${primes}</mo></mrow>`;
        if (sup === null) return `<mrow><msub>${base}${sub}</msub><mo lspace="0" rspace="0">${primes}</mo></mrow>`;
        sup = `<mrow><mo lspace="0" rspace="0">${primes}</mo>${sup}</mrow>`;
      }
      if (sub === null && sup === null) return base;
      const big = /data-big="(sum|prod|coprod|bigcup|bigcap)"|data-fn="(lim|max|min|sup|inf)"/.test(base);
      if (big) {
        if (sub !== null && sup !== null) return `<munderover>${base}${sub}${sup}</munderover>`;
        if (sub !== null) return `<munder>${base}${sub}</munder>`;
        return `<mover>${base}${sup}</mover>`;
      }
      if (sub !== null && sup !== null) return `<msubsup>${base}${sub}${sup}</msubsup>`;
      if (sub !== null) return `<msub>${base}${sub}</msub>`;
      return `<msup>${base}${sup}</msup>`;
    };
    function expr(stop) {
      let out = '';
      let guard = 0;
      while (i < s.length && guard++ < 10000) {
        skipWs();
        if (i >= s.length) break;
        if (stop === '}' && peek() === '}') break;
        if (stop === ']' && peek() === ']') break;
        if (stop === '&' && (peek() === '&' || s.startsWith('\\\\', i) || s.startsWith('\\end', i))) break;
        if (stop === '\\right' && s.startsWith('\\right', i)) break;
        if (peek() === '}' && stop !== '}') { i++; continue; }

        fnFlag = false;
        let a = atom();
        const isFn = fnFlag;
        if (i === start) { i++; continue; }

        out += a;
        if (isFn) { skipWs(); if (i < s.length && !'(^_'.includes(peek())) out += '<mspace width="0.17em"/>'; }
      }
      return out;
    }
    let body = '';
    try { body = expr(null); } catch (e) { body = `<mtext>${esc(s)}</mtext>`; }
    return `<math${display ? ' display="block"' : ' displaystyle="true"'}><mrow>${body}</mrow></math>`;
  },
  spanHtml(tex, display) {
    const t = String(tex || '').trim();
    return `<span class="kt-math${display ? ' block' : ''}" contenteditable="false" data-tex="${escapeHtml(t)}"${display ? ' data-display="1"' : ''}>${this.toMathML(t, display)}</span>`;
  },

  /* ---------------------------------------------------------- Vorlagen und Bausteine */
  TEMPLATES: [
    ['Satz des Pythagoras', 'a^2+b^2=c^2'],
    ['Quadratische Formel', 'x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}'],
    ['Kreisfläche', 'A=\\pi r^2'],
    ['Binomischer Lehrsatz', '(x+a)^n=\\sum_{k=0}^{n}\\binom{n}{k}x^k a^{n-k}'],
    ['Ableitung', "f'(x)=\\lim_{h\\to 0}\\frac{f(x+h)-f(x)}{h}"],
    ['Integral', '\\int_{a}^{b} f(x)\\,dx=F(b)-F(a)'],
    ['Taylorreihe', 'e^x=\\sum_{n=0}^{\\infty}\\frac{x^n}{n!}'],
    ['Mitternachtsformel (Diskriminante)', 'D=b^2-4ac'],
    ['Ideales Gasgesetz', 'pV=nRT'],
    ['Energie', 'E=mc^2'],
    ['Matrix 2×2', 'A=\\begin{pmatrix}a & b\\\\ c & d\\end{pmatrix}'],
    ['Fallunterscheidung', '|x|=\\begin{cases}x & x\\geq 0\\\\ -x & x<0\\end{cases}'],
  ],
  STRUCTS: [
    ['Bruch', '\\frac{□}{□}', 'frac'], ['Hochgestellt', '□^{□}', 'sup'], ['Tiefgestellt', '□_{□}', 'sub'], ['Hoch und tief', '□_{□}^{□}', 'subsup'],
    ['Wurzel', '\\sqrt{□}', 'sqrt'], ['n-te Wurzel', '\\sqrt[□]{□}', 'root'], ['Summe', '\\sum_{□}^{□} □', 'sum'], ['Produkt', '\\prod_{□}^{□} □', 'prod'],
    ['Integral', '\\int_{□}^{□} □\\,d□', 'int'], ['Grenzwert', '\\lim_{□\\to □} □', 'lim'], ['Klammern ( )', '\\left( □ \\right)', 'paren'],
    ['Eckige Klammern [ ]', '\\left[ □ \\right]', 'brack'], ['Betrag | |', '\\left| □ \\right|', 'abs'], ['Matrix 2×2', '\\begin{pmatrix}□ & □\\\\ □ & □\\end{pmatrix}', 'matrix'],
    ['Vektor', '\\vec{□}', 'vec'], ['Querstrich', '\\overline{□}', 'bar'], ['Dach', '\\hat{□}', 'hat'], ['Text', '\\text{□}', 'text'],
    ['Fallunterscheidung', '\\begin{cases}□ & □\\\\ □ & □\\end{cases}', 'cases'], ['Binomialkoeffizient', '\\binom{□}{□}', 'binom'],

    ['Operatoren', ['pm', 'mp', 'times', 'div', 'cdot', 'circ', 'leq', 'geq', 'neq', 'approx', 'equiv', 'sim', 'propto', 'll', 'gg']],
    ['Mengen & Logik', ['in', 'notin', 'subset', 'subseteq', 'cup', 'cap', 'setminus', 'emptyset', 'forall', 'exists', 'neg', 'land', 'lor', 'N', 'Z', 'Q', 'R', 'C']],
    ['Pfeile', ['to', 'leftarrow', 'leftrightarrow', 'Rightarrow', 'Leftarrow', 'Leftrightarrow', 'mapsto', 'uparrow', 'downarrow']],
    ['Weitere', ['infty', 'partial', 'nabla', 'hbar', 'ell', 'degree', 'prime', 'perp', 'parallel', 'angle', 'ldots', 'cdots', 'therefore', 'because']],
  ],

  /* ---------------------------------------------------------- Editor */
  open(existing, preset) {
    if (!existing && !Canvas.page) { UI.toast('Bitte zuerst eine Seite öffnen'); return Promise.resolve(); }
    if (!existing && Canvas.editing) Formula.grabRange();
    const startTex = existing ? existing.dataset.tex || '' : (preset || '');
    const startDisplay = existing ? existing.dataset.display === '1' : false;
    const range = Canvas.editing && Canvas.lastRange ? Canvas.lastRange.cloneRange() : null;
    const editBox = Canvas.editing;
    return UI.dialog((d, close) => {
      d.classList.add('fx-dlg');
      d.append(el('h2', { text: existing ? 'Formel bearbeiten' : 'Formel einfügen' }));
      const ta = el('textarea', { class: 'fx-in', spellcheck: 'false', placeholder: 'z.B. x^2 + y^2 = r^2   oder Bausteine unten anklicken' });
      ta.value = startTex;
      const prev = el('div', { class: 'fx-prev' });
      const disp = el('input', { type: 'checkbox' });
      disp.checked = startDisplay;
      const upd = () => { prev.innerHTML = ta.value.trim() ? this.toMathML(ta.value, true) : '<span class="fx-empty">Vorschau</span>'; };
      ta.addEventListener('input', upd);
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Tab' && ta.value.includes('□')) { e.preventDefault(); this.nextSlot(ta, e.shiftKey); }
      });

        if (e.key === 'Escape') return;

        const a = ta.selectionStart, b = ta.selectionEnd;
        const sel = ta.value.slice(a, b);

        const slot = ta.value.indexOf('□', pos);
        ta.focus();
        if (slot >= 0 && slot < pos + snip.length) ta.setSelectionRange(slot, slot + 1);

          b.innerHTML = this.toMathML(tex, false) + `<span>${escapeHtml(label)}</span>`;
          b.addEventListener('click', () => { ta.value = tex; ta.focus(); upd(); });
          pane.append(b);

      };
      tabs.forEach(([name], k) => tabsEl.append(el('button', { class: 'fx-tab', text: name, onclick: () => show(k) })));
      d.append(tabsEl, pane, ta, prev,
        el('div', { class: 'fx-foot' },
          el('label', { class: 'fx-chk' }, disp, 'Eigene Zeile (zentriert)'),
          el('span', { class: 'fx-hint', text: 'Tab = nächstes Feld □ · Strg+Enter = einfügen · ^ hoch, _ tief, \\frac{a}{b}, \\sqrt{x}' })));
      const done = () => {
