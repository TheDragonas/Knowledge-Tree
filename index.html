<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="KnowledgeTree – einfaches Brainstorming mit Gruppen, Seiten, Textfeldern und Verbindungen. Speichert alles im Browser.">
<title>KnowledgeTree</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%238b70f0%22/%3E%3Cstop offset=%221%22 stop-color=%22%235a3cb8%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x=%222%22 y=%222%22 width=%2260%22 height=%2260%22 rx=%2214%22 fill=%22url%28%23g%29%22/%3E%3Cpath d=%22M23 32C33 32 31 18 41 18M23 32C33 32 31 46 41 46%22 stroke=%22%23fff%22 stroke-width=%223.4%22 fill=%22none%22 stroke-linecap=%22round%22 opacity=%22.92%22/%3E%3Crect x=%229%22 y=%2224.5%22 width=%2215%22 height=%2215%22 rx=%224.5%22 fill=%22%23fff%22/%3E%3Crect x=%2240%22 y=%2210.5%22 width=%2215%22 height=%2215%22 rx=%224.5%22 fill=%22%23ffd66b%22/%3E%3Crect x=%2240%22 y=%2238.5%22 width=%2215%22 height=%2215%22 rx=%224.5%22 fill=%22%237fe0c3%22/%3E%3Ccircle cx=%2224%22 cy=%2232%22 r=%222.6%22 fill=%22%235a3cb8%22/%3E%3Ccircle cx=%2240%22 cy=%2218%22 r=%222.6%22 fill=%22%235a3cb8%22/%3E%3Ccircle cx=%2240%22 cy=%2246%22 r=%222.6%22 fill=%22%235a3cb8%22/%3E%3C/svg%3E" type="image/svg+xml">
<style id="kt-css">
/* ============================================================ KnowledgeTree */
:root {
  --accent: #6b4fbb;
  --accent-2: #8a72d6;
  --accent-soft: #efeafb;
  --accent-ink: #4b3396;
  --bg: #f3f2f1;
  --chrome: #f7f6f5;
  --chrome-2: #ffffff;
  --line: #e1dfdd;
  --line-2: #c8c6c4;
  --ink: #252423;
  --ink-2: #605e5c;
  --ink-3: #8a8886;
  --hover: #edebe9;
  --press: #e1dfdd;
  --nav-bg: #faf9f8;
  --canvas: #ffffff;
  --dot: #d6d3cf;
  --gridline: #eeecea;
  --box-bg: #ffffff;
  --box-border: #dcd9d6;
  --box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  --link: #8e8aa0;
  --danger: #c4314b;
  --ok: #3b8a3b;
  --menu-bg: #ffffff;
  --shadow-lg: 0 8px 28px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.12);
  --font-ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-note: Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
body[data-theme="dunkel"] {
  --accent: #9d86ee;
  --accent-2: #b3a1f2;
  --accent-soft: #332b4d;
  --accent-ink: #cbbdfa;
  --bg: #1f1f1f;
  --chrome: #262626;
  --chrome-2: #2d2d2d;
  --line: #3b3b3b;
  --line-2: #505050;
  --ink: #f0f0f0;
  --ink-2: #c3c3c3;
  --ink-3: #8f8f8f;
  --hover: #363636;
  --press: #414141;
  --nav-bg: #232323;
  --canvas: #1b1b1b;
  --dot: #3c3c3c;
  --gridline: #292929;
  --box-bg: #2a2a2a;
  --box-border: #444;
  --box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
  --link: #8f89a8;
  --menu-bg: #2b2b2b;
  --shadow-lg: 0 10px 30px rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font: 12px/1.35 var(--font-ui); color: var(--ink); background: var(--bg); user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; }
input, select { font: inherit; color: var(--ink); }
[hidden] { display: none !important; }
.ic { display: block; flex: none; }

#app { display: flex; flex-direction: column; height: 100vh; }
#titlebar, #ribbon, #warnbar, #statusbar { flex: none; }

/* ------------------------------------------------------------ Titelleiste */
#titlebar { height: 34px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--chrome); padding: 0 8px; }
.tb-left, .tb-right { display: flex; align-items: center; gap: 2px; }
.tb-right { justify-content: flex-end; }
.tb-title { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
.app-logo { width: 20px; height: 20px; margin-right: 8px; background: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%238b70f0%22/%3E%3Cstop offset=%221%22 stop-color=%22%235a3cb8%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x=%222%22 y=%222%22 width=%2260%22 height=%2260%22 rx=%2214%22 fill=%22url%28%23g%29%22/%3E%3Cpath d=%22M23 32C33 32 31 18 41 18M23 32C33 32 31 46 41 46%22 stroke=%22%23fff%22 stroke-width=%223.4%22 fill=%22none%22 stroke-linecap=%22round%22 opacity=%22.92%22/%3E%3Crect x=%229%22 y=%2224.5%22 width=%2215%22 height=%2215%22 rx=%224.5%22 fill=%22%23fff%22/%3E%3Crect x=%2240%22 y=%2210.5%22 width=%2215%22 height=%2215%22 rx=%224.5%22 fill=%22%23ffd66b%22/%3E%3Crect x=%2240%22 y=%2238.5%22 width=%2215%22 height=%2215%22 rx=%224.5%22 fill=%22%237fe0c3%22/%3E%3Ccircle cx=%2224%22 cy=%2232%22 r=%222.6%22 fill=%22%235a3cb8%22/%3E%3Ccircle cx=%2240%22 cy=%2218%22 r=%222.6%22 fill=%22%235a3cb8%22/%3E%3Ccircle cx=%2240%22 cy=%2246%22 r=%222.6%22 fill=%22%235a3cb8%22/%3E%3C/svg%3E') center/contain no-repeat; }
.qat { height: 26px; min-width: 28px; border: 0; background: transparent; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; cursor: default; padding: 0 4px; color: var(--ink); }
.qat:hover:not(:disabled) { background: var(--hover); }
.qat:active:not(:disabled) { background: var(--press); }
.qat:disabled { opacity: .35; }
.qat.drop { min-width: 14px; width: 14px; padding: 0; margin-left: -3px; }
.qat-split { display: inline-flex; }
.qat.saving .ic { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.tb-search { display: flex; align-items: center; gap: 6px; height: 26px; width: 240px; max-width: 30vw; padding: 0 8px; border-radius: 6px; background: var(--chrome-2); border: 1px solid var(--line); color: var(--ink-3); }
.tb-search:focus-within { border-color: var(--accent); }
.tb-search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; width: auto; font-size: 12px; }

/* ------------------------------------------------------------ Ribbon */
#ribbon { background: var(--chrome); border-bottom: 1px solid var(--line); }
#tabs { display: flex; align-items: flex-end; height: 30px; padding: 0 6px; gap: 2px; }
.tab { border: 0; background: transparent; height: 30px; padding: 0 12px; font-size: 13px; color: var(--ink-2); position: relative; border-radius: 4px 4px 0 0; cursor: default; }
.tab:hover { color: var(--ink); background: var(--hover); }
.tab.on { color: var(--accent-ink); font-weight: 600; }
.tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 2px; background: var(--accent); }
.tab.file { color: var(--accent-ink); }
.tabs-right { margin-left: auto; display: flex; align-items: center; height: 30px; color: var(--ink-3); font-size: 11px; padding-right: 6px; }
#panel { height: 100px; display: flex; align-items: stretch; padding: 4px 6px 0; margin: 0 6px 6px; background: var(--chrome-2); border-radius: 8px; box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0,0,0,.05); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.rgroup { display: flex; flex-direction: column; flex: none; padding: 0 4px; }
.rg-body { flex: 1; display: flex; align-items: flex-start; gap: 2px; }
.rg-label { height: 18px; text-align: center; font-size: 11px; color: var(--ink-3); white-space: nowrap; padding-top: 1px; }
.rsep { width: 1px; background: var(--line); margin: 6px 3px 8px; flex: none; }
.rcol { display: flex; flex-direction: column; gap: 1px; }
.rrow { display: flex; align-items: center; gap: 1px; height: 24px; }
.rrow + .rrow { margin-top: 2px; }
.rb { border: 1px solid transparent; background: transparent; border-radius: 4px; cursor: default; color: var(--ink); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.rb:hover:not(:disabled) { background: var(--hover); border-color: var(--line); }
.rb:active:not(:disabled) { background: var(--press); }
.rb.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent-ink); }
.rb:disabled { opacity: .38; }
.rb.big { flex-direction: column; justify-content: flex-start; gap: 3px; min-width: 50px; max-width: 76px; height: 70px; padding: 5px 4px 2px; white-space: normal; text-align: center; line-height: 1.15; font-size: 11.5px; }
.rb.big .ic { width: 28px; height: 28px; }
.rb.big .caret { opacity: .6; margin-top: -2px; }
.rb.small { height: 24px; padding: 0 6px 0 4px; font-size: 12px; }
.rb.ico { width: 26px; height: 24px; justify-content: center; padding: 0; }
.rb .glyph { font: 600 14px/1 "Segoe UI", Georgia, serif; min-width: 14px; text-align: center; }
.rb .glyph.i { font-style: italic; font-family: Georgia, "Times New Roman", serif; font-weight: 500; }
.rb .glyph.u { text-decoration: underline; }
.rb .glyph.s { text-decoration: line-through; font-weight: 500; }
.rb .glyph.sm { font-size: 12px; font-weight: 500; }
.split { display: inline-flex; border-radius: 4px; }
.split:hover { box-shadow: inset 0 0 0 1px var(--line); }
.split .rb.ico { width: 24px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.split .rb.drop { width: 13px; height: 24px; padding: 0; justify-content: center; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.rb.drop .ic { width: 10px; height: 10px; }
.colorbar { position: relative; display: inline-flex; flex-direction: column; align-items: center; }
.colorbar i { display: block; width: 16px; height: 4px; margin-top: 1px; border-radius: 1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.combo { display: inline-flex; align-items: center; height: 24px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--chrome-2); }
.combo:focus-within { border-color: var(--accent); }
.combo input { border: 0; outline: 0; background: transparent; height: 22px; padding: 0 5px; font-size: 12px; min-width: 0; }
.combo .rb.drop { height: 22px; width: 16px; border: 0; border-left: 1px solid var(--line); border-radius: 0 3px 3px 0; justify-content: center; }
.gallery { display: grid; grid-template-columns: repeat(var(--cols, 4), auto); gap: 3px; padding: 2px; }
.gal-item { border: 1px solid var(--line); border-radius: 4px; background: var(--chrome-2); cursor: default; padding: 0 6px; height: 23px; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
.gal-item:hover { border-color: var(--accent); background: var(--accent-soft); }
.gal-item.swatch { width: 34px; height: 23px; padding: 0; justify-content: center; font-weight: 600; font-size: 11px; }
.gal-item.st-h1 { font-weight: 700; font-size: 12.5px; }
.gal-item.st-h2 { font-weight: 700; }
.gal-item.st-h3 { font-weight: 600; color: var(--ink-2); }
.gal-item.st-q { font-style: italic; }
.gal-item.st-code { font-family: Consolas, monospace; }
.hintcard { max-width: 240px; line-height: 1.35 !important; font-size: 10.5px !important; padding: 3px 8px !important; align-self: center; font-size: 11px; line-height: 1.45; color: var(--ink-2); padding: 4px 8px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 4px; white-space: normal; }
.hintcard b { color: var(--ink); }

/* ------------------------------------------------------------ Warnung */
#warnbar { background: #fde7e9; color: #8a1c2b; border-bottom: 1px solid #f1bbc2; padding: 6px 14px; font-weight: 600; }

/* ------------------------------------------------------------ Navigation */
#main { flex: 1; display: flex; min-height: 0; background: var(--bg); }
.navcol { display: flex; flex-direction: column; background: var(--nav-bg); min-width: 120px; flex: none; }
#nav-groups { width: 220px; }
#nav-pages { width: 210px; border-left: 1px solid var(--line); }
body.no-side .navcol, body.no-side .splitter { display: none; }
.nav-head { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 8px 0 14px; font-size: 13px; font-weight: 600; color: var(--ink-2); flex: none; }
.nav-add { width: 26px; height: 26px; border: 0; border-radius: 4px; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); }
.nav-add:hover { background: var(--hover); color: var(--accent-ink); }
.navlist { flex: 1; overflow: auto; padding: 2px 6px 16px; scrollbar-width: thin; }
.splitter { width: 5px; margin: 0 -2px; cursor: col-resize; position: relative; z-index: 5; flex: none; }
.splitter:hover, .splitter.drag { background: color-mix(in srgb, var(--accent) 35%, transparent); }

.g-row { display: flex; align-items: center; gap: 6px; height: 30px; border-radius: 5px; padding-right: 6px; cursor: default; position: relative; color: var(--ink); }
.g-row:hover { background: var(--hover); }
.g-row.sel { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.g-row.sel::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; border-radius: 2px; background: var(--accent); }
.g-caret { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-3); flex: none; border-radius: 3px; transition: transform .12s; }
.g-caret:hover { background: var(--press); }
.g-caret.open { transform: rotate(90deg); }
.g-caret.none { visibility: hidden; }
.g-tab { width: 10px; height: 18px; border-radius: 3px; flex: none; }
.g-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.g-count { font-size: 11px; color: var(--ink-3); font-weight: 400; }
.p-row { padding: 6px 10px; border-radius: 5px; cursor: default; margin-bottom: 1px; position: relative; }
.p-row:hover { background: var(--hover); }
.p-row.sel { background: var(--chrome-2); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.06); }
.p-row.sel::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); }
.p-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-row.sel .p-title { font-weight: 600; }
.p-date { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.nav-empty { color: var(--ink-3); padding: 14px 10px; font-size: 12px; line-height: 1.5; }
.nav-empty button { margin-top: 8px; }
.inline-edit { width: 100%; font: inherit; font-size: 13px; padding: 2px 4px; border: 1px solid var(--accent); border-radius: 3px; outline: 0; background: var(--chrome-2); }
.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.drop-into { background: var(--accent-soft) !important; box-shadow: inset 0 0 0 1.5px var(--accent); }

/* ------------------------------------------------------------ Zeichenfläche */
#stage { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--canvas); border-left: 1px solid var(--line); }
#page-head { flex: none; display: flex; align-items: flex-end; gap: 16px; padding: 12px 24px 8px; border-bottom: 1px solid var(--line); background: var(--canvas); }
#page-title { flex: 1; min-width: 60px; border: 0; outline: 0; background: transparent; font: 300 26px/1.2 var(--font-ui); color: var(--ink); padding: 2px 0; border-bottom: 2px solid transparent; user-select: text; }
#page-title:focus { border-bottom-color: var(--accent); }
#page-title:disabled { opacity: 0; }
#page-meta { color: var(--ink-3); font-size: 12px; white-space: nowrap; padding-bottom: 6px; }
#viewport { flex: 1; position: relative; overflow: hidden; outline: none; background-color: var(--canvas); cursor: text; touch-action: none; }
#viewport.panning, #viewport.space { cursor: grab; }
#viewport.panning:active { cursor: grabbing; }
#viewport.connecting { cursor: crosshair; }
#viewport.knife { cursor: crosshair; }
body.painter #viewport .box-text { cursor: copy; }
#world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
#layer-pkgs, #layer-boxes { position: absolute; left: 0; top: 0; }
#layer-pkgs { z-index: 0; }
#layer-boxes { z-index: 2; }
#layer-links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 1; }
#layer-handles { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 3; display: none; }
.link-handle { pointer-events: all; cursor: grab; fill: var(--canvas); stroke: var(--accent); }
.link-handle.mid { fill: var(--accent); stroke: var(--canvas); }
.link-handle.end.fixed { fill: var(--accent-soft); }
.link-handle:hover { filter: drop-shadow(0 0 3px var(--accent)); }
#layer-overlay { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; z-index: 100000; }
#marquee { position: absolute; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); pointer-events: none; z-index: 10; }
#empty-state { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: var(--ink-3); font-size: 14px; pointer-events: none; }
#empty-state .btn { pointer-events: auto; }

/* Textfelder */
.box { position: absolute; background: var(--box-bg); border: 1px solid var(--box-border); border-radius: 7px; box-shadow: var(--box-shadow); min-width: 60px; }
.box.plain { background: transparent; border-color: transparent; box-shadow: none; }
.box.plain:hover { border-color: var(--line-2); border-style: dashed; }
.box-bar { height: 12px; cursor: move; border-radius: 6px 6px 0 0; display: flex; align-items: center; justify-content: center; position: relative; }
.box-grip { width: 34px; height: 4px; border-radius: 2px; background: currentColor; opacity: 0; color: var(--ink-3); transition: opacity .12s; }
.box:hover .box-grip, .box.sel .box-grip { opacity: .45; }
.box-lock { position: absolute; right: 5px; top: 1px; color: var(--ink-3); display: none; }
.box.locked .box-lock { display: block; }
.box.locked .box-bar { cursor: default; }
.box-body { position: relative; padding: 0 10px 8px; }
.box-body::after { content: ""; display: block; clear: both; }
.box-text { outline: none; min-height: 1.45em; font: 11pt/1.45 var(--font-note); color: var(--ink); cursor: text; user-select: text; -webkit-user-select: text; overflow-wrap: anywhere; }
.box.locked .box-text { cursor: default; }
.box.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--box-shadow); }
.box.editing { border-color: color-mix(in srgb, var(--accent) 70%, var(--box-border)); }
.box.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 60%, transparent); } }
.box.conn-target, .pkg.conn-target { box-shadow: 0 0 0 3px var(--accent), var(--box-shadow); }
.box-rs { position: absolute; right: -4px; top: 10px; bottom: 6px; width: 8px; cursor: ew-resize; }
.box.locked .box-rs { display: none; }
.sock { position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--accent); border: 2px solid var(--canvas); opacity: 0; cursor: crosshair; transition: opacity .12s, transform .12s; z-index: 2; }
.sock.l { left: -7px; }
.sock.r { right: -7px; }
.box:hover > .sock, .pkg:hover > .sock, .box.sel > .sock, .pkg.sel > .sock { opacity: .9; }
.sock:hover { transform: scale(1.35); opacity: 1; }
body.connecting-now .sock { opacity: .7; }

/* Inhalt der Textfelder */
.box-text p, .box-text div { margin: 0; }
.box-text h1 { font-size: 20pt; line-height: 1.2; margin: 2px 0 4px; font-weight: 600; }
.box-text h2 { font-size: 15pt; line-height: 1.25; margin: 2px 0 3px; font-weight: 600; }
.box-text h3 { font-size: 12.5pt; line-height: 1.3; margin: 2px 0 2px; font-weight: 600; opacity: .78; }
.box-text ul, .box-text ol { margin: 2px 0; padding-left: 22px; }
.box-text blockquote { margin: 4px 0; padding: 2px 10px; border-left: 3px solid var(--accent-2); opacity: .85; font-style: italic; }
.box-text pre { margin: 4px 0; padding: 6px 8px; background: color-mix(in srgb, currentColor 8%, transparent); border-radius: 4px; font: 10pt/1.4 Consolas, "Cascadia Mono", monospace; white-space: pre-wrap; }
.box-text a { color: #2f6fd0; text-decoration: underline; cursor: pointer; }
body[data-theme="dunkel"] .box-text a { color: #7fb0ff; }
.box-text hr { border: 0; border-top: 1px solid var(--line-2); margin: 8px 0; }
.box-text table { border-collapse: collapse; margin: 4px 0; }
.box-text td, .box-text th { border: 1px solid var(--line-2); padding: 3px 7px; min-width: 44px; vertical-align: top; }

<script>
/* ---- js/util.js ---- */
'use strict';
/* Hilfsfunktionen */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

function uid(prefix = '') {
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'style' && typeof v === 'object') { for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith('--')) e.style.setProperty(sk, sv); else e.style[sk] = sv; } }
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'dataset') Object.assign(e.dataset, v);
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

function debounce(fn, ms) {
  let t = null, pending = null;
  const d = (...args) => {
    pending = args;
    clearTimeout(t);
    t = setTimeout(() => { const a = pending; pending = null; t = null; fn(...a); }, ms);
  };
  d.flush = () => { if (pending) { clearTimeout(t); const a = pending; pending = null; t = null; fn(...a); } };
  d.cancel = () => { clearTimeout(t); pending = null; t = null; };
  d.pending = () => !!pending;
  return d;
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const _tpl = document.createElement('template');
function htmlToText(html) {
  _tpl.innerHTML = html || '';
  const c = _tpl.content;
  c.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
  c.querySelectorAll('div,p,li,h1,h2,h3,blockquote,pre,tr').forEach(b => b.append('\n'));
  return c.textContent.replace(/\u200B/g, '').replace(/\n{3,}/g, '\n\n').trim();
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) +
    '  ' + d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
}
function fmtShortDate(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

/* HTML aus der Zwischenablage bereinigen (nur harmlose Formatierung behalten) */
const SAFE_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'DEL', 'SUB', 'SUP', 'SPAN', 'FONT', 'P', 'DIV', 'BR',
  'UL', 'OL', 'LI', 'A', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'PRE', 'CODE', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH', 'HR', 'MARK']);
const DROP_TAGS = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'META', 'LINK', 'TITLE', 'HEAD', 'SVG', 'MATH',
  'NOSCRIPT', 'TEMPLATE', 'FORM', 'INPUT', 'BUTTON', 'SELECT', 'TEXTAREA', 'VIDEO', 'AUDIO', 'CANVAS', 'IMG', 'PICTURE', 'SOURCE', 'XML']);
const SAFE_STYLES = ['color', 'background-color', 'font-weight', 'font-style', 'text-decoration', 'text-decoration-line',
  'font-size', 'font-family', 'text-align', 'line-height', 'list-style-type', 'vertical-align'];

function sanitizeHtml(html) {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  const walk = (node) => {
    for (const child of Array.from(node.childNodes)) {
      if (child.nodeType === 8) { child.remove(); continue; }
      if (child.nodeType !== 1) continue;
      const tag = child.tagName.toUpperCase();
      if (DROP_TAGS.has(tag)) { child.remove(); continue; }
      walk(child);
      if (!SAFE_TAGS.has(tag)) {
        child.replaceWith(...child.childNodes);
        continue;
      }
      const keep = {};
      if (tag === 'A') {
        const href = (child.getAttribute('href') || '').trim();
        if (/^(https?:|mailto:)/i.test(href)) keep.href = href;
      }
      if (tag === 'TD' || tag === 'TH') {
        for (const a of ['colspan', 'rowspan']) if (child.getAttribute(a)) keep[a] = child.getAttribute(a);
      }
      if (tag === 'FONT') {
        if (child.getAttribute('color')) keep.color = child.getAttribute('color');
        if (child.getAttribute('face')) keep.face = child.getAttribute('face');
      }
      if (tag === 'UL' && child.classList.contains('checklist')) keep.class = 'checklist';
      if (tag === 'LI' && child.classList.contains('done')) keep.class = 'done';
      let style = '';
      if (child.style) {
        for (const p of SAFE_STYLES) {
          const v = child.style.getPropertyValue(p);
          if (v && !/expression|url\(/i.test(v)) style += `${p}:${v};`;
        }
      }
      for (const a of Array.from(child.attributes)) child.removeAttribute(a.name);
      for (const [k, v] of Object.entries(keep)) child.setAttribute(k, v);
      if (style) child.setAttribute('style', style);
    }
  };
  walk(doc.body);
  return doc.body.innerHTML;
}

function isEmptyHtml(html) {
  if (!html) return true;
  if (/<(hr|table|li)\b/i.test(html)) return false;
  return htmlToText(html).replace(/\s+/g, '') === '';
}

function loadImageSize(src) {
  return new Promise((res) => {
    const i = new Image();
    i.onload = () => res({ w: i.naturalWidth || 200, h: i.naturalHeight || 150 });
    i.onerror = () => res({ w: 200, h: 150 });
    i.src = src;
  });
}

function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

function nextFrame() { return new Promise(r => requestAnimationFrame(() => r())); }

</script>

<script>
/* ---- js/backend-browser.js ---- */
'use strict';
/* Speicher-Anbindung für die Webseiten-Version: alles bleibt in diesem Browser (IndexedDB).
 *
 *   Datenbank "KnowledgeTree"
 *     saves_struktur   Gruppen und Untergruppen (Reihenfolge, Namen, Farben)
 *     saves_seiten     alle Seiten mit Textfeldern, Paketen, Verbindungen
 *     saves_bilder     eingefügte Bilder
 *     cache            Rückgängig-Verlauf (100 Schritte) und Ansicht (Zoom, letzte Seite …)
 *     papierkorb       gelöschte Seiten
 */

const Backend = (() => {
  const DB_NAME = 'KnowledgeTree';
  const STORES = ['saves_struktur', 'saves_seiten', 'saves_bilder', 'cache', 'papierkorb'];
  let db = null;
  let lastGroups = [];
  const urls = new Map();
  const loading = new Map();
  const myId = uid('tab');
  let channel = null;

  const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const done = (t) => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Speichern abgebrochen')); });

  function open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) { rej(new Error('Dieser Browser kann keine Daten speichern (IndexedDB fehlt).')); return; }
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, s === 'papierkorb' ? { keyPath: 'id' } : undefined);
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error || new Error('Speicher konnte nicht geöffnet werden (privates Fenster?)'));
      r.onblocked = () => rej(new Error('Speicher ist blockiert – bitte andere Tabs mit KnowledgeTree schliessen.'));
    });
  }

  function pageIds(groups, out = new Set()) {
    for (const g of groups || []) { for (const p of g.pages || []) out.add(p); pageIds(g.groups, out); }
    return out;
  }
  function pathOf(pid, groups, trail = []) {
    for (const g of groups || []) {
      if ((g.pages || []).includes(pid)) return [...trail, { id: g.id, name: g.name }];
      const r = pathOf(pid, g.groups, [...trail, { id: g.id, name: g.name }]);
      if (r) return r;
    }
    return null;
  }
  const EXT = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/jpg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp', 'image/svg+xml': 'svg', 'image/bmp': 'bmp' };
  const MIME = { png: 'image/png', jpg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp' };

  async function hashName(buf, type) {
    let hex;
    try {
      const h = await crypto.subtle.digest('SHA-1', buf);
      hex = [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      hex = Array.from({ length: 40 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
    }
    return hex + '.' + (EXT[(type || '').toLowerCase()] || 'png');
  }

  async function putImage(name, blob) {
    const t = db.transaction(['saves_bilder'], 'readwrite');
    const st = t.objectStore('saves_bilder');
    const exists = await req(st.getKey(name));
    if (exists === undefined) st.put({ blob, t: Date.now() }, name);
    await done(t);
  }

  async function collectGarbage() {
    try {
      const t = db.transaction(['saves_seiten', 'cache', 'papierkorb', 'saves_bilder'], 'readonly');
      const [pages, verlauf, trash, keys] = await Promise.all([
        req(t.objectStore('saves_seiten').getAll()), req(t.objectStore('cache').get('verlauf')),
        req(t.objectStore('papierkorb').getAll()), req(t.objectStore('saves_bilder').getAllKeys()),
      ]);
      const old = trash.filter(x => Date.now() - (x.deletedAt || 0) > 60 * 24 * 3600 * 1000);
      if (old.length) {
        const t3 = db.transaction(['papierkorb'], 'readwrite');
        for (const x of old) t3.objectStore('papierkorb').delete(x.id);
        await done(t3);
      }
      const text = JSON.stringify([pages, verlauf, trash.filter(x => !old.includes(x))]);
      const unused = keys.filter(k => !text.includes(k));
      if (!unused.length) return;
      const t2 = db.transaction(['saves_bilder'], 'readwrite');
      const st = t2.objectStore('saves_bilder');
      for (const k of unused) {
        const v = await req(st.get(k));
        if (v && Date.now() - (v.t || 0) > 10 * 60 * 1000) st.delete(k);
      }
      await done(t2);
    } catch (e) { /* nicht wichtig */ }
  }

  function download(name, blob) {
    const a = el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  }

  return {
    kind: 'browser',
    session: myId,

    async load() {
      db = await open();
      const t = db.transaction(['saves_struktur', 'saves_seiten', 'cache'], 'readonly');
      const [groups, keys, vals, zustand, verlauf] = await Promise.all([
        req(t.objectStore('saves_struktur').get('gruppen')),
        req(t.objectStore('saves_seiten').getAllKeys()),
        req(t.objectStore('saves_seiten').getAll()),
        req(t.objectStore('cache').get('zustand')),
        req(t.objectStore('cache').get('verlauf')),
      ]);
      const pages = {};
      keys.forEach((k, i) => { pages[k] = vals[i]; });
      lastGroups = JSON.parse(JSON.stringify(groups || []));
      // Nur ein Tab darf speichern: ein neuer Tab übernimmt, der alte wird schreibgeschützt
      try {
        channel = new BroadcastChannel('knowledgetree');
        channel.onmessage = (e) => { if (e.data && e.data.t === 'hallo' && e.data.id !== myId) UI.conflict(); };
        channel.postMessage({ t: 'hallo', id: myId });
      } catch (e) { /* ältere Browser */ }
      let persisted = false;
      try { persisted = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; } catch (e) { /* */ }
      setTimeout(collectGarbage, 8000);
      return {
        session: myId, groups: groups || [], pages, zustand: zustand || null, verlauf: verlauf || null,
        info: { version: '1.1', author: 'TheDragonas', persisted },
      };
    },

    async sync({ groups, pages }) {
      const t = db.transaction(['saves_struktur', 'saves_seiten', 'papierkorb'], 'readwrite');
      const ps = t.objectStore('saves_seiten');
      t.objectStore('saves_struktur').put(groups, 'gruppen');
      for (const [id, p] of Object.entries(pages)) ps.put(p, id);
      const keep = pageIds(groups);
      const keys = await req(ps.getAllKeys());
      for (const k of keys) {
        if (keep.has(k)) continue;
        const p = await req(ps.get(k));
        if (p) {
          const path = pathOf(k, lastGroups) || [];
          t.objectStore('papierkorb').put({ id: uid('t'), page: p, path, deletedAt: Date.now() });
        }
        ps.delete(k);
      }
      await done(t);
      lastGroups = JSON.parse(JSON.stringify(groups));
      return { ok: true };
    },
    beacon(payload) { if (db) this.sync(payload).catch(() => { }); },

    async saveVerlauf(v) {
      const t = db.transaction(['cache'], 'readwrite');
      t.objectStore('cache').put(v, 'verlauf');
      await done(t);
    },
    async saveZustand(z) {
      const t = db.transaction(['cache'], 'readwrite');
      t.objectStore('cache').put(JSON.parse(JSON.stringify(z)), 'zustand');
      await done(t);
    },

    async saveImage(blob) {
      if (blob.size > 40 * 1024 * 1024) throw new Error('Bild ist zu gross (max. 40 MB)');
      const buf = await blob.arrayBuffer();
      const type = blob.type || 'image/png';
      const name = await hashName(buf, type);
      const b = new Blob([buf], { type });
      await putImage(name, b);
      if (!urls.has(name)) urls.set(name, URL.createObjectURL(b));
      return name;
    },
    async imgURL(name) {
      if (urls.has(name)) return urls.get(name);
      if (!loading.has(name)) {
        loading.set(name, (async () => {
          const t = db.transaction(['saves_bilder'], 'readonly');
          const v = await req(t.objectStore('saves_bilder').get(name));
          const u = v && v.blob ? URL.createObjectURL(v.blob) : '';
          if (u) urls.set(name, u);
          return u;
        })());
      }
      return loading.get(name);
    },
    setImg(img, name) {
      if (urls.has(name)) { img.src = urls.get(name); return; }
      this.imgURL(name).then(u => { if (u) img.src = u; else img.alt = 'Bild fehlt'; });
    },
    openLink(url) { window.open(url, '_blank', 'noopener,noreferrer'); },
    async ping() { return true; },

    /* ---------------------------------------------- Sicherung */
    async backup() {
      await Save.flushAll();
      const t = db.transaction(['saves_struktur', 'saves_seiten', 'saves_bilder'], 'readonly');
      const [groups, keys, vals, imgKeys, imgVals] = await Promise.all([
        req(t.objectStore('saves_struktur').get('gruppen')),
        req(t.objectStore('saves_seiten').getAllKeys()), req(t.objectStore('saves_seiten').getAll()),
        req(t.objectStore('saves_bilder').getAllKeys()), req(t.objectStore('saves_bilder').getAll()),
      ]);
      const seiten = {};
      keys.forEach((k, i) => { seiten[k] = vals[i]; });
      const used = JSON.stringify(seiten);
      const bilder = {};
      for (let i = 0; i < imgKeys.length; i++) {
        if (!used.includes(imgKeys[i]) || !imgVals[i] || !imgVals[i].blob) continue;
        bilder[imgKeys[i]] = await blobToDataURL(imgVals[i].blob);
      }
      const data = { typ: 'KnowledgeTree-Backup', version: 1, erstellt: new Date().toISOString(), gruppen: groups || [], seiten, bilder };
      const stamp = new Date().toISOString().slice(0, 16).replace('T', '_').replace(':', '-');
      download(`KnowledgeTree-Backup_${stamp}.json`, new Blob([JSON.stringify(data)], { type: 'application/json' }));
      return `Backup heruntergeladen (${Object.keys(seiten).length} Seiten, ${Object.keys(bilder).length} Bilder)`;
    },
    async readBackup(file) {
      const data = JSON.parse(await file.text());
      if (!data || data.typ !== 'KnowledgeTree-Backup' || !data.seiten) throw new Error('Das ist keine KnowledgeTree-Sicherung.');
      for (const [name, url] of Object.entries(data.bilder || {})) {
        const m = /^data:([^;]+);base64,(.*)$/.exec(url);
        if (!m) continue;
        const bin = atob(m[2]);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const type = m[1] || MIME[name.split('.').pop()] || 'image/png';
        await putImage(name, new Blob([arr], { type }));
      }
      return data;
    },

    /* ---------------------------------------------- Papierkorb */
    async trashList() {
      const t = db.transaction(['papierkorb'], 'readonly');
      const all = await req(t.objectStore('papierkorb').getAll());
      return all.sort((a, b) => b.deletedAt - a.deletedAt);
    },
    async trashRemove(ids) {
      const t = db.transaction(['papierkorb'], 'readwrite');
      for (const id of ids) t.objectStore('papierkorb').delete(id);
      await done(t);
    },

    async storageInfo() {
      try {
        const e = await navigator.storage.estimate();
        const p = navigator.storage.persisted ? await navigator.storage.persisted() : false;
        return { usage: e.usage || 0, quota: e.quota || 0, persisted: p };
      } catch (e) { return null; }
    },
    aboutHtml() {
      return `<p><b>Wo sind meine Daten?</b><br>Alles wird <b>nur in diesem Browser</b> auf diesem Gerät gespeichert (IndexedDB: Bereiche „Saves“ und „Cache“). Niemand sonst sieht deine Notizen – auch nicht, wenn die Webseite öffentlich ist.</p>
      <p id="kt-storage" style="color:var(--ink-3)">Speicher wird geprüft …</p>
      <p><b>Wichtig:</b> Wenn du die Browserdaten löschst, sind die Notizen weg. Mach deshalb ab und zu unter <b>Datei → Backup herunterladen</b> eine Sicherung. Mit „Backup laden“ holst du sie zurück – auch auf einem anderen Computer.</p>`;
    },
  };
})();

<script>
/* ---- js/store.js ---- */
'use strict';
/* Datenhaltung, Rückgängig/Wiederholen (100 Schritte) und automatisches Speichern */

const GROUP_COLORS = ['#d13438', '#ca5010', '#e8a302', '#498205', '#038387', '#0078d4', '#5c2d91', '#c239b3', '#7a7574', '#2d7d9a'];
const PKG_COLORS = ['#6b4fbb', '#0078d4', '#038387', '#498205', '#ca5010', '#c239b3', '#d13438', '#7a7574'];

const Store = {
  groups: [],
  pages: {},
  ui: {},
  info: {},
  loaded: false,
  readOnly: false,
};

const UI_DEFAULTS = {
  currentGroup: null, currentPage: null, collapsed: {}, lastPage: {}, views: {},
  groupsW: 220, pagesW: 210, snap: false, theme: 'hell', sidebar: true, tab: 'start',
  boxDefault: {}, linkDefault: { style: 'kurve', arrow: 'ende', w: 2 },
};

/* ---------------------------------------------------------------- Seiten */

function newPage(title) {
  return {
    typ: 'KnowledgeTree-Seite', version: 1, id: uid('p'), title: title || 'Unbenannte Seite',
    created: Date.now(), bg: 'punkte', boxes: [], pkgs: [], links: [],
  };
}

function normPage(p) {
  if (!p || typeof p !== 'object') return null;
  p.typ = 'KnowledgeTree-Seite';
  p.version = 1;
  p.title = typeof p.title === 'string' ? p.title : 'Unbenannte Seite';
  p.created = p.created || Date.now();
  p.bg = p.bg || 'punkte';
  p.boxes = Array.isArray(p.boxes) ? p.boxes.filter(b => b && b.id) : [];
  p.pkgs = Array.isArray(p.pkgs) ? p.pkgs.filter(k => k && k.id) : [];
  p.links = Array.isArray(p.links) ? p.links.filter(l => l && l.id && l.a && l.b) : [];
  for (const b of p.boxes) {
    b.x = +b.x || 0; b.y = +b.y || 0; b.w = Math.max(60, +b.w || 280);
    b.html = typeof b.html === 'string' ? b.html : '';
    b.images = Array.isArray(b.images) ? b.images.filter(i => i && i.src) : [];
    for (const im of b.images) { im.id = im.id || uid('i'); im.x = +im.x || 0; im.y = +im.y || 0; im.w = +im.w || 120; im.h = +im.h || 90; }
    b.z = +b.z || 1;
    b.style = b.style && typeof b.style === 'object' ? b.style : {};
    b.locked = !!b.locked;
    b.pkg = b.pkg || null;
  }
  const pkgIds = new Set(p.pkgs.map(k => k.id));
  for (const b of p.boxes) if (b.pkg && !pkgIds.has(b.pkg)) b.pkg = null;
  const used = new Set(p.boxes.map(b => b.pkg).filter(Boolean));
  p.pkgs = p.pkgs.filter(k => used.has(k.id));
  for (const k of p.pkgs) { k.title = k.title || 'Paket'; k.color = k.color || PKG_COLORS[0]; k.locked = !!k.locked; }
  const ids = new Set([...p.boxes.map(b => b.id), ...p.pkgs.map(k => k.id)]);
  p.links = p.links.filter(l => ids.has(l.a) && ids.has(l.b) && l.a !== l.b);
  return p;
}

/* Leere Textfelder (kein Text, kein Bild, nicht verbunden) werden nie gespeichert */
function isEmptyBox(p, b) {
  if (b.images.length || b.locked) return false;
  if (!isEmptyHtml(b.html)) return false;
  return !p.links.some(l => l.a === b.id || l.b === b.id);
}
function cleanPage(p) {
  return { ...p, boxes: p.boxes.filter(b => !isEmptyBox(p, b)) };
}
function serPage(p) { return JSON.stringify(cleanPage(p)); }

/* ---------------------------------------------------------------- Gruppenbaum */

const Tree = {
  find(id, list = Store.groups, parent = null) {
    for (const g of list) {
      if (g.id === id) return { g, list, parent };
      const r = this.find(id, g.groups, g);
      if (r) return r;
    }
    return null;
  },
  group(id) { const r = id && this.find(id); return r ? r.g : null; },
  groupOfPage(pid, list = Store.groups) {
    for (const g of list) {
      if (g.pages.includes(pid)) return g;
      const r = this.groupOfPage(pid, g.groups);
      if (r) return r;
    }
    return null;
  },
  all(list = Store.groups, out = [], depth = 0) {
    for (const g of list) { out.push({ g, depth }); this.all(g.groups, out, depth + 1); }
    return out;
  },
  path(gid) {
    const out = [];
    let r = this.find(gid);
    while (r) { out.unshift(r.g); r = r.parent ? this.find(r.parent.id) : null; }
    return out;
  },
  isDescendant(id, ancestorId) {
    const a = this.group(ancestorId);
    if (!a) return false;
    const walk = (g) => g.groups.some(s => s.id === id || walk(s));
    return walk(a);
  },
  pagesDeep(g, out = []) { out.push(...g.pages); for (const s of g.groups) this.pagesDeep(s, out); return out; },
  norm(list) {
    const seenG = new Set(), seenP = new Set();
    const fix = (arr) => (Array.isArray(arr) ? arr : []).filter(g => g && g.id && !seenG.has(g.id)).map(g => {
      seenG.add(g.id);
      g.name = g.name || 'Gruppe';
      g.color = g.color || '';
      g.pages = (Array.isArray(g.pages) ? g.pages : []).filter(pid => Store.pages[pid] && !seenP.has(pid) && seenP.add(pid));
      g.groups = fix(g.groups);
      return g;
    });
    return fix(list);
  },
};

/* ---------------------------------------------------------------- Verlauf (Undo/Redo) */

const Hist = {
  max: 100,
  undo: [], redo: [],
  treeSnap: '', pageSnap: {},
  touched: new Set(), treeTouched: false,

  init() {
    this.treeSnap = JSON.stringify(Store.groups);
    this.pageSnap = {};
    for (const [id, p] of Object.entries(Store.pages)) this.pageSnap[id] = serPage(p);
  },
  load(v) {
    if (!v || !Array.isArray(v.undo)) return;
    const ok = e => e && Array.isArray(e.patches) && e.patches.every(p => p && (p.k === 't' || p.k === 'p'));
    this.undo = v.undo.filter(ok).slice(-this.max);
    this.redo = Array.isArray(v.redo) ? v.redo.filter(ok).slice(-this.max) : [];
  },
  touchPage(id) {
    if (!id) return;
    this.touched.add(id);
    Save.dirty.add(id);
    Save.schedule();
  },
  touchTree() {
    this.treeTouched = true;
    Save.treeDirty = true;
    Save.schedule();
  },
  /* Änderungen seit dem letzten Schritt als einen Verlaufsschritt festhalten */
  commit(label) {
    this.commitSoon.cancel();
    const patches = [];
    if (this.treeTouched) {
      const s = JSON.stringify(Store.groups);
      if (s !== this.treeSnap) { patches.push({ k: 't', b: this.treeSnap, a: s }); this.treeSnap = s; }
      this.treeTouched = false;
    }
    for (const id of this.touched) {
      const p = Store.pages[id];
      const s = p ? serPage(p) : null;
      const before = this.pageSnap[id] ?? null;
      if (s !== before) {
        patches.push({ k: 'p', id, b: before, a: s });
        if (s === null) delete this.pageSnap[id]; else this.pageSnap[id] = s;
      }
    }
    this.touched.clear();
    if (!patches.length) return false;
    this.undo.push({ label: label || 'Änderung', patches, page: Canvas.pageId, t: Date.now() });
    while (this.undo.length > this.max) this.undo.shift();
    this.redo = [];
    this.persistSoon();
    UI.updateUndo();
    return true;
  },
  commitSoon: null,
  pendingLabel: 'Text bearbeiten',
  flushPending() { this.commitSoon.flush(); },

  undoStep() { this.step(this.undo, this.redo, 'b', 'Rückgängig'); },
  redoStep() { this.step(this.redo, this.undo, 'a', 'Wiederholen'); },
  undoTo(index) { // mehrere Schritte auf einmal (aus der Verlaufsliste)
    const n = this.undo.length - index;
    for (let i = 0; i < n; i++) this.step(this.undo, this.redo, 'b', null, true);
    this.after(null, 'Rückgängig: ' + n + ' Schritt' + (n === 1 ? '' : 'e'));
  },
  step(from, to, dir, verb, silent) {
    if (Store.readOnly) return;
    Canvas.stopEditing(true);
    this.flushPending();
    const e = from.pop();
    if (!e) return;
    const list = dir === 'b' ? [...e.patches].reverse() : e.patches;
    for (const pt of list) {
      const v = pt[dir];
      if (pt.k === 't') {
        Store.groups = JSON.parse(v);
        this.treeSnap = v;
        Save.treeDirty = true;
      } else {
        if (v === null) { delete Store.pages[pt.id]; delete this.pageSnap[pt.id]; }
        else { Store.pages[pt.id] = normPage(JSON.parse(v)); this.pageSnap[pt.id] = v; }
        Save.dirty.add(pt.id);
      }
    }
    Save.treeDirty = true;
    to.push(e);
    if (!silent) this.after(e, verb + ': ' + e.label);
  },
  after(e, msg) {
    const target = e && e.page && Store.pages[e.page] ? e.page : (Store.pages[Canvas.pageId] ? Canvas.pageId : null);
    Sidebar.render();
    if (target && target !== Canvas.pageId) App.openPage(target, { keepHistory: true });
    else if (!target) App.openFirstPage();
    else Canvas.reload();
    Save.schedule(150);
    this.persistSoon();
    UI.updateUndo();
    if (msg) UI.toast(msg);
  },
  persistSoon: null,
  async persist() {
    if (!Store.loaded) return;
    if (Store.readOnly) return;
    try { await Backend.saveVerlauf({ v: 1, undo: this.undo, redo: this.redo }); } catch (e) { /* nächster Versuch beim nächsten Schritt */ }
  },
};
Hist.commitSoon = debounce(() => Hist.commit(Hist.pendingLabel), 900);
Hist.persistSoon = debounce(() => Hist.persist(), 1500);

/* ---------------------------------------------------------------- Speichern */

const Save = {
  dirty: new Set(), treeDirty: false, busy: false, again: false, timer: null, state: 'saved', retry: null,
  schedule(ms = 450) {
    if (!Store.loaded || Store.readOnly) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), ms);
    if (this.state !== 'saving') this.setState('pending');
  },
  payload(ids) {
    const titles = {};
    for (const [id, p] of Object.entries(Store.pages)) titles[id] = p.title;
    const pages = {};
    for (const id of ids) if (Store.pages[id]) pages[id] = cleanPage(Store.pages[id]);
    return { groups: Store.groups, titles, pages };
  },
  hasWork() { return this.dirty.size > 0 || this.treeDirty; },
  async flush() {
    clearTimeout(this.timer);
    if (!Store.loaded || Store.readOnly) return;
    if (this.busy) { this.again = true; return this.waitIdle(); }
    if (!this.hasWork()) { this.setState('saved'); return; }
    const ids = new Set(this.dirty);
    const body = this.payload(ids);
    this.dirty.clear();
    this.treeDirty = false;
    this.busy = true;
    this.setState('saving');
    try {
      await Backend.sync(body);
      this.setState(this.hasWork() ? 'pending' : 'saved');
    } catch (e) {
      for (const id of ids) this.dirty.add(id);
      this.treeDirty = true;
      this.setState('error', e.message);
      if (!Store.readOnly) { clearTimeout(this.retry); this.retry = setTimeout(() => this.flush(), 4000); }
    } finally {
      this.busy = false;
      if ((this.again || this.hasWork()) && this.state !== 'error') { this.again = false; this.schedule(250); }
    }
  },
  async waitIdle() {
    for (let i = 0; i < 100 && this.busy; i++) await new Promise(r => setTimeout(r, 50));
  },
  async flushAll() {
    Hist.flushPending();
    await this.waitIdle();
    await this.flush();
    await this.waitIdle();
    if (this.hasWork()) await this.flush();
  },
  /* beim Schliessen eines Browser-Tabs: letzter Versuch */
  beacon() {
    if (!Store.loaded || Store.readOnly || !this.hasWork()) return;
    Backend.beacon(this.payload(this.dirty));
  },
  setState(s, msg) {
    this.state = s;
    UI.saveState(s, msg);
  },
};

/* UI-Zustand (Cache/zustand.json) */
const UiState = {
  saveSoon: debounce(() => UiState.save(), 800),
  async save() {
    if (!Store.loaded || Store.readOnly) return;
    try { await Backend.saveZustand(Store.ui); } catch (e) { /* egal */ }
  },
};

</script>
<script>
/* ---- js/ui.js ---- */
'use strict';
/* Menüs, Farbwähler, Dialoge, Meldungen */

const THEME_COLORS = ['#FFFFFF', '#000000', '#E7E6E6', '#44546A', '#4472C4', '#ED7D31', '#A5A5A5', '#FFC000', '#5B9BD5', '#70AD47'];
const STANDARD_COLORS = ['#C00000', '#FF0000', '#FFC000', '#FFFF00', '#92D050', '#00B050', '#00B0F0', '#0070C0', '#002060', '#7030A0'];
const HIGHLIGHT_COLORS = ['#FFFF00', '#00FF00', '#00FFFF', '#FF00FF', '#0000FF', '#FF0000', '#000080', '#008080', '#008000', '#800080', '#800000', '#808000', '#808080', '#C0C0C0', '#FFE699'];

function shade(hex, f) { // f>0 aufhellen, f<0 abdunkeln
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}

const UI = {
  _pop: null,

  toast(msg, ms = 2200) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(this._tt);
    this._tt = setTimeout(() => t.classList.remove('on'), ms);
  },

  /* ---------------------------------------------------------- Popups */
  closePopup() {
    if (this._pop) { const p = this._pop; this._pop = null; p.el.remove(); p.onClose && p.onClose(); }
  },
  popupOpen() { return !!this._pop; },
  showPopup(content, x, y, opts = {}) {
    this.closePopup();
    const pop = el('div', { class: 'popup ' + (opts.cls || '') });
    pop.append(content);
    pop.addEventListener('mousedown', e => { if (!e.target.closest('input, textarea')) e.preventDefault(); });
    pop.addEventListener('contextmenu', e => e.preventDefault());
    document.body.append(pop);
    const r = pop.getBoundingClientRect();
    const vw = innerWidth, vh = innerHeight;
    if (opts.anchor) {
      const a = opts.anchor.getBoundingClientRect();
      x = a.left; y = a.bottom + 2;
      if (opts.alignRight) x = a.right - r.width;
    }
    if (x + r.width > vw - 6) x = Math.max(6, vw - r.width - 6);
    if (y + r.height > vh - 6) y = Math.max(6, (opts.anchor ? opts.anchor.getBoundingClientRect().top - r.height - 2 : vh - r.height - 6));
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    this._pop = { el: pop, onClose: opts.onClose };
    return pop;
  },

  /* items: {label, icon, key, action, disabled, danger, checked} | '-' | {head} | {colors:[...], action} */
  menu(items, x, y, opts = {}) {
    const box = el('div');
    for (const it of items) {
      if (!it) continue;
      if (it === '-') { box.append(el('div', { class: 'msep' })); continue; }
      if (it.head) { box.append(el('div', { class: 'mhead', text: it.head })); continue; }
      if (it.colors) {
        const row = el('div', { class: 'mcolors' });
        for (const c of it.colors) {
          const b = el('button', { class: 'sw' + (c ? '' : ' none'), title: c || 'Keine Farbe', style: { background: c || '' } });
          b.addEventListener('click', () => { this.closePopup(); it.action(c); });
          row.append(b);
        }
        box.append(row);
        continue;
      }
      const m = el('div', { class: 'mi' + (it.disabled ? ' dis' : '') + (it.danger ? ' danger' : '') + (it.checked ? ' checked' : '') });
      m.innerHTML = `<span class="mi-ic">${it.icon && !it.checked ? icon(it.icon, 15) : ''}</span><span class="mi-label"></span>${it.key ? `<span class="mi-key">${escapeHtml(it.key)}</span>` : ''}`;
      m.querySelector('.mi-label').textContent = it.label;
      if (!it.disabled) m.addEventListener('click', () => { this.closePopup(); it.action && it.action(); });
      box.append(m);
    }
    return this.showPopup(box, x, y, opts);
  },

  /* PowerPoint-ähnlicher Farbwähler */
  colorPicker(anchor, opts, onPick) {
    const box = el('div', { class: 'cp' });
    const pick = (c) => { this.closePopup(); onPick(c); };
    if (opts.none !== false) {
      const m = el('div', { class: 'mi' }, el('span', { class: 'mi-ic', html: '<span class="sw none" style="display:inline-block;width:14px;height:14px"></span>' }), el('span', { class: 'mi-label', text: opts.noneLabel || 'Keine Farbe' }));
      m.addEventListener('click', () => pick(null));
      box.append(m);
    }
    if (opts.highlight) {
      box.append(el('div', { class: 'mhead', text: 'Hervorhebungsfarben' }));
      const g = el('div', { class: 'cp-grid' });
      for (const c of HIGHLIGHT_COLORS) g.append(el('button', { class: 'sw', title: c, style: { background: c }, onclick: () => pick(c) }));
      box.append(g);
    } else {
      box.append(el('div', { class: 'mhead', text: 'Designfarben' }));
      const g = el('div', { class: 'cp-grid' });
      for (const c of THEME_COLORS) g.append(el('button', { class: 'sw', title: c, style: { background: c }, onclick: () => pick(c) }));
      box.append(g);
      const s = el('div', { class: 'cp-grid shades' });
      for (const f of [0.8, 0.6, 0.4, -0.25, -0.5]) {
        for (const c of THEME_COLORS) {
          const v = (c === '#FFFFFF') ? shade('#FFFFFF', -((f > 0 ? 1 - f : -f) * 0.5 + 0.05)) : (c === '#000000' ? shade('#000000', f > 0 ? f * 0.9 : 0.5 + f * -0.2) : shade(c, f));
          s.append(el('button', { class: 'sw', title: v, style: { background: v, borderRadius: 0 }, onclick: () => pick(v) }));
        }
      }
      box.append(s);
      box.append(el('div', { class: 'mhead', text: 'Standardfarben' }));
      const g2 = el('div', { class: 'cp-grid' });
      for (const c of STANDARD_COLORS) g2.append(el('button', { class: 'sw', title: c, style: { background: c }, onclick: () => pick(c) }));
      box.append(g2);
    }
    const more = el('div', { class: 'mi', style: { marginTop: '6px' } });
    more.innerHTML = `<span class="mi-ic">${icon('palette', 15)}</span><span class="mi-label">Weitere Farben …</span>`;
    const inp = el('input', { type: 'color', style: { position: 'absolute', opacity: 0, width: '1px', height: '1px', pointerEvents: 'none' } });
    more.append(inp);
    more.addEventListener('click', () => { UI._nativeDialog = true; inp.click(); });
    inp.addEventListener('change', () => { UI._nativeDialog = false; pick(inp.value); });
    box.append(more);
    this.showPopup(box, 0, 0, { anchor });
  },

  /* ---------------------------------------------------------- Dialoge */
  dialog(build, opts = {}) {
    return new Promise((resolve) => {
      const back = el('div', { class: 'dlg-back' });
      const d = el('div', { class: 'dlg' + (opts.wide ? ' wide' : '') });
      back.append(d);
      let done = false;
      const close = (v) => { if (done) return; done = true; back.remove(); resolve(v); if (opts.restore) opts.restore(); };
      build(d, close);
      back.addEventListener('mousedown', e => { if (e.target === back) close(null); });
      back.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } });
      document.body.append(back);
      const f = d.querySelector('[autofocus]') || d.querySelector('input, .btn.primary');
      if (f) setTimeout(() => { f.focus(); if (f.select) f.select(); }, 20);
    });
  },
  prompt(title, value = '', opts = {}) {
    return this.dialog((d, close) => {
      d.append(el('h2', { text: title }));
      if (opts.text) d.append(el('p', { text: opts.text }));
      const inp = el('input', { type: 'text', value, placeholder: opts.placeholder || '' });
      inp.value = value;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') close(inp.value); });
      d.append(inp);
      d.append(el('div', { class: 'dlg-btns' },
        el('button', { class: 'btn', text: 'Abbrechen', onclick: () => close(null) }),
        el('button', { class: 'btn primary', text: opts.ok || 'OK', onclick: () => close(inp.value) })));
    }, opts);
  },
  confirm(title, text, opts = {}) {
    return this.dialog((d, close) => {
      d.append(el('h2', { text: title }));
      if (text) d.append(el('p', { text }));
      d.append(el('div', { class: 'dlg-btns' },
        el('button', { class: 'btn', text: 'Abbrechen', onclick: () => close(false) }),
        el('button', { class: 'btn ' + (opts.danger ? 'danger' : 'primary'), text: opts.ok || 'OK', autofocus: true, onclick: () => close(true) })));
    }).then(v => !!v);
  },
  info(title, html, opts = {}) {
    return this.dialog((d, close) => {
      d.append(el('h2', { text: title }));
      d.append(el('div', { html }));
      d.append(el('div', { class: 'dlg-btns' }, el('button', { class: 'btn primary', text: 'Schliessen', onclick: () => close(true) })));
    }, opts);
  },

  lightbox(src) {
    const lb = el('div', { class: 'lightbox' }, el('img', { src }));
    lb.addEventListener('click', () => lb.remove());
    document.body.append(lb);
  },

  conflict() {
    if (Store.readOnly) return;
    Store.readOnly = true;
    const d = el('div', { class: 'conflict' }, el('div', { class: 'dlg' },
      el('h2', { text: 'In einem anderen Fenster geöffnet' }),
      el('p', { text: 'KnowledgeTree wurde in einem anderen Fenster oder Tab neu geöffnet. Damit nichts überschrieben wird, speichert dieses hier nicht mehr. Arbeite im neuen weiter – oder lade dieses neu.' }),
      el('div', { class: 'dlg-btns' }, el('button', { class: 'btn primary', text: 'Neu laden', onclick: () => location.reload() }))));
    document.body.append(d);
  },

  /* ---------------------------------------------------------- Statusanzeigen */
  saveState(s, msg) {
    const sb = $('#sb-save'), q = $('#qat-save');
    sb.classList.toggle('err', s === 'error');
    q.classList.toggle('saving', s === 'saving' || s === 'pending');
    const txt = { saved: 'Alle Änderungen gespeichert', pending: 'Änderungen …', saving: 'Speichert …', error: 'Speichern fehlgeschlagen – neuer Versuch …' }[s] || '';
    sb.innerHTML = (s === 'saved' ? icon('check', 13) : s === 'error' ? icon('alert', 13) : icon('save', 13)) + '<span></span>';
    sb.querySelector('span').textContent = txt;
    sb.title = msg || txt;
    q.title = txt + ' (Strg+S)';
  },
  updateUndo() {
    $('#qat-undo').disabled = !Hist.undo.length;
    $('#qat-undo-list').disabled = !Hist.undo.length;
    $('#qat-redo').disabled = !Hist.redo.length;
    const u = Hist.undo[Hist.undo.length - 1], r = Hist.redo[Hist.redo.length - 1];
    $('#qat-undo').title = u ? `Rückgängig: ${u.label} (Strg+Z)` : 'Rückgängig (Strg+Z)';
    $('#qat-redo').title = r ? `Wiederholen: ${r.label} (Strg+Y)` : 'Wiederholen (Strg+Y)';
    Ribbon.refreshSoon();
  },
  /* Liste der letzten Aktionen wie in Office */
  historyList(anchor) {
    const box = el('div', { class: 'hist-pop list-pop' });
    const foot = el('div', { class: 'hist-foot', text: `${Hist.undo.length} von max. ${Hist.max} Schritten gespeichert` });
    const items = [];
    for (let i = Hist.undo.length - 1; i >= 0; i--) {
      const e = Hist.undo[i];
      const m = el('div', { class: 'mi' });
      const t = new Date(e.t).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
      m.innerHTML = `<span class="mi-ic">${icon('undo', 13)}</span><span class="mi-label"></span><span class="mi-key">${t}</span>`;
      m.querySelector('.mi-label').textContent = e.label;
      const idx = i;
      m.addEventListener('mouseenter', () => { items.forEach(x => x.el.classList.toggle('hl', x.idx >= idx)); const n = Hist.undo.length - idx; foot.textContent = `${n} Schritt${n === 1 ? '' : 'e'} rückgängig machen`; });
      m.addEventListener('click', () => { this.closePopup(); Hist.undoTo(idx); });
      items.push({ el: m, idx });
      box.append(m);
    }
    box.append(foot);
    this.showPopup(box, 0, 0, { anchor });
  },
};

/* Popups schliessen bei Klick daneben */
document.addEventListener('pointerdown', (e) => {
  UI._nativeDialog = false;
  if (UI._pop && !e.target.closest('.popup')) {
    UI._justClosed = true;
    UI.closePopup();
    setTimeout(() => { UI._justClosed = false; }, 0);
  }
}, true);
window.addEventListener('blur', () => { if (!UI._nativeDialog) UI.closePopup(); });
window.addEventListener('resize', () => UI.closePopup());

</script>
<script>
/* ---- js/sidebar.js ---- */
'use strict';
/* Navigation wie in OneNote: Gruppen (beliebig verschachtelt) und Seiten */

const Ops = {
  nextGroupColor() {
    const used = Tree.all().map(x => x.g.color);
    return GROUP_COLORS.find(c => !used.includes(c)) || GROUP_COLORS[used.length % GROUP_COLORS.length];
  },

  async newGroup(parentId = null) {
    const parent = parentId ? Tree.group(parentId) : null;
    const name = await UI.prompt(parent ? `Neue Untergruppe in „${parent.name}“` : 'Neue Gruppe', parent ? 'Neue Untergruppe' : 'Neue Gruppe', { ok: 'Erstellen' });
    if (!name || !name.trim()) return;
    Hist.flushPending();
    const g = { id: uid('g'), name: name.trim(), color: this.nextGroupColor(), groups: [], pages: [] };
    if (parent) { parent.groups.push(g); delete Store.ui.collapsed[parent.id]; }
    else Store.groups.push(g);
    const p = newPage('Unbenannte Seite');
    Store.pages[p.id] = p;
    g.pages.push(p.id);
    Hist.touchPage(p.id);
    Hist.touchTree();
    Hist.commit(parent ? 'Untergruppe erstellt' : 'Gruppe erstellt');
    Store.ui.currentGroup = g.id;
    App.openPage(p.id);
  },

  async renameGroup(id) {
    const g = Tree.group(id);
    if (!g) return;
    Sidebar.inlineRename(`.g-row[data-id="${id}"] .g-name`, g.name, (v) => {
      if (!v.trim() || v.trim() === g.name) return;
      g.name = v.trim();
      Hist.touchTree(); Hist.commit('Gruppe umbenannt');
      Sidebar.render();
    });
  },

  setGroupColor(id, color) {
    const g = Tree.group(id);
    if (!g) return;
    g.color = color || '';
    Hist.touchTree(); Hist.commit('Gruppenfarbe');
    Sidebar.render();
  },

  async deleteGroup(id) {
    const r = Tree.find(id);
    if (!r) return;
    const pages = Tree.pagesDeep(r.g);
    const ok = await UI.confirm(`Gruppe „${r.g.name}“ löschen?`,
      `Die Gruppe mit allen Untergruppen und ${pages.length} Seite(n) wird gelöscht. Mit Strg+Z kannst du das rückgängig machen – zusätzlich landet alles im Papierkorb (Cache-Ordner).`,
      { ok: 'Löschen', danger: true });
    if (!ok) return;
    Hist.flushPending();
    r.list.splice(r.list.indexOf(r.g), 1);
    for (const pid of pages) { delete Store.pages[pid]; Hist.touchPage(pid); }
    Hist.touchTree();
    Hist.commit('Gruppe gelöscht');
    if (Store.ui.currentGroup === id || !Store.pages[Canvas.pageId]) App.openFirstPage();
    Sidebar.render();
  },

  moveGroup(id, targetParentId, index) {
    if (id === targetParentId || (targetParentId && Tree.isDescendant(targetParentId, id))) return;
    const r = Tree.find(id);
    if (!r) return;
    const dest = targetParentId ? Tree.group(targetParentId).groups : Store.groups;
    const from = r.list.indexOf(r.g);
    r.list.splice(from, 1);
    if (dest === r.list && index > from) index--;
    dest.splice(clamp(index ?? dest.length, 0, dest.length), 0, r.g);
    if (targetParentId) delete Store.ui.collapsed[targetParentId];
    Hist.touchTree(); Hist.commit('Gruppe verschoben');
    Sidebar.render();
  },

  newPage(groupId) {
    Hist.flushPending();
    let g = Tree.group(groupId || Store.ui.currentGroup) || Store.groups[0];
    if (!g) {
      g = { id: uid('g'), name: 'Allgemein', color: this.nextGroupColor(), groups: [], pages: [] };
      Store.groups.push(g);
    }
    const p = newPage('Unbenannte Seite');
    Store.pages[p.id] = p;
    g.pages.push(p.id);
    Hist.touchPage(p.id);
    Hist.touchTree();
    Hist.commit('Seite erstellt');
    Store.ui.currentGroup = g.id;
    App.openPage(p.id);
    setTimeout(() => { const t = $('#page-title'); t.focus(); t.select(); }, 30);
  },

  renamePage(id) {
    if (id !== Canvas.pageId) App.openPage(id);
    setTimeout(() => { const t = $('#page-title'); t.focus(); t.select(); }, 30);
  },

  duplicatePage(id) {
    const src = Store.pages[id];
    const g = Tree.groupOfPage(id);
    if (!src || !g) return;
    Hist.flushPending();
    const p = normPage(JSON.parse(serPage(src)));
    const map = {};
    p.id = uid('p');
    p.title = src.title + ' (Kopie)';
    p.created = Date.now();
    for (const k of p.pkgs) { map[k.id] = uid('k'); k.id = map[k.id]; }
    for (const b of p.boxes) { map[b.id] = uid('b'); b.id = map[b.id]; if (b.pkg) b.pkg = map[b.pkg]; }
    for (const l of p.links) { l.id = uid('l'); l.a = map[l.a]; l.b = map[l.b]; }
    Store.pages[p.id] = p;
    g.pages.splice(g.pages.indexOf(id) + 1, 0, p.id);
    Hist.touchPage(p.id); Hist.touchTree(); Hist.commit('Seite dupliziert');
    App.openPage(p.id);
  },

  async deletePage(id) {
    const p = Store.pages[id];
    const g = Tree.groupOfPage(id);
    if (!p || !g) return;
    const ok = await UI.confirm(`Seite „${p.title}“ löschen?`, 'Mit Strg+Z kannst du das rückgängig machen. Zusätzlich landet die Seite im Papierkorb (Cache-Ordner).', { ok: 'Löschen', danger: true });
    if (!ok) return;
    Hist.flushPending();
    const idx = g.pages.indexOf(id);
    g.pages.splice(idx, 1);
    delete Store.pages[id];
    Hist.touchPage(id); Hist.touchTree(); Hist.commit('Seite gelöscht');
    if (Canvas.pageId === id) {
      const next = g.pages[Math.min(idx, g.pages.length - 1)];
      if (next) App.openPage(next); else { Store.ui.currentGroup = g.id; App.openPage(null); }
    }
    Sidebar.render();
  },

  movePage(id, groupId, index) {
    const from = Tree.groupOfPage(id);
    const to = Tree.group(groupId);
    if (!from || !to) return;
    const fi = from.pages.indexOf(id);
    from.pages.splice(fi, 1);
    if (from === to && index != null && index > fi) index--;
    to.pages.splice(clamp(index ?? to.pages.length, 0, to.pages.length), 0, id);
    Hist.touchTree(); Hist.commit('Seite verschoben');
    if (id === Canvas.pageId) Store.ui.currentGroup = to.id;
    Sidebar.render();
  },
};

const Sidebar = {
  init() {
    $('#add-group').innerHTML = icon('folderPlus', 17);
    $('#add-page').innerHTML = icon('pagePlus', 17);
    $('#add-group').addEventListener('click', () => Ops.newGroup(null));
    $('#add-page').addEventListener('click', () => Ops.newPage());
    const gt = $('#group-tree'), pl = $('#page-list');

    gt.addEventListener('click', (e) => {
      const row = e.target.closest('.g-row');
      if (!row) return;
      const id = row.dataset.id;
      if (e.target.closest('.g-caret')) {
        Store.ui.collapsed[id] = !Store.ui.collapsed[id];
        UiState.saveSoon();
        this.renderGroups();
        return;
      }
      if (this.isDouble('g' + id)) { Ops.renameGroup(id); return; }
      this.selectGroup(id);
    });
    gt.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const row = e.target.closest('.g-row');
      if (!row) {
        UI.menu([{ label: 'Neue Gruppe', icon: 'folderPlus', action: () => Ops.newGroup(null) }], e.clientX, e.clientY);
        return;
      }
      const id = row.dataset.id;
      UI.menu([
        { label: 'Neue Seite', icon: 'pagePlus', action: () => Ops.newPage(id) },
        { label: 'Neue Untergruppe', icon: 'subgroup', action: () => Ops.newGroup(id) },
        '-',
        { label: 'Umbenennen', icon: 'pencil', key: 'Doppelklick', action: () => Ops.renameGroup(id) },
        { head: 'Farbe' },
        { colors: GROUP_COLORS, action: (c) => Ops.setGroupColor(id, c) },
        '-',
        { label: 'Gruppe löschen', icon: 'trash', danger: true, action: () => Ops.deleteGroup(id) },
      ], e.clientX, e.clientY);
    });

    pl.addEventListener('click', (e) => {
      const row = e.target.closest('.p-row');
      if (!row) return;
      if (this.isDouble('p' + row.dataset.id)) { Ops.renamePage(row.dataset.id); return; }
      if (row.dataset.id !== Canvas.pageId) App.openPage(row.dataset.id);
    });
    pl.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      const row = e.target.closest('.p-row');
      if (!row) {
        UI.menu([{ label: 'Neue Seite', icon: 'pagePlus', key: 'Alt+N', action: () => Ops.newPage() }], e.clientX, e.clientY);
        return;
      }
      const id = row.dataset.id;
      UI.menu([
        { label: 'Öffnen', icon: 'page', action: () => App.openPage(id) },
        { label: 'Umbenennen', icon: 'pencil', key: 'F2', action: () => Ops.renamePage(id) },
        { label: 'Duplizieren', icon: 'duplicate', action: () => Ops.duplicatePage(id) },
        '-',
        { label: 'Seite löschen', icon: 'trash', danger: true, action: () => Ops.deletePage(id) },
      ], e.clientX, e.clientY);
    });

    this.initDnD(gt, pl);
    this.initSplitters();
  },

  isDouble(key) {
    const now = Date.now();
    const hit = this._lastClick && this._lastClick.key === key && now - this._lastClick.t < 450;
    this._lastClick = hit ? null : { key, t: now };
    return hit;
  },

  selectGroup(id) {
    if (Store.ui.currentGroup === id && Canvas.pageId && Tree.groupOfPage(Canvas.pageId)?.id === id) return;
    Store.ui.currentGroup = id;
    const g = Tree.group(id);
    const last = Store.ui.lastPage[id];
    const pid = g && (g.pages.includes(last) ? last : g.pages[0]);
    App.openPage(pid || null, { group: id });
  },

  render() {
    if (this.inlineActive) { this.renderPending = true; return; }
    this.renderGroups();
    this.renderPages();
  },

  renderGroups() {
    const gt = $('#group-tree');
    gt.innerHTML = '';
    if (!Store.groups.length) {
      gt.append(el('div', { class: 'nav-empty' }, 'Noch keine Gruppen.', el('br'),
        el('button', { class: 'btn primary', text: '+ Neue Gruppe', onclick: () => Ops.newGroup(null) })));
      return;
    }
    const cur = Store.ui.currentGroup;
    const build = (list, depth) => {
      for (const g of list) {
        const open = !Store.ui.collapsed[g.id];
        const row = el('div', { class: 'g-row' + (g.id === cur ? ' sel' : ''), draggable: 'true', dataset: { id: g.id }, style: { paddingLeft: (4 + depth * 14) + 'px' } });
        row.innerHTML = `<span class="g-caret ${g.groups.length ? (open ? 'open' : '') : 'none'}">${icon('chevRight', 12)}</span>` +
          `<span class="g-tab" style="background:${g.color || 'var(--line-2)'}"></span><span class="g-name"></span><span class="g-count">${g.pages.length || ''}</span>`;
        row.querySelector('.g-name').textContent = g.name;
        row.title = g.name;
        gt.append(row);
        if (open && g.groups.length) build(g.groups, depth + 1);
      }
    };
    build(Store.groups, 0);
  },

  renderPages() {
    const pl = $('#page-list');
    pl.innerHTML = '';
    const g = Tree.group(Store.ui.currentGroup);
    $('#pages-head').textContent = g ? g.name : 'Seiten';
    $('#pages-head').title = g ? Tree.path(g.id).map(x => x.name).join(' › ') : '';
    if (!g) { pl.append(el('div', { class: 'nav-empty', text: 'Wähle links eine Gruppe aus.' })); return; }
    if (!g.pages.length) {
      pl.append(el('div', { class: 'nav-empty' }, 'Diese Gruppe hat noch keine Seiten.', el('br'),
        el('button', { class: 'btn primary', text: '+ Seite hinzufügen', onclick: () => Ops.newPage(g.id) })));
      return;
    }
    for (const pid of g.pages) {
      const p = Store.pages[pid];
      if (!p) continue;
      const row = el('div', { class: 'p-row' + (pid === Canvas.pageId ? ' sel' : ''), draggable: 'true', dataset: { id: pid } },
        el('div', { class: 'p-title', text: p.title || 'Unbenannte Seite' }),
        el('div', { class: 'p-date', text: fmtShortDate(p.created) }));
      row.title = p.title;
      pl.append(row);
    }
  },

  inlineRename(selector, value, done) {
    const span = $(selector);
    if (!span) return;
    const inp = el('input', { class: 'inline-edit', value });
    inp.value = value;
    span.replaceWith(inp);
    inp.focus(); inp.select();
    let finished = false;
    this.inlineActive = true;
    const fin = (ok) => { if (finished) return; finished = true; this.inlineActive = false; if (ok) done(inp.value); this.render(); };
    inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') fin(true); if (e.key === 'Escape') fin(false); });
    inp.addEventListener('blur', () => fin(true));
    inp.addEventListener('mousedown', e => e.stopPropagation());
  },

  /* ---------------------------------------------------------- Ziehen & Ablegen */
  initDnD(gt, pl) {
    let drag = null;
    const clear = () => $$('.drop-before,.drop-after,.drop-into').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-into'));
    const start = (e, kind) => {
      const row = e.target.closest(kind === 'group' ? '.g-row' : '.p-row');
      if (!row) return;
      drag = { kind, id: row.dataset.id };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', '');
    };
    gt.addEventListener('dragstart', e => start(e, 'group'));
    pl.addEventListener('dragstart', e => start(e, 'page'));
    document.addEventListener('dragend', () => { drag = null; clear(); });

    const zone = (row, e) => {
      const r = row.getBoundingClientRect();

        const z = zone(row, e);

      clear();
      e.preventDefault();
      if (row && row.dataset.id !== drag.id) {
        const r = row.getBoundingClientRect();
        row.classList.add((e.clientY - r.top) < r.height / 2 ? 'drop-before' : 'drop-after');
      }
    });
    pl.addEventListener('drop', (e) => {
      if (!drag || drag.kind !== 'page') return;
      e.preventDefault();
      const row = e.target.closest('.p-row');
      clear();
      const g = Tree.group(Store.ui.currentGroup);
      if (!g) return;
      if (row && row.dataset.id !== drag.id) {
        const r = row.getBoundingClientRect();
        const idx = g.pages.indexOf(row.dataset.id) + ((e.clientY - r.top) < r.height / 2 ? 0 : 1);
        Ops.movePage(drag.id, g.id, idx);
      } else if (!row) Ops.movePage(drag.id, g.id, g.pages.length);
      drag = null;
    });
  },

  initSplitters() {
    for (const sp of $$('.splitter')) {
      sp.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const target = sp.dataset.for === 'groups' ? $('#nav-groups') : $('#nav-pages');
        const key = sp.dataset.for === 'groups' ? 'groupsW' : 'pagesW';
        const w0 = target.offsetWidth, x0 = e.clientX;
        sp.classList.add('drag');
        sp.setPointerCapture(e.pointerId);
        const move = (ev) => { const w = clamp(w0 + ev.clientX - x0, 130, 480); target.style.width = w + 'px'; Store.ui[key] = w; };
        const up = () => { sp.classList.remove('drag'); sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up); UiState.saveSoon(); };
        sp.addEventListener('pointermove', move);
        sp.addEventListener('pointerup', up);
      });
    }
  },
  applyWidths() {
    $('#nav-groups').style.width = (Store.ui.groupsW || 220) + 'px';
    $('#nav-pages').style.width = (Store.ui.pagesW || 210) + 'px';
    document.body.classList.toggle('no-side', Store.ui.sidebar === false);
  },
};
