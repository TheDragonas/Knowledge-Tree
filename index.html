        close(tex ? { tex, display: disp.checked } : null);
      };
      d.append(el('div', { class: 'dlg-btns' },
        existing ? el('button', { class: 'btn danger', text: 'Formel entfernen', onclick: () => close({ remove: true }) }) : null,
        el('button', { class: 'btn', text: 'Abbrechen', onclick: () => close(null) }),
        el('button', { class: 'btn primary', text: existing ? 'Übernehmen' : 'Einfügen', onclick: done })));
      let k0 = 0;
      try { k0 = +localStorage.getItem('kt-fx-tab') || 0; } catch (e) { /* */ }
      show(Math.min(k0, tabs.length - 1));
      upd();
      setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 30);
    }, { wide: true }).then((res) => {
      if (!res) return;
      if (existing) this.replace(existing, res);
      else this.insertNew(res, range, editBox);
    });
  },
  /* aktuelle Schreibmarke merken (selectionchange kommt verzögert) */
  grabRange() {
    const t = Canvas.textEl(Canvas.editing), sel = getSelection();
    if (t && sel.rangeCount && t.contains(sel.anchorNode)) { Canvas.lastRange = sel.getRangeAt(0).cloneRange(); Canvas.lastRangeBox = Canvas.editing; }
    else Canvas.restoreRange();
  },
  /* Menüband: Formel-Galerie wie in Office */
  gallery(anchor) {
    if (!Canvas.page) { UI.toast('Bitte zuerst eine Seite öffnen'); return; }
    if (Canvas.editing) this.grabRange();
    const box = el('div', { class: 'fx-gal' });
    box.append(el('div', { class: 'fx-gal-head', text: 'Integriert' }));
    const grid = el('div', { class: 'fx-gal-grid' });
    for (const [label, tex] of this.TEMPLATES) {
      const b = el('button', { class: 'fx-gal-item', title: 'Bearbeiten und einfügen: ' + label });
      b.innerHTML = `<span class="fx-gal-name">${escapeHtml(label)}</span>` + this.toMathML(tex, true);
      b.addEventListener('mousedown', e => e.preventDefault());
      b.addEventListener('click', () => { UI.closePopup(); this.open(null, tex); });
      grid.append(b);
    }
    box.append(grid, el('div', { class: 'fx-gal-sep' }),
      el('button', { class: 'fx-gal-new', html: icon('formula', 16) + '<span>Neue Formel einfügen …</span><kbd>Alt+=</kbd>', onmousedown: e => e.preventDefault(), onclick: () => { UI.closePopup(); this.open(null); } }));
    UI.showPopup(box, 0, 0, { anchor });
  },
  nextSlot(ta, back) {
    const v = ta.value, pos = back ? ta.selectionStart - 1 : ta.selectionEnd;
    const i = back ? v.lastIndexOf('□', pos - 1) : v.indexOf('□', pos);
    const j = i >= 0 ? i : (back ? v.lastIndexOf('□') : v.indexOf('□'));
    if (j >= 0) ta.setSelectionRange(j, j + 1);
  },
  insertNew(res, range, editBox) {
    const html = this.spanHtml(res.tex, res.display) + (res.display ? '' : '\u200B');
    if (editBox && Canvas.box(editBox) && Canvas.textEl(editBox)) {
      if (Canvas.editing !== editBox) Canvas.focusText(editBox, true);
      if (range && Canvas.textEl(editBox).contains(range.startContainer)) { Canvas.lastRange = range; Canvas.lastRangeBox = editBox; }
      let atEnd = true;
      const t = Canvas.textEl(editBox), r = Canvas.lastRangeBox === editBox ? Canvas.lastRange : null;
      if (r && t.contains(r.endContainer)) {
        const tail = document.createRange();
        tail.setStart(r.endContainer, r.endOffset);
        tail.setEnd(t, t.childNodes.length);
        atEnd = !tail.toString().replace(/[\u200B\s]/g, '');
      }
      Fmt.apply(() => Fmt.exec('insertHTML', res.display ? `<div>${html}</div>${atEnd ? '<div><br></div>' : ''}` : html), 'Formel eingefügt');
      return;
    }
    if (!Canvas.page) { UI.toast('Bitte zuerst eine Seite öffnen'); return; }
    const c = Canvas.viewCenter();
    const b = Canvas.createBoxAt({ x: c.x - 120, y: c.y - 30 }, { html: `<div>${html}</div>`, noFocus: true, label: 'Formel eingefügt', w: 320 });
    if (b) Canvas.select([b.id]);
  },
  replace(span, res) {
    const t = span.closest('.box-text');
    const boxEl = span.closest('.box');
    const b = boxEl && Canvas.box(boxEl.dataset.id);
    if (!t || !b) return;
    Hist.flushPending();
    if (res.remove) span.remove();
    else {
      const tmp = document.createElement('div');
      tmp.innerHTML = this.spanHtml(res.tex, res.display);
      span.replaceWith(tmp.firstChild);
    }
    b.html = boxHtml(t);
    Canvas.els.get(b.id)._html = b.html;
    Hist.touchPage(Canvas.pageId);
    Hist.commit(res.remove ? 'Formel entfernt' : 'Formel geändert');
    Canvas.layoutSoon();
  },
};

</script>
<script>
/* ---- js/export.js ---- */
'use strict';
/* Exportieren: Seiten, Abschnitte und Notizbücher gezielt auswählen.
 * Formate: PDF (über den Druckdialog), Webseite (eine HTML-Datei), KnowledgeTree-Datei (verlustfrei, wie ein Backup),
 * OneNote (.one für einen Abschnitt, .onepkg für ein Notizbuch – Beta, siehe onenote-write.js). */

const EXPORT_FORMATS = [
  { id: 'pdf', label: 'PDF', icon: 'filePdf', text: 'Zum Drucken und Weitergeben. Es öffnet sich der Druckdialog – dort „Als PDF speichern“ wählen.' },
  { id: 'html', label: 'Webseite (HTML)', icon: 'globe', text: 'Eine einzige Datei für jeden Browser, mit Inhaltsverzeichnis, Bildern und Anhängen.' },
  { id: 'kt', label: 'KnowledgeTree-Datei', icon: 'archive', text: 'Verlustfrei mit allen Bildern und Anhängen. Mit „Datei → Backup laden“ wieder einlesen.' },
  { id: 'one', label: 'OneNote', icon: 'oneNote', text: 'Ein Abschnitt wird zur .one-Datei, mehrere zu einem Notizbuch (.onepkg). Beta – bitte in OneNote prüfen.' },
];
const KIND_ICON = { notebook: 'book', group: 'folder', section: 'page', quick: 'bolt' };

const Export = {
  sel: new Set(),
  open: false,

  /* ---------------------------------------------------------- Dialog */
  show(preset = {}) {
    if (Store.readOnly) return;
    Canvas.stopEditing();
    Hist.flushPending();
    const curPid = Canvas.pageId;
    const curSec = curPid ? Tree.groupOfPage(curPid) : Tree.group(Store.ui.currentGroup);
    const curNb = curSec ? Tree.notebookOf(curSec.id) : null;
    this.sel = new Set();
    if (preset.pages) preset.pages.forEach(p => this.sel.add(p));
    else if (preset.group) { const g = Tree.group(preset.group); if (g) Tree.pagesDeep(g).forEach(p => this.sel.add(p)); }
    else if (curPid) this.sel.add(curPid);
    let format = Store.ui.exportFormat || 'pdf';
    const open = new Set(); // aufgeklappte Knoten
    for (const g of Store.groups) if (g.kind === 'notebook' && !g.closed) open.add(g.id);
    if (curSec) for (const g of Tree.path(curSec.id)) open.add(g.id);
    if (preset.group) for (const g of Tree.path(preset.group)) open.add(g.id);

    return UI.dialog((d, close) => {
      d.classList.add('ex-dlg');
      d.append(el('h2', { text: 'Exportieren' }));
      // Format
      const fmts = el('div', { class: 'ex-fmts' });
      const fmtText = el('div', { class: 'ex-fmt-text' });
      const opts = el('div', { class: 'ex-opts' });
      const renderFormats = () => {
        fmts.innerHTML = '';
        for (const f of EXPORT_FORMATS) {
          const b = el('button', { class: 'ex-fmt' + (f.id === format ? ' on' : ''), type: 'button', html: icon(f.icon, 22) + `<span>${escapeHtml(f.label)}</span>` });
          b.addEventListener('click', () => { format = f.id; renderFormats(); renderOpts(); });
          fmts.append(b);
        }
        fmtText.textContent = EXPORT_FORMATS.find(f => f.id === format).text;
      };
      const o = { paper: Store.ui.exportPaper || 'a4-hoch', fit: Store.ui.exportFit || 'breite', head: Store.ui.exportHead !== false, bg: !!Store.ui.exportBg };
      const renderOpts = () => {
        opts.innerHTML = '';
        if (format === 'pdf') {
          const paper = el('select', {}, ...[['a4-hoch', 'A4 hoch'], ['a4-quer', 'A4 quer'], ['a3-hoch', 'A3 hoch'], ['a3-quer', 'A3 quer'], ['letter-hoch', 'Letter hoch']].map(([v, l]) => el('option', { value: v, text: l, selected: v === o.paper })));
          paper.addEventListener('change', () => { o.paper = paper.value; });
          const fit = el('select', {}, ...[['breite', 'an Blattbreite anpassen'], ['blatt', 'ganze Seite auf ein Blatt'], ['original', 'Originalgrösse (100 %)']].map(([v, l]) => el('option', { value: v, text: l, selected: v === o.fit })));
          fit.addEventListener('change', () => { o.fit = fit.value; });
          opts.append(el('label', { class: 'ex-opt' }, 'Papier ', paper), el('label', { class: 'ex-opt' }, 'Grösse ', fit));
        }
        if (format === 'pdf' || format === 'html') {
          const head = el('input', { type: 'checkbox' }); head.checked = o.head;
          head.addEventListener('change', () => { o.head = head.checked; });
          const bg = el('input', { type: 'checkbox' }); bg.checked = o.bg;
          bg.addEventListener('change', () => { o.bg = bg.checked; });
          opts.append(el('label', { class: 'ex-opt' }, head, 'Titel und Datum'), el('label', { class: 'ex-opt' }, bg, 'Punkte/Linien der Seite'));
        }
        if (format === 'one') opts.append(el('div', { class: 'ex-note', html: 'Text mit Formatierung, Überschriften, Listen, Bilder, Freihand und Formen kommen an derselben Stelle an. Verbindungen, Pakete und Feldrahmen gibt es in OneNote nicht – sie werden zu Zeichnungen. Tabellen werden zu Text mit Tabulatoren, Formeln zu LaTeX-Text, Anhänge zu ihrem Namen.<br>Öffnen: <b>.one</b> bzw. <b>.onepkg</b> doppelklicken (OneNote für Windows).' }));
      };
      // Auswahl
      const presets = el('div', { class: 'ex-presets' });
      const P = (label, fn, ok = true) => { const b = el('button', { class: 'btn small', type: 'button', text: label, disabled: !ok }); b.addEventListener('click', () => { fn(); refresh(); }); presets.append(b); };
      const setAll = (ids, on) => ids.forEach(p => on ? this.sel.add(p) : this.sel.delete(p));
      P('Diese Seite', () => { this.sel.clear(); if (curPid) this.sel.add(curPid); }, !!curPid);
      P('Dieser Abschnitt', () => { this.sel.clear(); setAll(curSec.pages, true); open.add(curSec.id); }, !!curSec);
      P('Dieses Notizbuch', () => { this.sel.clear(); setAll(Tree.pagesDeep(curNb), true); }, !!curNb);
      P('Alles', () => { this.sel.clear(); Store.groups.forEach(g => setAll(Tree.pagesDeep(g), true)); });
      P('Nichts', () => this.sel.clear());
      const treeEl = el('div', { class: 'ex-tree' });
      const sum = el('div', { class: 'ex-sum' });
      const state = (ids) => { let n = 0; for (const p of ids) if (this.sel.has(p)) n++; return n === 0 ? 0 : n === ids.length ? 2 : 1; };
      const childPages = (sec, i) => { const out = [sec.pages[i]]; const L = Store.pages[sec.pages[i]].level || 0; for (let j = i + 1; j < sec.pages.length && (Store.pages[sec.pages[j]].level || 0) > L; j++) out.push(sec.pages[j]); return out; };
      const row = (depth, html, ids, onToggle, extra) => {
        const r = el('div', { class: 'ex-row', style: { paddingLeft: (8 + depth * 18) + 'px' } });
        const cb = el('input', { type: 'checkbox' });
        const st = state(ids);
        cb.checked = st === 2; cb.indeterminate = st === 1; cb.disabled = !ids.length;
        cb.addEventListener('change', () => { setAll(ids, st !== 2); refresh(); });
        r.append(extra || el('span', { class: 'ex-tw' }), cb, el('span', { class: 'ex-name', html }));
        r.addEventListener('click', (e) => { if (e.target === cb || e.target.closest('.ex-tw')) return; if (onToggle) onToggle(); else if (ids.length) { setAll(ids, st !== 2); refresh(); } });
        return r;
      };
      const renderNode = (g, depth) => {
        const ids = Tree.pagesDeep(g);
        const hasKids = g.groups.length || g.pages.length;
        const tw = el('span', { class: 'ex-tw' + (hasKids ? '' : ' none'), html: hasKids ? icon(open.has(g.id) ? 'chevDown' : 'chevRight', 12) : '' });
        tw.addEventListener('click', () => { if (open.has(g.id)) open.delete(g.id); else open.add(g.id); refresh(); });
        const dot = g.kind === 'section' || g.kind === 'quick' ? `<i class="ex-dot" style="background:${escapeHtml(g.color || '#8a8886')}"></i>` : icon(KIND_ICON[g.kind] || 'folder', 14);
        treeEl.append(row(depth, `${dot}<b>${escapeHtml(g.name)}</b><small>${ids.length ? ids.length + ' Seite' + (ids.length === 1 ? '' : 'n') : 'leer'}${g.closed ? ' · geschlossen' : ''}</small>`, ids, () => tw.click(), tw));
        if (!open.has(g.id)) return;
        for (const c of g.groups) renderNode(c, depth + 1);
        g.pages.forEach((pid, i) => {
          const p = Store.pages[pid];
          if (!p) return;
          const lv = p.level || 0;
          const ids2 = childPages(g, i);
          treeEl.append(row(depth + 1 + lv, `${icon('page', 13)}<span>${escapeHtml(p.title || 'Unbenannte Seite')}</span>${ids2.length > 1 ? `<small>+${ids2.length - 1} Unterseite${ids2.length > 2 ? 'n' : ''}</small>` : ''}`, ids2, null));
        });
      };
      const refresh = () => {
        const top = treeEl.scrollTop;
        treeEl.innerHTML = '';
        for (const g of Store.groups) renderNode(g, 0);
        treeEl.scrollTop = top;
        const secs = Tree.sections().filter(s => s.pages.some(p => this.sel.has(p)));
        const nbs = new Set(secs.map(s => (Tree.notebookOf(s.id) || s).id));
        sum.textContent = this.sel.size ? `Ausgewählt: ${this.sel.size} Seite${this.sel.size === 1 ? '' : 'n'} aus ${secs.length} Abschnitt${secs.length === 1 ? '' : 'en'}${nbs.size > 1 ? ` in ${nbs.size} Notizbüchern` : ''}` : 'Nichts ausgewählt';
        go.disabled = !this.sel.size;
      };
      const go = el('button', { class: 'btn primary', text: 'Exportieren', onclick: () => close({ format, o }) });
      d.append(el('div', { class: 'ex-label', text: 'Format' }), fmts, fmtText, opts,
        el('div', { class: 'ex-label', text: 'Was soll exportiert werden?' }), presets, treeEl, sum,
        el('div', { class: 'dlg-btns' }, el('button', { class: 'btn', text: 'Abbrechen', onclick: () => close(null) }), go));
      renderFormats(); renderOpts(); refresh();
    }, { wide: true }).then(async (res) => {
      if (!res) return;
      Store.ui.exportFormat = res.format;
      Object.assign(Store.ui, { exportPaper: res.o.paper, exportFit: res.o.fit, exportHead: res.o.head, exportBg: res.o.bg });
      UiState.saveSoon();
      await this.run(res.format, res.o);
    });
  },

  /* Auswahl als beschnittener Baum (nur Knoten mit ausgewählten Seiten) */
  pruned(list = Store.groups) {
    const out = [];
    for (const g of list) {
      const pages = g.pages.filter(p => this.sel.has(p) && Store.pages[p]);
      const groups = this.pruned(g.groups);
      if (!pages.length && !groups.length) continue;
      out.push({ id: g.id, name: g.name, color: g.color || '', kind: g.kind, pages, groups });
    }
    return out;
  },
  /* Seiten der Auswahl in Baum-Reihenfolge, mit Pfad */
  ordered(tree) {
    const out = [];
    const walk = (list, path) => { for (const g of list) { for (const p of g.pages) out.push({ pid: p, path: [...path, g] }); walk(g.groups, [...path, g]); } };
    walk(tree, []);
    return out;
  },
  exportName(tree) {
    if (this.sel.size === 1) return Store.pages[[...this.sel][0]].title || 'Seite';
    let t = tree;
    const names = [];
    while (t.length === 1) { names.push(t[0].name); if (t[0].pages.length) break; t = t[0].groups; }
    return names.length ? names[names.length - 1] : 'KnowledgeTree-Export';
  },
  safe(name) { return String(name || 'Export').replace(/[<>:"/\\|?*\u0000-\u001f]+/g, '_').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Export'; },
  download(name, blob) {
    const a = el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  },

  /* ---------------------------------------------------------- Ablauf */
  async run(format, o) {
    await Save.flushAll();
    const tree = this.pruned();
    const list = this.ordered(tree);
    if (!list.length) return;
    const name = this.exportName(tree);
    const prog = this.progress('Exportieren …');
    try {
      if (format === 'kt') await this.toKt(tree, name, prog);
      else if (format === 'html') await this.toHtml(tree, list, name, o, prog);
      else if (format === 'pdf') await this.toPdf(list, name, o, prog);
      else if (format === 'one') await this.toOneNote(tree, name, prog);
    } catch (e) {
      console.error(e);
      UI.toast('Export fehlgeschlagen: ' + e.message, 5000);
    } finally { prog.close(); }
  },
  progress(title) {
    const back = el('div', { class: 'dlg-back ex-busy' });
    const txt = el('div', { class: 'ex-busy-text', text: title });
    const bar = el('div', { class: 'ex-bar' }, el('i'));
    back.append(el('div', { class: 'dlg' }, el('h2', { text: title }), txt, bar));
    document.body.append(back);
    return {
      set(t, f) { txt.textContent = t; if (f != null) bar.firstChild.style.width = Math.round(f * 100) + '%'; },
      close() { back.remove(); },
    };
  },

  /* ---------------------------------------------------------- Dateien (Bilder, Anhänge) */
  assetNames(obj) {
    const s = typeof obj === 'string' ? obj : JSON.stringify(obj);
    return [...new Set(s.match(/[0-9a-f]{40}\.[a-z0-9]{1,8}/g) || [])];
  },
  async assetBlob(name) {
    try { const r = await fetch(await Backend.imgURL(name)); if (!r.ok) return null; return await r.blob(); } catch (e) { return null; }
  },
  async assetData(name, cache) {
    if (cache && cache.has(name)) return cache.get(name);
    const b = await this.assetBlob(name);
    const u = b ? await blobToDataURL(b) : null;
    if (cache) cache.set(name, u);
    return u;
  },

  /* ---------------------------------------------------------- KnowledgeTree-Datei */
  async toKt(tree, name, prog) {
    const seiten = {};
    for (const { pid } of this.ordered(tree)) seiten[pid] = JSON.parse(serPage(Store.pages[pid]));
    const names = this.assetNames(seiten);
    const bilder = {};
    let i = 0;
    for (const n of names) {
      prog.set(`Bilder und Anhänge … (${++i}/${names.length})`, i / names.length);
      const u = await this.assetData(n);
      if (u) bilder[n] = u;
    }
    const data = { typ: 'KnowledgeTree-Backup', version: 2, erstellt: new Date().toISOString(), name, gruppen: tree, seiten, bilder };
    const stamp = new Date().toISOString().slice(0, 10);
    this.download(`${this.safe(name)}_${stamp}.knowledgetree.json`, new Blob([JSON.stringify(data)], { type: 'application/json' }));
    UI.toast(`${Object.keys(seiten).length} Seite(n) als KnowledgeTree-Datei exportiert`, 3500);
  },

  /* ---------------------------------------------------------- Seiten als statisches HTML */
  /* jede Seite der Reihe nach im Canvas darstellen (hell), danach alles wie vorher */
  async renderEach(list, prog, fn) {
    const origPid = Canvas.pageId;
    const origView = origPid && Store.ui.views[origPid] ? { ...Store.ui.views[origPid] } : null;
    const origTheme = document.body.dataset.theme;
    document.body.dataset.theme = 'hell';
    try {
      let k = 0;
      for (const it of list) {
        const page = Store.pages[it.pid];
        if (!page) continue;
        prog.set(`Seite ${++k} von ${list.length}: ${page.title || ''}`, (k - 1) / list.length);
        Canvas.showPage(page);
        await this.waitImages($('#layer-boxes'));
        Canvas.layout();
        Draw.render();
        await nextFrame();
        await fn(page, it.pid, it);
      }
    } finally {
      document.body.dataset.theme = origTheme;
      if (origPid && origView) Store.ui.views[origPid] = origView;
      Canvas.load(origPid);
    }
  },
  async snapshots(list, prog, opts = {}) {
    const cache = new Map();
    const out = [];
    await this.renderEach(list, prog, async (page, pid, it) => { out.push({ pid, path: it.path, page, ...(await this.snapshot(page, cache, opts)) }); });
    return out;
  },
  async waitImages(root) {
    for (let t = 0; t < 40; t++) {
      const imgs = [...root.querySelectorAll('img')];
      if (imgs.every(i => i.getAttribute('src') && i.complete)) return;
      await new Promise(r => setTimeout(r, 75));
    }
  },
  async snapshot(page, cache, opts) {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    const add = (r) => { if (!r) return; x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y); x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h); };
    for (const r of Canvas.rects.values()) add(r);
    for (const d of page.drawings) { const b = DG.bbox(d); add({ x: b.x - d.w, y: b.y - d.w, w: b.w + 2 * d.w, h: b.h + 2 * d.w }); }
    for (const pts of Canvas.linkGeo ? Canvas.linkGeo.values() : []) for (const q of pts || []) add({ x: q.x - 6, y: q.y - 6, w: 12, h: 12 });
    if (x1 === Infinity) { x1 = y1 = 0; x2 = 300; y2 = 100; }
    const M = 16;
    x1 = Math.floor(x1 - M); y1 = Math.floor(y1 - M); x2 = Math.ceil(x2 + M); y2 = Math.ceil(y2 + M);
    const world = $('#world').cloneNode(true);
    world.removeAttribute('id');
    world.className = 'kt-world';
    world.style.transform = `translate(${-x1}px, ${-y1}px)`;
    world.querySelectorAll('#layer-tools, #layer-handles, #layer-overlay, .sock, .box-rs, .fimg-rs, .link-hit, .box-lock, .pkg-lock').forEach(x => x.remove());
    world.querySelectorAll('[contenteditable]').forEach(x => x.removeAttribute('contenteditable'));
    world.querySelectorAll('[spellcheck]').forEach(x => x.removeAttribute('spellcheck'));
    world.querySelectorAll('[title]').forEach(x => x.removeAttribute('title'));
    world.querySelectorAll('.sel, .editing').forEach(x => x.classList.remove('sel', 'editing'));
    // Bilder einbetten
    for (const img of world.querySelectorAll('img')) {
      let name = img.dataset.ktSrc;
      if (!name) {
        const f = img.closest('.fimg'), bx = img.closest('.box');
        const b = bx && page.boxes.find(q => q.id === bx.dataset.id);
        const im = b && f && b.images.find(q => q.id === f.dataset.img);
        name = im && im.src;
      }
      const u = name ? await this.assetData(name, cache) : null;
      if (u) img.setAttribute('src', u); else img.removeAttribute('src');
      img.removeAttribute('data-kt-src');
    }

<script>
/* ---- js/onenote.js ---- */
'use strict';
/* OneNote-Dateien lesen (.one, .onepkg) – ohne fremde Bibliotheken.
 *
 *   Ebene 1  Bytes:    Entpacken (Inflate/MSZIP) und CAB-Archive (.onepkg)
 *   Ebene 2  OneStore: das Revisions-Speicherformat [MS-ONESTORE] – Dateiknoten-Listen, Objekträume,
 *                      Revisionen, Objekte mit Eigenschaften, eingebettete Dateien
 *   Ebene 3  Inhalt:   Bedeutung der Objekte nach [MS-ONE] – Abschnitt, Seiten, Gliederungen, Text …

 * Läuft im Browser und (für Tests) in Node. Keine DOM-Abhängigkeiten. */

const ON = (() => {

      bitcnt -= need;

  const LZX_EXTRA = new Uint8Array(51), LZX_BASE = new Uint32Array(51);

  /* ================================================================ OneStore [MS-ONESTORE] */
  const FT_ONE = '{7B5C52E4-D88C-4DA7-AEB1-5378D02996D3}';
  const FT_TOC = '{43FF2FA1-EFD9-4C76-9EE2-10EA5722765F}';
  const FF_REVSTORE = '{109ADD3F-911B-49F5-A5D0-1791EDC8AED8}';
  const FDSO_HEADER = '{BDE316E7-2665-4511-A4C4-8D4D0B7A9EAC}';
  const FDSO_FOOTER = '{71FBA722-0F79-4A0B-BB13-899256426B24}';
  const LIST_MAGIC_LO = 0xF5F7F4C4, LIST_MAGIC_HI = 0xA4567AB1;
  const FOOTER_LO = 0x8233BA4B, FOOTER_HI = 0x8BC215C3;

  const FND = {
    ObjectSpaceManifestRoot: 0x004, ObjectSpaceManifestListReference: 0x008, ObjectSpaceManifestListStart: 0x00C,
    RevisionManifestListReference: 0x010, RevisionManifestListStart: 0x014, RevisionManifestStart4: 0x01B, RevisionManifestEnd: 0x01C,
    RevisionManifestStart6: 0x01E, RevisionManifestStart7: 0x01F, GlobalIdTableStart: 0x021, GlobalIdTableStart2: 0x022,
    GlobalIdTableEntry: 0x024, GlobalIdTableEntry2: 0x025, GlobalIdTableEntry3: 0x026, GlobalIdTableEnd: 0x028,
    ObjectDeclarationWithRefCount: 0x02D, ObjectDeclarationWithRefCount2: 0x02E, ObjectRevisionWithRefCount: 0x041, ObjectRevisionWithRefCount2: 0x042,
    RootObjectReference2: 0x059, RootObjectReference3: 0x05A, RevisionRoleDeclaration: 0x05C, RevisionRoleAndContextDeclaration: 0x05D,
    ObjectDeclarationFileData3RefCount: 0x072, ObjectDeclarationFileData3LargeRefCount: 0x073, ObjectDataEncryptionKeyV2: 0x07C,
    ObjectInfoDependencyOverrides: 0x084, DataSignatureGroupDefinition: 0x08C, FileDataStoreListReference: 0x090, FileDataStoreObjectReference: 0x094,
    ObjectDeclaration2RefCount: 0x0A4, ObjectDeclaration2LargeRefCount: 0x0A5, ObjectGroupListReference: 0x0B0, ObjectGroupStart: 0x0B4,
    ObjectGroupEnd: 0x0B8, HashedChunkDescriptor2: 0x0C2, ReadOnlyObjectDeclaration2RefCount: 0x0C4, ReadOnlyObjectDeclaration2LargeRefCount: 0x0C5,

  const exg = (g, n) => (g === NIL_GUID && !n) ? null : g + ':' + n;

  class OneStore {
    constructor(u8, name = '') {

      this.encrypted = false;
      this.parseRoot();

    parseHeader() {
      const r = new Reader(this.u8);

      this.fcrFileNodeListRoot = rd(172, 12);
      this.fcrHashedChunkList = rd(148, 12);
    }

    /* Transaktions-Log: wie viele Dateiknoten jede Liste gültig enthält */
    readTransactionLog() {
      this.counts = new Map();
      let ref = this.fcrTransactionLog, done = 0;
      let guard = 0;
      while (ref && ref.stp !== -1 && ref.cb && done < this.cTransactions && guard++ < 100000) {
        const r = new Reader(this.u8, ref.stp, ref.stp + ref.cb);

    /* Dateiknoten-Liste lesen (alle Fragmente) */

        const r = new Reader(this.u8, ref.stp, ref.stp + ref.cb);
        const lo = r.u32(), hi = r.u32();
        if (lo !== LIST_MAGIC_LO || hi !== LIST_MAGIC_HI) throw new Error('Beschädigte Dateiknoten-Liste bei ' + ref.stp);
        const id = r.u32();
        r.u32(); // nFragmentSequence
        if (listId === null) { listId = id; if (this.counts.has(id)) max = this.counts.get(id); }

          const at = r.pos;

          if (fid === FND.ChunkTerminator) { next = true; break; }

          case FND.ObjectSpaceManifestListReference: node.gosid = eg(); break;
          case FND.ObjectSpaceManifestListStart: node.gosid = eg(); break;
          case FND.RevisionManifestListStart: node.gosid = eg(); break;

            break;
          case FND.GlobalIdTableEntry: node.index = r.u32(); node.guid = r.guid(); break;
          case FND.GlobalIdTableEntry2: node.from = r.u32(); node.to = r.u32(); break;
          case FND.GlobalIdTableEntry3: node.from = r.u32(); node.count = r.u32(); node.to = r.u32(); break;
          case FND.RootObjectReference3: node.oid = eg(); node.rootRole = r.u32(); break;
          case FND.RootObjectReference2: node.coid = r.u32(); node.rootRole = r.u32(); break;
          case FND.RevisionRoleDeclaration: node.rid = eg(); node.role = r.u32(); node.ctx = null; break;
          case FND.RevisionRoleAndContextDeclaration: node.rid = eg(); node.role = r.u32(); node.ctx = eg(); break;
          case FND.ObjectGroupListReference: node.groupId = eg(); break;
          case FND.ObjectGroupStart: node.groupId = eg(); break;

    parseRoot() {

    parseSpace(refNode) {

          case FND.GlobalIdTableEntry3: if (table && prevTable) for (let i = 0; i < n.count; i++) if (prevTable.has(n.from + i)) table.set(n.to + i, prevTable.get(n.from + i)); break;

    isDecl(id) {

        id === FND.ReadOnlyObjectDeclaration2LargeRefCount || id === FND.ObjectDeclarationFileData3RefCount || id === FND.ObjectDeclarationFileData3LargeRefCount ||

      let table = null;

    /* Objekte einer Revision samt aller abhängigen Revisionen */
    revisionView(space, rid) {

      if (Array.isArray(tags)) {
        for (const t of tags) {
          const def = this.p(ctx.view, t.get(P.NoteTagDefinitionOid));
          const status = this.u(t, P.ActionItemStatus);
          block.tags.push({
            label: def ? this.s(def, P.NoteTagLabel) : '', shape: def ? this.u(def, P.NoteTagShape) : null,
            type: def ? this.u(def, P.ActionItemType) : null, done: status != null ? !!(status & 1) : false,

          });

      }
      for (const id of this.list(props, P.ContentChildNodes)) {
        const c = this.obj(ctx.view, id);
        if (!c) continue;
        if (c.jcid === J.RichTextOENode) block.content.push(this.richText(ctx, c));
        else if (c.jcid === J.ImageNode) { const im = this.image(ctx, c); if (im) block.content.push({ type: 'img', ...im }); }
        else if (c.jcid === J.TableNode) block.content.push(this.table(ctx, c));
        else if (c.jcid === J.EmbeddedFileNode) { const fi = this.file(ctx, c); if (fi) block.content.push({ type: 'file', ...fi }); }

      for (const id of this.list(props, P.ElementChildNodes)) this.element(ctx, this.obj(ctx.view, id), depth + 1, out);
    }

    ink(ctx, o) {
      const st = this.store;
      const props = st.props(o);
      const off = this.pos(props);
      const kind = this.u(props, INK.Kind) || 1;
      const data = this.p(ctx.view, props.get(INK.Data));
      const strokes = [];
      for (const sid of this.list(data, INK.Strokes)) {
        const sp = this.p(ctx.view, sid);
        const raw = sp && sp.get(INK.Path);
        if (!(raw instanceof Uint8Array)) continue;
        const pp = this.p(ctx.view, sp.get(INK.Props)) || new Map();

            const r = new Reader(mt, i);

        const n = vals[0];
        const body = vals.slice(1, 1 + n);
        const per = Math.floor(body.length / chans.length);
        if (per < 1) continue;
        const series = chans.map((c, k) => { let acc = 0; return body.slice(k * per, (k + 1) * per).map(d => (acc += d)); });
        const ix = Math.max(0, chans.findIndex(c => c.guid === GUID_X)), iy = chans.findIndex(c => c.guid === GUID_Y) >= 0 ? chans.findIndex(c => c.guid === GUID_Y) : 1;

        const sx = toPx(chans[ix]), sy = toPx(chans[iy] || chans[ix]);
        const pmax = ip >= 0 ? (chans[ip].max > 0 && chans[ip].max < 1e7 ? chans[ip].max : 32767) : 0;
        const pts = [];
        for (let i = 0; i < per; i++) {
          const p = ip >= 0 ? Math.max(0.05, Math.min(1, series[ip][i] / pmax / 1.5)) : 0.5;
          pts.push({ x: off.x + series[ix][i] * sx, y: off.y + series[iy][i] * sy, p: Math.round(p * 100) / 100 });
        }
        const w = (this.f(pp, INK.Width) || 100) * 96 / 2540;
        const marker = !!pp.get(INK.Highlighter) || pp.get(INK.RasterOp) === 9;
        strokes.push({ pts, w: Math.round(w * 100) / 100, color: colorRef(pp.get(INK.Color)) || (marker ? '#ffff00' : '#000000'), marker, t0: fileTime(sp.get(INK.Time)) || 0 });
      }
      if (!strokes.length) return null;
      if (kind !== 1) this.note('Formen aus OneNote (als Linien übernommen)');
      return { kind: 'ink', shape: kind !== 1, strokes, ...off };
    }

    fmt(props) {
      if (!props) return {};
      const f = {};
      for (const [k, n] of [[P.Bold, 'b'], [P.Italic, 'i'], [P.Underline, 'u'], [P.Strikethrough, 's'], [P.Superscript, 'sup'], [P.Subscript, 'sub'], [P.Hyperlink, 'link'], [P.Hidden, 'hidden'], [P.MathFormatting, 'math']]) {
        if (props.has(k)) f[n] = !!props.get(k);
      }
      const font = this.s(props, P.Font); if (font) f.font = font;
      const size = props.get(P.FontSize); if (typeof size === 'number') f.size = size / 2;
      if (props.has(P.FontColor)) f.color = colorRef(props.get(P.FontColor));
      if (props.has(P.Highlight)) f.hl = colorRef(props.get(P.Highlight));
      const url = this.s(props, P.WzHyperlinkUrl); if (url) f.url = url;

    }
    richText(ctx, o) {
      const props = this.store.props(o);
      let text = '';
      if (props.has(P.RichEditTextUnicode)) text = V.str(props.get(P.RichEditTextUnicode));
      else if (props.has(P.TextExtendedAscii)) text = V.ascii(props.get(P.TextExtendedAscii));
      const idxRaw = props.get(P.TextRunIndex);
      const bounds = [];
      if (idxRaw instanceof Uint8Array) for (let i = 0; i + 4 <= idxRaw.length; i += 4) bounds.push(V.u32(idxRaw.subarray(i, i + 4)));
      const fmts = this.list(props, P.TextRunFormatting).map(id => this.fmt(this.p(ctx.view, id)));
      const styleP = this.p(ctx.view, props.get(P.ParagraphStyle));
      const para = { type: 'p', style: styleP ? this.s(styleP, P.ParagraphStyleId) : '', base: this.fmt(styleP), runs: [], align: props.get(P.ParagraphAlignment) ?? null };
      // Absatzabstände (Punkte): direkt am Absatz oder aus der Formatvorlage
      for (const [k, n] of [[P.ParagraphSpaceBefore, 'before'], [P.ParagraphSpaceAfter, 'after'], [P.ParagraphLineSpacingExact, 'lineExact']]) {
        const v = props.has(k) ? this.f(props, k) : styleP ? this.f(styleP, k) : 0;
        if (v > 0 && v < 400) para[n] = v;
      }
      const cuts = [0, ...bounds.filter(b => b > 0 && b < text.length), text.length];

        const t = text.slice(cuts[i], cuts[i + 1]);

        para.runs.push({ text: t, ...(fmts[i] || {}) });
      }
      if (!para.runs.length && text) para.runs.push({ text });
      // Hyperlinks: Feldcode U+FDDF HYPERLINK "adresse" vor dem angezeigten Text
      let link = null;
      for (const r of para.runs) {
        const m = /﷟\s*HYPERLINK\s+"([^"]*)"/.exec(r.text);
        if (m) { link = m[1]; r.text = r.text.replace(m[0], ''); }
        if (r.link || r.url) r.href = r.url || link; else if (!m) link = null;
        r.text = r.text.replace(/[﷐-﷯]/g, '');
      }
      para.runs = para.runs.filter(r => r.text && !r.hidden);
      if (para.runs.some(r => r.math)) this.note('Formeln (als Text übernommen)');
      return para;
    }
    image(ctx, o) {
      const props = this.store.props(o);
      const fobj = this.obj(ctx.view, props.get(P.PictureContainer));
      const fb = this.store.fileBytes(fobj);
      const w = (this.f(props, P.PictureWidth) || this.f(props, P.LayoutMaxWidth) || 0) * HALF_INCH;
      const h = (this.f(props, P.PictureHeight) || this.f(props, P.LayoutMaxHeight) || 0) * HALF_INCH;
      if (!fb || !fb.data) { this.note('Bilder ohne Daten'); return { missing: true, w, h, ...this.pos(props) }; }
      const type = sniff(fb.data);
      if (type === 'image/x-wmf' || type === 'image/x-emf') this.note('Bilder im Format WMF/EMF (Browser können sie nicht anzeigen)');
      return { data: fb.data, mime: type, ext: fb.ext || '', w, h, alt: this.s(props, P.ImageAltText), name: this.s(props, P.ImageFilename), ...this.pos(props), background: !!props.get(P.IsBackground) };
    }
    file(ctx, o) {
      const props = this.store.props(o);
      const fobj = this.obj(ctx.view, props.get(P.EmbeddedFileContainer));
      const fb = this.store.fileBytes(fobj);
      const name = this.s(props, P.EmbeddedFileName) || 'Anhang' + ((fb && fb.ext) || '');
      this.note('Dateianhänge');
      if (!fb || !fb.data) { this.note('Anhänge ohne Daten (ausserhalb der Datei gespeichert)'); return { name, missing: true, ...this.pos(props) }; }
      return { name, data: fb.data, mime: sniff(fb.data), ...this.pos(props) };
    }
    table(ctx, o) {
      const props = this.store.props(o);
      const wr = props.get(P.TableColumnWidths);
      const cols = [];
      if (wr instanceof Uint8Array && wr.length >= 1) { const c = wr[0]; for (let i = 0; i < c && 1 + i * 4 + 4 <= wr.length; i++) cols.push(V.f32(wr.subarray(1 + i * 4, 5 + i * 4)) * HALF_INCH); }
      const t = { type: 'table', cols, borders: props.get(P.TableBordersVisible) !== false, rows: [] };
      for (const rid of this.list(props, P.ElementChildNodes)) {
        const ro = this.obj(ctx.view, rid);
        if (!ro) continue;
        const row = [];
        for (const cid of this.list(this.store.props(ro), P.ElementChildNodes)) {
          const co = this.obj(ctx.view, cid);
          if (!co) continue;
          const cp = this.store.props(co);
          const blocks = [];
          for (const eid of this.list(cp, P.ElementChildNodes)) this.element(ctx, this.obj(ctx.view, eid), 0, blocks);
          row.push({ blocks, shade: colorRef(cp.get(P.CellShadingColor)) });
        }
        t.rows.push(row);
      }
      return t;
    }
  }
  const ON_hex = (n) => hex(n);

  /* Inhaltsverzeichnis eines Notizbuchs (.onetoc2): Reihenfolge und Farben */
  function readToc(store) {
    const out = { color: null, entries: [] };
    try {
      const view = store.currentRevision(store.rootSpace, 1);
      if (!view) return out;
      let root = view.objects.get(view.roots.get(1));
      if (!root) return out;
      const rp = store.props(root);
      out.color = colorRef(rp.get(0x14001CBE));
      const kids = (rp.get(0x24001CF6) || []).map(id => view.objects.get(id)).filter(Boolean).map(o => store.props(o));
      for (const k of kids) {
        const name = k.get(0x1C001D6B) instanceof Uint8Array ? V.str(k.get(0x1C001D6B)) : '';
        if (!name) continue;
        const ord = k.get(0x14001CB9) instanceof Uint8Array ? V.u32(k.get(0x14001CB9)) : 0;
        out.entries.push({ name, order: ord, color: colorRef(k.get(0x14001CBE)) });
      }
      out.entries.sort((x, y) => x.order - y.order);
    } catch (e) { /* Reihenfolge ist nicht wichtig */ }
    return out;
  }

  return { Reader, inflate, readCab, lzxDecompress, OneStore, Model, readToc, multiByte, V, P, P_NAME, J, J_NAME, INK, HALF_INCH, hex, guidStr, FND, FND_NAME, utf16, latin1, sniff };
})();

<script>
/* ---- js/onenote-import.js ---- */
'use strict';
/* OneNote importieren: .one (Abschnitt) und .onepkg (Notizbuch) -> Notizbücher, Abschnitte, Seiten in KnowledgeTree */

const TAG_SYMBOLS = [
  [/wichtig|important/i, '⭐'], [/frage|question/i, '❓'], [/idee|idea/i, '💡'], [/kritisch|critical/i, '❗'],
  [/merken|später|remember|later/i, '📌'], [/definition/i, '📖'], [/hervorheb|highlight/i, '🖍'], [/kontakt|contact/i, '👤'],
  [/adresse|address/i, '🏠'], [/telefon|phone/i, '📞'], [/website|webseite/i, '🔗'], [/zitat|quote/i, '💬'],
  [/projekt|project/i, '📁'], [/film|movie|musik|music|buch|book/i, '🎬'], [/passwort|password/i, '🔑'],
  [/besprech|discuss|diskut/i, '🗨'], [/termin|meeting|besprechung/i, '📅'], [/kunde|client/i, '🤝'],
];
const TODO_RE = /aufgabe|to ?do|task|erledig|anruf|call|kauf|buy|e-?mail/i;
/* Standard-Formatvorlagen von OneNote (gelten, wenn die Datei selbst nichts angibt) */
const ON_STYLES = {
  h1: { font: 'Calibri Light', size: 16, color: '#1e4e79' }, h2: { font: 'Calibri Light', size: 14, color: '#2e75b5' },
  h3: { font: 'Calibri', size: 12, color: '#1f3763' }, h4: { font: 'Calibri', size: 12, color: '#2f5496', i: true },
  h5: { font: 'Calibri', size: 11, color: '#2e75b5' }, h6: { font: 'Calibri', size: 11, color: '#2e75b5', i: true },
  pagetitle: { font: 'Calibri Light', size: 20 }, cite: { size: 9, color: '#595959' }, quote: { i: true, color: '#595959' },
  blockquote: { i: true, color: '#595959' }, code: { font: 'Consolas' }, p: { font: 'Calibri', size: 11 },
};
/* Platz, den Titel und Datum oben auf einer OneNote-Seite belegen (bei KnowledgeTree stehen sie über der Fläche) */
const ON_TITLE_SPACE = 56;
const fontCss = (f) => `font-family:&quot;${escapeHtml(f)}&quot;${/^calibri/i.test(f) ? ',Carlito' : ''},var(--font-note)`;

const OneImport = {
  /* ---------------------------------------------------------- Start */
  async start() {
    const files = await new Promise((res) => {
      const inp = el('input', { type: 'file', accept: '.one,.onepkg', multiple: true, style: { display: 'none' } });
      inp.addEventListener('change', () => { res([...inp.files]); inp.remove(); });
      document.body.append(inp);
      inp.click();
    });
    if (files.length) await this.fromFiles(files);
  },
  isOneNoteFile(f) { return /\.(one|onepkg)$/i.test(f.name || ''); },

  async fromFiles(files) {
    files = files.filter(f => this.isOneNoteFile(f));
    if (!files.length) return;
    if (Store.readOnly) return;
    UI.toast('OneNote-Dateien werden gelesen …', 60000);
    await new Promise(r => setTimeout(r, 30));
    const plan = { notebooks: [], sections: [], errors: [], report: new Map(), warnings: 0 };
    for (const f of files) {
      try {
        const u8 = new Uint8Array(await f.arrayBuffer());
        if (u8[0] === 0x4D && u8[1] === 0x53 && u8[2] === 0x43 && u8[3] === 0x46) plan.notebooks.push(this.readPackage(u8, f.name.replace(/\.onepkg$/i, ''), plan));
        else {
          const s = this.readSection(u8, f.name.replace(/\.one$/i, ''), plan);
          if (s) plan.sections.push(s);
        }
      } catch (e) {
        console.error(e);
        plan.errors.push(`${f.name}: ${e.message}`);
      }
    }
    UI.toast('', 1);
    const nSec = plan.sections.length + plan.notebooks.reduce((a, nb) => a + this.countSections(nb.tree), 0);
    if (!nSec) {
      UI.info('OneNote importieren', `<p>Es konnte nichts importiert werden.</p>${plan.errors.length ? '<ul>' + plan.errors.map(e => `<li>${escapeHtml(e)}</li>`).join('') + '</ul>' : ''}`);
      return;
    }
    const target = await this.askTarget(plan);
    if (!target) return;
    await this.apply(plan, target);
  },

  /* ---------------------------------------------------------- Lesen */
  readSection(u8, name, plan) {
    const store = new ON.OneStore(u8, name);
    if (store.type !== 'one') return null;
    const model = new ON.Model(store);
    const sec = model.section(name);
    for (const [k, v] of model.report) plan.report.set(k, (plan.report.get(k) || 0) + v);
    plan.warnings += store.warnings.length;
    if (store.warnings.length) console.warn('OneNote', name, store.warnings);
    return { name: sec.name || name, pages: sec.pages, color: null };
  },
  readPackage(u8, name, plan) {
    const entries = ON.readCab(u8);
    const root = { name, kind: 'notebook', children: [], order: [] };
    const folders = new Map([['', root]]);
    const folder = (path) => {
      if (folders.has(path)) return folders.get(path);
      const i = path.lastIndexOf('/');
      const parent = folder(i < 0 ? '' : path.slice(0, i));
      const g = { name: path.slice(i + 1), kind: 'group', children: [], order: [] };
      parent.children.push(g);
      folders.set(path, g);
      return g;
    };
    // Paket hat oft einen Ordner mit dem Notizbuchnamen ganz oben
    const names = entries.map(e => e.name);
    const tops = new Set(names.map(n => n.includes('/') ? n.split('/')[0] : ''));
    const strip = tops.size === 1 && !tops.has('') ? [...tops][0] + '/' : '';
    if (strip) root.name = strip.slice(0, -1) || name;
    for (const e of entries) {
      let path = e.name.startsWith(strip) ? e.name.slice(strip.length) : e.name;
      if (/(^|\/)OneNote_RecycleBin(\/|$)/i.test(path) || /OneNote_DeletedPages/i.test(path)) { plan.report.set('Papierkorb von OneNote (nicht übernommen)', 1); continue; }
      const i = path.lastIndexOf('/');
      const dir = i < 0 ? '' : path.slice(0, i), base = path.slice(i + 1);
      if (/\.onetoc2$/i.test(base)) {
        try { const toc = this.toc(e.data); const fo = folder(dir); fo.order = toc.entries; if (!dir) root.color = toc.color; } catch (err) { /* nur Reihenfolge */ }
        continue;
      }
      if (!/\.one$/i.test(base)) continue;
      try {
        const s = this.readSection(e.data, base.replace(/\.one$/i, ''), plan);
        if (s) { s.file = base; folder(dir).children.push({ kind: 'section', ...s }); }
      } catch (err) {
        console.error(err);
        plan.errors.push(`${path}: ${err.message}`);
      }
    }
    // Reihenfolge wie in OneNote (aus dem Inhaltsverzeichnis), sonst alphabetisch
    const sortRec = (g) => {
      const ord = g.order || [];
      const find = (c) => ord.findIndex(o => { const n = o.name.toLowerCase(); return n === (c.file || '').toLowerCase() || n === c.name.toLowerCase() || n === c.name.toLowerCase() + '.one'; });
      for (const c of g.children) { const i = find(c); c._ord = i < 0 ? 1e6 : i; if (i >= 0 && ord[i].color) c.color = ord[i].color; }
      g.children.sort((a, b) => a._ord - b._ord || a.name.localeCompare(b.name, 'de'));
      for (const c of g.children) if (c.children) sortRec(c);
    };
    sortRec(root);
    return { name: root.name, tree: root, color: root.color || null };
  },
  toc(u8) { return ON.readToc(new ON.OneStore(u8, 'toc')); },
  countSections(g) { return g.children.reduce((a, c) => a + (c.kind === 'section' ? 1 : this.countSections(c)), 0); },
  countPages(g) { return g.children.reduce((a, c) => a + (c.kind === 'section' ? c.pages.length : this.countPages(c)), 0); },

  /* ---------------------------------------------------------- Ziel wählen */
  askTarget(plan) {
    const nb = plan.notebooks.length, ns = plan.sections.length;
    const pages = plan.sections.reduce((a, s) => a + s.pages.length, 0) + plan.notebooks.reduce((a, n) => a + this.countPages(n.tree), 0);
    return UI.dialog((d, close) => {
      d.append(el('h2', { text: 'OneNote importieren' }));
      const parts = [];
      if (nb) parts.push(`${nb} Notizbuch${nb === 1 ? '' : 'bücher'} (${plan.notebooks.map(n => '„' + n.name + '“').join(', ')})`);
      if (ns) parts.push(`${ns} Abschnitt${ns === 1 ? '' : 'e'}`);
      d.append(el('p', { text: `Gefunden: ${parts.join(' und ')} mit insgesamt ${pages} Seite${pages === 1 ? '' : 'n'}.` }));
      let sel = null;
      if (ns) {
        d.append(el('p', { text: nb ? 'Die einzelnen Abschnitte kommen nach:' : 'Wohin sollen die Abschnitte?' }));
        sel = el('select', { style: { width: '100%', height: '32px', borderRadius: '5px', border: '1px solid var(--line-2)', background: 'var(--chrome-2)', padding: '0 8px' } });
        sel.append(el('option', { value: '__neu', text: 'Neues Notizbuch „OneNote-Import“' }));
        const cur = Ops.currentContainer();
        const walk = (list, depth) => {
          for (const g of list) {
            if (g.closed || !Tree.isContainer(g)) continue;
            sel.append(el('option', { value: g.id, text: '  '.repeat(depth) + (g.kind === 'notebook' ? '📓 ' : '📁 ') + g.name }));
            walk(g.groups, depth + 1);
          }
        };
        walk(Store.groups, 0);
        if (cur) sel.value = cur.id;
        d.append(sel);
      }
      if (nb) d.append(el('p', { style: { marginTop: '10px' }, text: 'Jedes Notizbuch wird als neues Notizbuch mit allen Abschnittsgruppen, Abschnitten und Unterseiten angelegt.' }));
      if (plan.errors.length) d.append(el('p', { style: { color: 'var(--danger)' }, text: 'Nicht lesbar: ' + plan.errors.join(' · ') }));
      d.append(el('div', { class: 'dlg-btns' },
        el('button', { class: 'btn', text: 'Abbrechen', onclick: () => close(null) }),
        el('button', { class: 'btn primary', text: 'Importieren', onclick: () => close({ container: sel ? sel.value : null }) })));
    }, { wide: true });
  },

  /* ---------------------------------------------------------- Übernehmen */
  async apply(plan, target) {
    Canvas.stopEditing();
    Hist.flushPending();
    UI.toast('Importiere …', 60000);
    const stats = { notebooks: 0, sections: 0, pages: 0, images: 0, files: 0 };
    const rep = plan.report;
    let firstPage = null;
    const makeSection = async (s, parent) => {
      const node = { id: uid('g'), name: s.name || 'Abschnitt', color: s.color || Ops.nextColor(), kind: 'section', groups: [], pages: [] };
      parent.groups.push(node);
      for (const pg of s.pages) {
        try {
          const p = await this.convertPage(pg, rep, stats);
          Store.pages[p.id] = p;
          node.pages.push(p.id);
          Hist.touchPage(p.id);
          stats.pages++;
          if (!firstPage) firstPage = p.id;
        } catch (e) { console.error(e); rep.set('Seiten mit Fehlern beim Umwandeln', (rep.get('Seiten mit Fehlern beim Umwandeln') || 0) + 1); }
      }
      Tree.normLevels(node);
      stats.sections++;
    };
    const makeTree = async (g, parent) => {
      for (const c of g.children) {
        if (c.kind === 'section') await makeSection(c, parent);
        else {
          const grp = { id: uid('g'), name: c.name, color: c.color || '', kind: 'group', groups: [], pages: [] };
          parent.groups.push(grp);
          await makeTree(c, grp);
          if (!grp.groups.length) parent.groups.splice(parent.groups.indexOf(grp), 1);
        }
      }
    };
    for (const nb of plan.notebooks) {
      const node = { id: uid('g'), name: nb.name, color: nb.color || Ops.nextColor(), kind: 'notebook', groups: [], pages: [] };
      Store.groups.push(node);
      await makeTree(nb.tree, node);
      stats.notebooks++;
    }
    if (plan.sections.length) {
      let parent = target.container && target.container !== '__neu' ? Tree.group(target.container) : null;
      if (!Tree.isContainer(parent)) {
        parent = { id: uid('g'), name: 'OneNote-Import', color: Ops.nextColor(), kind: 'notebook', groups: [], pages: [] };
        Store.groups.push(parent);
        stats.notebooks++;
      }
      for (const s of plan.sections) await makeSection(s, parent);
    }
    Hist.touchTree();
    Hist.commit('OneNote importiert');
    await Save.flushAll();
    UI.toast('', 1);
    if (firstPage) App.openPage(firstPage);
    Sidebar.render();
    this.showReport(stats, plan);
  },

  showReport(stats, plan) {
    const rows = [];
    rows.push(`<p><b>Importiert:</b> ${stats.notebooks ? stats.notebooks + ' Notizbuch' + (stats.notebooks === 1 ? '' : 'bücher') + ', ' : ''}${stats.sections} Abschnitt${stats.sections === 1 ? '' : 'e'}, ${stats.pages} Seite${stats.pages === 1 ? '' : 'n'}, ${stats.images} Bild${stats.images === 1 ? '' : 'er'}, ${stats.files} Anhang/Anhänge.</p>`);
    const rep = [...plan.report].filter(([, v]) => v);
    if (rep.length) rows.push('<p><b>Angepasst oder ersetzt:</b></p><ul>' + rep.map(([k, v]) => `<li>${escapeHtml(k)}: ${v}</li>`).join('') + '</ul>');
    if (plan.errors.length) rows.push('<p style="color:var(--danger)"><b>Nicht lesbar:</b></p><ul>' + plan.errors.map(e => `<li>${escapeHtml(e)}</li>`).join('') + '</ul>');
    if (plan.warnings) rows.push(`<p style="color:var(--ink-3)">${plan.warnings} technische Hinweise beim Lesen (Details in der Browser-Konsole).</p>`);
    rows.push('<p style="color:var(--ink-3)">Mit Strg+Z lässt sich der ganze Import rückgängig machen.</p>');
    UI.info('OneNote-Import abgeschlossen', rows.join(''), { wide: true });
  },

  /* ---------------------------------------------------------- Seite umwandeln */
  async saveBlob(data, type, ext, isImage) {
    const blob = new Blob([data], { type: type || 'application/octet-stream' });
    if (isImage && /^image\/(png|jpeg|gif|webp|bmp|svg\+xml)$/.test(type)) return Backend.saveImage(blob);
    return Backend.saveFile ? Backend.saveFile(blob, ext) : Backend.saveImage(blob);
  },
  async convertPage(pg, rep, stats) {
    const p = newPage(pg.title || 'Unbenannte Seite');
    if (pg.created) p.created = pg.created;
    p.modified = pg.modified || p.created;
    p.level = pg.level || 0;
    p.bg = 'keiner';
    const items = pg.items.filter(it => it.kind !== 'unknown');
    // Gleiche Lage wie in OneNote: alle Elemente behalten ihre Koordinaten (1 px = 1/96 Zoll).
    // Nur der Titelbereich oben wird abgezogen, weil der Titel hier über der Fläche steht.
    let minX = Infinity, minY = Infinity;
    for (const it of items) {
      if (it.kind === 'ink') { for (const st of it.strokes || []) for (const v of st.pts) { if (v.x < minX) minX = v.x; if (v.y < minY) minY = v.y; } }
      else { minX = Math.min(minX, it.x || 0); minY = Math.min(minY, it.y || 0); }
    }
    if (minX === Infinity) minX = minY = 0;
    const offX = Math.min(0, minX), offY = Math.min(ON_TITLE_SPACE, minY);
    let z = 1;
    const pad = PADX + BORDER;
    const onStyle = { bg: 'transparent', lh: 'normal', on: 1 };
    for (const it of items) {
      const x = Math.round(((it.x || 0) - offX) * 10) / 10, y = Math.round(((it.y || 0) - offY) * 10) / 10;
      if (it.kind === 'outline') {
        const ctx = { maxImg: 0 };
        const html = await this.blocksHtml(it.blocks, it, rep, stats, ctx);
        if (isEmptyHtml(html) && !/<img|kt-file|kt-math/.test(html)) continue;
        const w = Math.round(Math.max(it.w || 0, ctx.maxImg, 40) || 480) + 2 * pad;
        p.boxes.push({ id: uid('b'), x: x - pad, y: y - BAR - BORDER, w, html, images: [], z: z++, style: { ...onStyle }, locked: false, pkg: null });
      } else if (it.kind === 'image') {
        if (it.missing) continue;
        const name = await this.saveBlob(it.data, it.mime, (it.ext || '').replace('.', ''), true);
        stats.images++;
        const w = Math.round(it.w || 200), h = Math.round(it.h || 150);
        if (/^image\/(png|jpeg|gif|webp|bmp|svg\+xml)$/.test(it.mime)) {
          p.boxes.push({ id: uid('b'), x: x - pad, y: y - BAR - BORDER, w: w + 2 * pad, html: '', images: [{ id: uid('i'), src: name, x: 0, y: 0, w, h }], z: it.background ? 0 : z++, style: { ...onStyle }, locked: !!it.background, pkg: null });
        } else {
          p.boxes.push({ id: uid('b'), x: x - pad, y: y - BAR - BORDER, w: 260, html: this.fileChip(name, (it.name || 'Bild') + (it.ext && !/\.\w+$/.test(it.name || '') ? it.ext : '')), images: [], z: z++, style: { ...onStyle }, locked: false, pkg: null });
        }
      } else if (it.kind === 'file') {
        if (it.missing) continue;
        const name = await this.saveBlob(it.data, it.mime, (it.name.split('.').pop() || 'bin'), false);
        stats.files++;
        p.boxes.push({ id: uid('b'), x: x - pad, y: y - BAR - BORDER, w: 280, html: this.fileChip(name, it.name), images: [], z: z++, style: { ...onStyle }, locked: false, pkg: null });
      } else if (it.kind === 'ink' && Array.isArray(it.strokes)) {
        for (const s of it.strokes) {
          const X = (v) => Math.round((v - offX) * 10) / 10, Y = (v) => Math.round((v - offY) * 10) / 10;
          const color = s.color || '#1f1f1f', w = Math.max(0.5, s.w || 2);
          if (it.shape && !s.marker && s.pts.length >= 2) {
            // OneNote-Form: Ecken bleiben scharf
            const q = s.pts;
            const closed = q.length > 2 && Math.hypot(q[0].x - q[q.length - 1].x, q[0].y - q[q.length - 1].y) < 0.5;
            const use = closed ? q.slice(0, -1) : q;
            if (use.length === 2) p.drawings.push({ id: uid('d'), type: 'shape', shape: 'line', x1: X(use[0].x), y1: Y(use[0].y), x2: X(use[1].x), y2: Y(use[1].y), color, w, fill: null, t0: s.t0 || Date.now(), layer: 'oben' });
            else p.drawings.push({ id: uid('d'), type: 'shape', shape: closed ? 'poly' : 'polyline', pts: use.flatMap(v => [X(v.x), Y(v.y)]), color, w, fill: null, t0: s.t0 || Date.now(), layer: 'oben' });
            continue;
          }
          const pts = [];
          for (const v of s.pts) pts.push(X(v.x), Y(v.y), v.p ?? 0.5);
          if (pts.length >= 3) p.drawings.push({ id: uid('d'), type: 'ink', kind: s.marker ? 'marker' : 'pen', color, w, pts, t0: s.t0 || Date.now(), dur: 0, layer: 'oben', ...(it.shape ? { sharp: true } : {}) });
        }
      }
    }
    return normPage(p);
  },
  fileChip(name, fileName) {
    return `<div><a class="kt-file" contenteditable="false" data-kt-file="${escapeHtml(name)}" data-name="${escapeHtml(fileName)}">📎 ${escapeHtml(fileName)}</a></div>`;
  },

  /* Gliederung -> HTML (Absätze, Listen, Checklisten, Tabellen, Bilder) */
  async blocksHtml(blocks, outline, rep, stats, ctx) {
    let out = '';
    const stack = []; // offene Listen {tag, depth, cls}
    const closeTo = (depth, tag, cls) => {
      while (stack.length) {
        const top = stack[stack.length - 1];
        if (top.depth > depth || (top.depth === depth && (top.tag !== tag || top.cls !== cls))) { out += `</${top.tag}>`; stack.pop(); }
        else break;
      }
    };
    for (const b of blocks) {
      const todo = b.tags.find(t => TODO_RE.test(t.label || '') || t.type != null && t.type < 100);
      const others = b.tags.filter(t => t !== todo);
      let prefix = '';
      for (const t of others) {
        const sym = (TAG_SYMBOLS.find(([re]) => re.test(t.label || '')) || [null, '🏷'])[1];
        prefix += `<span class="kt-tag" title="${escapeHtml(t.label || 'Markierung')}">${sym}</span> `;
        rep.set('Markierungen (Tags) als Symbol', (rep.get('Markierungen (Tags) als Symbol') || 0) + 1);
      }
      let inner = '';
      for (const c of b.content) inner += await this.contentHtml(c, outline, rep, stats, ctx);
      if (!inner) inner = '<br>';
      if (prefix) inner = inner.replace(/^(<(?:h[1-6]|div|blockquote|pre)[^>]*>)?/, (m) => (m || '') + prefix);
      if (todo) {
        closeTo(b.depth, 'ul', 'checklist');
        if (!stack.length || stack[stack.length - 1].depth < b.depth || stack[stack.length - 1].cls !== 'checklist') { out += '<ul class="checklist">'; stack.push({ tag: 'ul', depth: b.depth, cls: 'checklist' }); }
        out += `<li${todo.done ? ' class="done"' : ''}>${this.unwrap(inner)}</li>`;
        continue;
      }
      if (b.list) {
        const tag = b.list.numbered ? 'ol' : 'ul';
        closeTo(b.depth, tag, '');
        if (!stack.length || stack[stack.length - 1].depth < b.depth) { out += `<${tag}>`; stack.push({ tag, depth: b.depth, cls: '' }); }
        out += `<li>${this.unwrap(inner)}</li>`;
        continue;
      }
      closeTo(-1, '', '');
      let ind = 0;
      for (let k = 1; k <= b.depth; k++) ind += outline.indents[k] > 0 ? outline.indents[k] : 36;
      out += ind ? `<div style="margin-left:${Math.round(ind)}px">${inner}</div>` : inner;
    }
    closeTo(-1, '', '');
    return out;
  },
  unwrap(html) {
    const m = /^<div>([\s\S]*)<\/div>$/.exec(html);
    return m && !/<div/.test(m[1]) ? m[1] : html;
  },
  async contentHtml(c, outline, rep, stats, ctx) {
    if (c.type === 'p') return this.paraHtml(c);
    if (c.type === 'img') {
      if (c.missing || !c.data) return '';
      if (!/^image\/(png|jpeg|gif|webp|bmp|svg\+xml)$/.test(c.mime || '')) {
        const fname = (c.name || 'Bild') + (c.ext && !/\.\w+$/.test(c.name || '') ? c.ext : '');
        const fn = await this.saveBlob(c.data, c.mime, (c.ext || '.bin').replace('.', ''), false);
        stats.files++;
        return this.fileChip(fn, fname);
      }
      const name = await this.saveBlob(c.data, c.mime, (c.ext || '').replace('.', ''), true).catch(() => null);
      return name ? this.imgHtml(name, c, ctx, stats) : '';
    }
    if (c.type === 'file') {
      if (c.missing) return `<div>📎 ${escapeHtml(c.name)} (fehlt)</div>`;
      const name = await this.saveBlob(c.data, c.mime, (c.name.split('.').pop() || 'bin'), false);
      stats.files++;
      return this.fileChip(name, c.name);
    }
    if (c.type === 'table') {
      let h = '<table><tbody>';
      for (const row of c.rows) {
        h += '<tr>';
        row.forEach((cell, i) => {
          const css = [];
          if (c.cols[i]) css.push(`width:${Math.round(c.cols[i])}px`);
          if (cell.shade) css.push(`background-color:${cell.shade}`);
          if (!c.borders) css.push('border-color:transparent');
          h += `<td${css.length ? ` style="${css.join(';')}"` : ''}>__CELL__</td>`;
        });
        h += '</tr>';
      }
      h += '</tbody></table>';
      for (const row of c.rows) for (const cell of row) h = h.replace('__CELL__', (await this.blocksHtml(cell.blocks, { indents: [] }, rep, stats, ctx)) || '<br>');
      const tw = c.cols.reduce((a, b) => a + b, 0);
      ctx.maxImg = Math.max(ctx.maxImg, tw);
      return h + '<div><br></div>';
    }
    return '';
  },
  imgHtml(name, c, ctx, stats) {
    stats.images++;
    const w = Math.round(c.w || 0), h = Math.round(c.h || 0);
    ctx.maxImg = Math.max(ctx.maxImg, w);
    const css = w ? `width:${w}px${h ? `;height:${h}px` : ''}` : '';
    return `<div><img data-kt-src="${escapeHtml(name)}" alt="${escapeHtml(c.alt || '')}"${css ? ` style="${css}"` : ''}></div>`;
  },
  paraHtml(p) {
    const style = (p.style || '').toLowerCase();
    const hm = /^h([1-6])$/.exec(style);
    const tag = hm ? 'h' + hm[1] : style === 'code' ? 'pre' : 'div';
    // Absatzformat = OneNote-Standard der Vorlage, überschrieben durch die Angaben in der Datei
    const def = ON_STYLES[style] || ON_STYLES.p;
    const base = { ...def };
    for (const [k, v] of Object.entries(p.base || {})) if (v !== undefined && v !== '' && (v !== null || k === 'color')) base[k] = v;
    const pcss = [];
    if (base.font && !/^calibri$/i.test(base.font)) pcss.push(fontCss(base.font));
    if (base.size && base.size !== 11) pcss.push(`font-size:${base.size}pt`);
    if (base.color) pcss.push(`color:${base.color}`);
    if (base.b) pcss.push('font-weight:bold');
    if (base.i) pcss.push('font-style:italic');
    if (p.before) pcss.push(`margin-top:${+p.before.toFixed(2)}pt`);
    if (p.after) pcss.push(`margin-bottom:${+p.after.toFixed(2)}pt`);
    if (p.lineExact) pcss.push(`line-height:${+p.lineExact.toFixed(2)}pt`);
    if (p.align === 1) pcss.push('text-align:center');
    if (p.align === 2) pcss.push('text-align:right');
    let inner = '';
    for (const r of p.runs) {
      let t = escapeHtml(r.text).replace(/\r\n|\r|\n|\u000b/g, '<br>').replace(/\t/g, '&emsp;');
      const css = [];
      if (r.font && r.font !== base.font) css.push(fontCss(r.font));
      if (r.size && r.size !== base.size) css.push(`font-size:${r.size}pt`);
      if (r.color && r.color !== base.color) css.push(`color:${r.color}`);
      if (r.hl) css.push(`background-color:${r.hl}`);
      if (r.math) css.push('font-family:&quot;Cambria Math&quot;,&quot;STIX Two Math&quot;,serif');
      if (css.length) t = `<span style="${css.join(';')}">${t}</span>`;
      if (r.b && !base.b) t = `<b>${t}</b>`;
      if (r.b === false && base.b) t = `<span style="font-weight:normal">${t}</span>`;
      if (r.i && !base.i) t = `<i>${t}</i>`;
      if (r.u) t = `<u>${t}</u>`;
      if (r.s) t = `<strike>${t}</strike>`;
      if (r.sup) t = `<sup>${t}</sup>`;
      if (r.sub) t = `<sub>${t}</sub>`;
      if (r.href) t = `<a href="${escapeHtml(r.href)}">${t}</a>`;
      inner += t;
    }
    if (!inner) inner = '<br>';
    return `<${tag}${pcss.length ? ` style="${pcss.join(';')}"` : ''}>${inner}</${tag}>`;
  },
};

</script>
<script>
/* ---- js/onenote-write.js ---- */
'use strict';
/* OneNote-Dateien schreiben (Beta): Abschnitt (.one), Inhaltsverzeichnis (.onetoc2) und Notizbuch-Paket (.onepkg).
 * Aufbau nach [MS-ONESTORE] und [MS-ONE], nachgebildet an echten Dateien von OneNote (Microsoft 365).
 * Teil 1: Binärformat (unabhängig vom Browser, auch unter Node testbar)
 * Teil 2: KnowledgeTree-Seiten -> OneNote-Seiten (braucht die gerenderte Seite im Browser) */

const OneWrite = (() => {
  /* ================================================================ Hilfen */
  const rnd = (n) => { const a = new Uint8Array(n); (globalThis.crypto || require('crypto').webcrypto).getRandomValues(a); return a; };
  const newGuid = () => {
    const b = rnd(16);
    b[7] = (b[7] & 0x0F) | 0x40; b[8] = (b[8] & 0x3F) | 0x80;
    const h = [...b].map(x => x.toString(16).padStart(2, '0'));
    // Darstellung wie in der Datei gelesen (Data1-3 little endian)
    return `{${h[3]}${h[2]}${h[1]}${h[0]}-${h[5]}${h[4]}-${h[7]}${h[6]}-${h[8]}${h[9]}-${h.slice(10).join('')}}`.toUpperCase();
  };
  const guidBytes = (g) => {
    const s = g.replace(/[{}-]/g, '');
    const b = new Uint8Array(16);
    const hx = (i) => parseInt(s.substr(i * 2, 2), 16);
    b[0] = hx(3); b[1] = hx(2); b[2] = hx(1); b[3] = hx(0); b[4] = hx(5); b[5] = hx(4); b[6] = hx(7); b[7] = hx(6);
    for (let i = 8; i < 16; i++) b[i] = hx(i);
    return b;
  };
  const NIL = '{00000000-0000-0000-0000-000000000000}';

  let CRC_T = null;
  const crc32 = (u8, crc = 0) => {
    if (!CRC_T) { CRC_T = new Uint32Array(256); for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; CRC_T[i] = c >>> 0; } }
    let c = (crc ^ 0xFFFFFFFF) >>> 0;
    for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };
  /* MD5 nach RFC 1321 (für schreibgeschützte Objekte) */
  const md5 = (msg) => {
    const K = new Uint32Array(64), S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
    for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 2 ** 32) >>> 0;
    const len = msg.length, nb = ((len + 8) >>> 6) + 1;
    const m = new Uint8Array(nb * 64);
    m.set(msg); m[len] = 0x80;
    const dv = new DataView(m.buffer);
    dv.setUint32(nb * 64 - 8, (len * 8) >>> 0, true); dv.setUint32(nb * 64 - 4, Math.floor(len / 0x20000000), true);
    let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
    for (let o = 0; o < m.length; o += 64) {
      let A = a0, B = b0, C = c0, D = d0;
      for (let i = 0; i < 64; i++) {
        let F, g;
        if (i < 16) { F = (B & C) | (~B & D); g = i; } else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; } else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; } else { F = C ^ (B | ~D); g = (7 * i) % 16; }
        F = (F + A + K[i] + dv.getUint32(o + g * 4, true)) >>> 0;
        A = D; D = C; C = B;
        const sh = S[(i >> 4) * 4 + (i & 3)];
        B = (B + ((F << sh) | (F >>> (32 - sh)))) >>> 0;
      }
      a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0;
    }
    const out = new Uint8Array(16), ov = new DataView(out.buffer);
    ov.setUint32(0, a0, true); ov.setUint32(4, b0, true); ov.setUint32(8, c0, true); ov.setUint32(12, d0, true);
    return out;
  };
  const utf16z = (s) => { const b = new Uint8Array((s.length + 1) * 2); for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); b[i * 2] = c & 0xFF; b[i * 2 + 1] = c >> 8; } return b; };
  const utf16 = (s) => utf16z(s).subarray(0, s.length * 2);
  const CP1252_EXTRA = '€\u0081‚ƒ„…†‡ˆ‰Š‹Œ\u008DŽ\u008F\u0090‘’“”•–—˜™š›œ\u009DžŸ';
  const toCp1252 = (s) => {
    const b = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      if (c < 0x80 || (c >= 0xA0 && c <= 0xFF)) b[i] = c;
      else { const k = CP1252_EXTRA.indexOf(s[i]); if (k < 0) return null; b[i] = 0x80 + k; }
    }
    return b;
  };
  const f32 = (v) => { const b = new Uint8Array(4); new DataView(b.buffer).setFloat32(0, v, true); return b; };
  const u32b = (v) => { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, v >>> 0, true); return b; };
  const u64b = (v) => { const b = new Uint8Array(8); const dv = new DataView(b.buffer); dv.setUint32(0, Number(BigInt(v) & 0xFFFFFFFFn), true); dv.setUint32(4, Number(BigInt(v) >> 32n), true); return b; };
  const fileTime = (ms) => u64b((BigInt(Math.round(ms)) + 11644473600000n) * 10000n);
  const time32 = (ms) => u32b(Math.max(0, Math.floor(ms / 1000) - 315532800));
  const colorRef = (hex) => { const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); return m ? new Uint8Array([parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16), 0]) : new Uint8Array([0, 0, 0, 0xFF]); };

  class Out {
    constructor(cap = 4096) { this.b = new Uint8Array(cap); this.dv = new DataView(this.b.buffer); this.n = 0; }
    need(k) { if (this.n + k <= this.b.length) return; let c = this.b.length * 2; while (c < this.n + k) c *= 2; const nb = new Uint8Array(c); nb.set(this.b.subarray(0, this.n)); this.b = nb; this.dv = new DataView(nb.buffer); }
    u8(v) { this.need(1); this.b[this.n++] = v & 0xFF; return this; }
    u16(v) { this.need(2); this.dv.setUint16(this.n, v, true); this.n += 2; return this; }
    u32(v) { this.need(4); this.dv.setUint32(this.n, v >>> 0, true); this.n += 4; return this; }
